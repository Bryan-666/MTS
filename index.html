<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3370FF">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>铣削刀具销售知识刷题</title>
<style>
  :root{--blue:#3370FF;--bg:#F5F7FB;--card:#fff;--line:#E3E8F0;--txt:#1F2733;--sub:#6B7686;--green:#16A34A;--red:#E5484D;--amber:#F59E0B;--purple:#7C3AED;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;}
  .wrap{max-width:860px;margin:0 auto;padding:16px;}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  header h1{font-size:20px;}
  nav{display:flex;gap:8px;flex-wrap:wrap;}
  .settings{display:flex;gap:8px;align-items:center;}
  .settings select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);color:var(--txt);}
  nav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;color:var(--sub);}
  nav button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
  .muted{color:var(--sub);font-size:13px;}
  .btn{border:none;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--txt);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .opts{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .opt{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;}
  .opt:hover{border-color:var(--blue);}
  .opt.sel{border-color:var(--blue);background:#EEF3FF;}
  .opt.correct{border-color:var(--green);background:#EAF7EF;}
  .opt.wrong{border-color:var(--red);background:#FCEEEE;}
  .opt .key{font-weight:bold;min-width:22px;}
  .tag{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;margin-right:6px;}
  .tag.single{background:#EEF3FF;color:var(--blue);}
  .tag.multi{background:#F3EEFF;color:var(--purple);}
  .tag.judge{background:#EAF7EF;color:var(--green);}
  .tag.qa{background:#FFF4E5;color:var(--amber);}
  .stem{font-size:16px;margin-top:8px;}
  .qa-box{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;font-family:inherit;margin-top:12px;resize:vertical;}
  .feedback{margin-top:14px;border-radius:10px;padding:12px 14px;display:none;}
  .feedback.ok{background:#EAF7EF;border:1px solid var(--green);}
  .feedback.no{background:#FCEEEE;border:1px solid var(--red);}
  .explain{margin-top:8px;font-size:14px;color:var(--txt);}
  .explain b{color:var(--blue);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;}
  input[type=checkbox]{width:18px;height:18px;vertical-align:middle;margin-right:4px;cursor:pointer;}
  .row input,.row select{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  .type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px;}
  .type-card{position:relative;border:1px solid var(--line);border-radius:14px;padding:14px 12px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s;}
  .type-card:hover{border-color:var(--blue);}
  .type-card.sel{border-color:var(--blue);background:#EEF3FF;}
  .type-card input[type=checkbox]{position:absolute;opacity:0;pointer-events:none;}
  .type-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:8px;}
  .type-card .t-title{font-weight:700;font-size:14px;}
  .type-card .t-desc{color:var(--sub);font-size:12px;margin-top:2px;}
  .type-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;}
  .type-foot .cnt{font-weight:700;font-size:13px;}
  .type-foot .st{color:var(--sub);font-size:11.5px;}
  .progress{height:8px;background:#ECEFF4;border-radius:6px;overflow:hidden;margin:10px 0;}
  .progress>i{display:block;height:100%;background:var(--blue);width:0;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .stat{background:var(--bg);border-radius:12px;padding:16px;text-align:center;}
  .stat .num{font-size:26px;font-weight:bold;color:var(--blue);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;}
  th{color:var(--sub);font-weight:600;}
  .chip{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:3px 10px;}
  .score-big{font-size:40px;font-weight:bold;text-align:center;margin:10px 0;}
  .selfeval{display:flex;gap:10px;margin-top:10px;}
  .opt.disabled{pointer-events:none;}
  .qnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;max-height:128px;overflow-y:auto;}
  .qnav-btn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;color:var(--txt);}
  .qnav-btn.qnav-cur{border-color:var(--blue);background:#EEF3FF;font-weight:bold;}
  .qnav-btn.qnav-done{border-color:var(--amber);color:var(--amber);}
  .qnav-btn.qnav-ok{background:#EAF7EF;border-color:var(--green);color:var(--green);}
  .qnav-btn.qnav-no{background:#FCEEEE;border-color:var(--red);color:var(--red);}
  .star-btn{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:15px;padding:6px 10px;color:var(--sub);}
  .star-btn.on{color:var(--amber);border-color:var(--amber);background:#FFF4E5;}
  .star-btn.doubt-on{color:var(--purple);border-color:var(--purple);background:#F3EEFF;}
  .bar-row{display:flex;align-items:center;gap:10px;margin:12px 0;}
  .bar-label{width:96px;font-size:13px;}
  .bar-label.ch{width:124px;}
  .bar-track{flex:1;height:14px;background:#ECEFF4;border-radius:7px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--blue);border-radius:7px;}
  .bar-val{width:64px;font-size:13px;text-align:right;}
  .hidden{display:none;}
  /* 深色模式 */
  .dark{--bg:#12151C;--card:#1C212B;--line:#2E3542;--txt:#E6EAF0;--sub:#9AA5B5;}
  .dark .type-card,.dark .opt,.dark .btn-ghost,.dark .qnav-btn,.dark .qa-box{background:var(--card);}
  .dark .type-card{color:var(--txt);}
  .dark .stat{background:#161A22;}
  .dark .opt.sel{background:#26314A;}
  .dark .progress,.dark .bar-track{background:#2A303C;}
  .dark .star-btn.on{background:#3A2E12;}
  .dark .star-btn.doubt-on{background:#2A2140;}
  /* 字号档位 */
  .font-sm body{font-size:14px;}
  .font-sm .stem{font-size:15px;}
  .font-lg body{font-size:17px;}
  .font-lg .stem{font-size:18px;}
  /* 题号角标 */
  .qnav-btn.qnav-fav{border-color:var(--amber);color:var(--amber);}
  .qnav-btn.qnav-doubt{border-color:var(--purple);color:var(--purple);}
  .qnav-btn .mk{font-size:9px;margin-left:1px;}
  /* 选项触控加大 */
  .opt{min-height:48px;padding:14px 16px;}
  @media(max-width:600px){
    .opt{min-height:52px;padding:14px 14px;font-size:15px;}
    .qnav-btn{width:34px;height:34px;}
  }
    .wrap{padding:10px;}
    header h1{font-size:17px;}
    nav{gap:6px;}
    nav button{padding:7px 10px;font-size:13px;}
    .opt{padding:11px 12px;}
    .btn{padding:10px 14px;}
    .stem{font-size:15px;}
    .bar-label{width:78px;}
    .type-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>铣削刀具销售知识刷题</h1>
    <nav id="nav">
      <button data-view="practice" class="active">刷题练习</button>
      <button data-view="review">背题模式</button>
      <button data-view="exam">模拟考试</button>
      <button data-view="wrong">错题本</button>
      <button data-view="fav">收藏</button>
      <button data-view="stats">成绩统计</button>
    </nav>
    <div class="settings">
      <select id="setFont" title="字号">
        <option value="sm">小字</option><option value="mid">中字</option><option value="lg">大字</option>
      </select>
      <button id="setDark" class="btn btn-ghost" style="padding:6px 10px;font-size:13px">🌙 深色</button>
    </div>
  </header>
  <div id="app"></div>
</div>

<script>
const DATA = {"single":[{"no":1,"stem":"ISO 513 标准把被加工材料分为（ ）大组。","options":[{"key":"A","text":"3"},{"key":"B","text":"5"},{"key":"C","text":"7"},{"key":"D","text":"9"}],"answer":["C"],"explain":"ISO 513 按切削行为把材料分为 P 钢、M 不锈钢、K 铸铁、N 有色金属、S 耐热合金/钛、H 淬硬钢等大组，另把塑料、石墨、CFRP 等归入 O 其他/非金属，共七组口径。","chapter":"material"},{"no":2,"stem":"客户说工件材料是 45 钢，它属于 ISO 513 的（ ）。","options":[{"key":"A","text":"P 组（钢）"},{"key":"B","text":"M 组（不锈钢）"},{"key":"C","text":"K 组（铸铁）"},{"key":"D","text":"N 组（有色金属）"}],"answer":["A"],"explain":"45 钢是典型碳钢，切屑长、属 P 组（钢）；不要因为带“钢”字以外的牌号混淆，不锈钢才归 M。","chapter":"material"},{"no":3,"stem":"客户说加工 304 不锈钢，它属于（ ）。","options":[{"key":"A","text":"P 组"},{"key":"B","text":"M 组"},{"key":"C","text":"K 组"},{"key":"D","text":"N 组"}],"answer":["B"],"explain":"304 是奥氏体不锈钢，归 M 组；判断关键看是否不锈钢，而不是名字里有没有“钢”。","chapter":"material"},{"no":4,"stem":"客户加工 HT200 灰铸铁，它属于（ ）。","options":[{"key":"A","text":"P 组"},{"key":"B","text":"M 组"},{"key":"C","text":"K 组"},{"key":"D","text":"N 组"}],"answer":["C"],"explain":"HT200 灰铸铁切屑崩碎、表皮夹砂，归 K 组（铸铁）。","chapter":"material"},{"no":5,"stem":"客户加工 6061 铝合金，它属于（ ）。","options":[{"key":"A","text":"P 组"},{"key":"B","text":"M 组"},{"key":"C","text":"K 组"},{"key":"D","text":"N 组"}],"answer":["D"],"explain":"6061 是铝合金，软而粘、切屑量大，归 N 组（有色金属）。","chapter":"material"},{"no":6,"stem":"客户加工钛合金 TC4，它属于（ ）。","options":[{"key":"A","text":"M 组"},{"key":"B","text":"N 组"},{"key":"C","text":"S 组（耐热合金）"},{"key":"D","text":"H 组（淬硬钢）"}],"answer":["C"],"explain":"TC4 钛合金导热差、化学活泼，归 S 组（耐热合金/钛），不要误归 N 有色金属。","chapter":"material"},{"no":7,"stem":"客户加工淬硬到 HRC 60 的模具钢，它属于（ ）。","options":[{"key":"A","text":"P 组"},{"key":"B","text":"K 组"},{"key":"C","text":"S 组"},{"key":"D","text":"H 组"}],"answer":["D"],"explain":"淬硬到 HRC 60 的模具钢属硬材料，归 H 组。","chapter":"material"},{"no":8,"stem":"客户加工 PEEK 工程塑料、石墨电极，这类材料属于（ ）。","options":[{"key":"A","text":"N 组"},{"key":"B","text":"O 组（其他/非金属）"},{"key":"C","text":"S 组"},{"key":"D","text":"H 组"}],"answer":["B"],"explain":"PEEK 塑料、石墨电极、CFRP 碳纤维都不是金属，归 O 组（其他/非金属）。","chapter":"material"},{"no":9,"stem":"P 组材料（如 45 钢）切削时最常见的难点是（ ）。","options":[{"key":"A","text":"塑性好、切屑长，中低速易产生积屑瘤"},{"key":"B","text":"导热极差"},{"key":"C","text":"磨粒磨损剧烈"},{"key":"D","text":"容易崩边"}],"answer":["B"],"explain":"P 组碳钢塑性好、切屑长，中低速容易冷焊形成积屑瘤；导热差是 S 组的特点，磨粒磨损剧烈多见于铸铁/高硅铝，容易崩边多见于脆硬材料。","chapter":"material"},{"no":10,"stem":"客户加工 304 不锈钢最常见的两个工艺问题是（ ）。","options":[{"key":"A","text":"粘刀与加工硬化"},{"key":"B","text":"工件带静电"},{"key":"C","text":"氧化皮脱落"},{"key":"D","text":"材料太软切不动"}],"answer":["A"],"explain":"304 不锈钢最突出的两个工艺难题是粘刀（粘结）和加工硬化，与静电、氧化皮无关。","chapter":"material"},{"no":11,"stem":"TiAlN 涂层的突出特点是（ ）。","options":[{"key":"A","text":"润滑性最好"},{"key":"B","text":"只适合加工铝"},{"key":"C","text":"耐热性好，适合高速与干式切削"},{"key":"D","text":"硬度低于 TiN"}],"answer":["C"],"explain":"TiAlN 在高温下铝元素氧化生成致密 Al₂O₃ 保护膜，耐热抗氧化，适合高速和干式切削；它润滑性不突出，也不只用于铝，硬度并不低于 TiN。","chapter":"material_tool"},{"no":12,"stem":"硬质合金刀具的主要成分是（ ）。","options":[{"key":"A","text":"碳化钨 WC + 钴 Co"},{"key":"B","text":"氧化铝"},{"key":"C","text":"金刚石"},{"key":"D","text":"高速钢"}],"answer":["A"],"explain":"硬质合金主要由碳化钨 WC（提供硬度、耐磨）和钴 Co（粘结相、提供韧性）组成，没有第三种神秘配方。","chapter":"material_tool"},{"no":13,"stem":"刀具涂层的作用不包括（ ）。","options":[{"key":"A","text":"提高表面硬度"},{"key":"B","text":"降低摩擦、防粘"},{"key":"C","text":"显著提高基体抗弯强度"},{"key":"D","text":"耐热抗氧化"}],"answer":["C"],"explain":"涂层只改善表面硬度、摩擦、耐热和化学惰性，不提高基体的抗弯强度；基体一旦崩，再硬的涂层也会一起掉。","chapter":"material_tool"},{"no":14,"stem":"客户问\"高速钢刀和硬质合金刀哪个好\"，较准确的回答是（ ）。","options":[{"key":"A","text":"高速钢全面更好"},{"key":"B","text":"看工况：高速钢韧性好可重磨、适合低速；硬质合金耐热好、适合数控高速铣削"},{"key":"C","text":"两者没区别"},{"key":"D","text":"只看价格"}],"answer":["B"],"explain":"两者各有适用工况：高速钢韧性好、可重磨，适合低速重磨工况；硬质合金红硬性好、适合数控高速铣削。不能说谁全面更好，也与价格无关。","chapter":"material_tool"},{"no":15,"stem":"PCD（金刚石）刀具最适合加工（ ）。","options":[{"key":"A","text":"45 钢"},{"key":"B","text":"淬硬钢"},{"key":"C","text":"铝合金、高硅铝、石墨"},{"key":"D","text":"不锈钢"}],"answer":["C"],"explain":"PCD 聚晶金刚石最适合铝合金、高硅铝、石墨、CFRP；不能加工钢、不锈钢、钛合金，因为高温下碳与铁亲和会快速石墨化磨损。","chapter":"material_tool"},{"no":16,"stem":"CBN 刀具最适合加工（ ）。","options":[{"key":"A","text":"铝合金"},{"key":"B","text":"淬硬钢 HRC 50–65"},{"key":"C","text":"塑料"},{"key":"D","text":"紫铜"}],"answer":["B"],"explain":"CBN 立方氮化硼适合淬硬钢 HRC 50–65 和铸铁；不适合铝、铜等软金属，易粘刀崩刃。","chapter":"material_tool"},{"no":17,"stem":"客户问\"铣不锈钢用什么涂层刀具\"，较合适的推荐是（ ）。","options":[{"key":"A","text":"金刚石涂层"},{"key":"B","text":"任何涂层都一样"},{"key":"C","text":"不需要涂层"},{"key":"D","text":"含铝韧性涂层（AlCrN/AlTiN）配锋利刃口"}],"answer":["D"],"explain":"不锈钢粘刀又硬化，宜用含铝韧性涂层（AlCrN/AlTiN）配锋利刃口；金刚石涂层不适合不锈钢，也不是“任何涂层都一样”。","chapter":"material_tool"},{"no":18,"stem":"金刚石（类）涂层刀具能不能加工钢件？（ ）","options":[{"key":"A","text":"可以，效果很好"},{"key":"B","text":"不可以，高温下碳与铁亲和，磨损极快"},{"key":"C","text":"看价格"},{"key":"D","text":"只适合粗加工"}],"answer":["B"],"explain":"金刚石类刀具不能加工钢件：高温下碳与铁化学亲和，磨损极快；与价格、粗精加工无关。","chapter":"material_tool"},{"no":19,"stem":"客户报材料\"HB 230 的调质件\"，HB 指的是（ ）。","options":[{"key":"A","text":"洛氏硬度"},{"key":"B","text":"布氏硬度"},{"key":"C","text":"维氏硬度"},{"key":"D","text":"莫氏硬度"}],"answer":["B"],"explain":"HB 是布氏硬度，用钢球压痕，测退火/调质钢、铸铁毛坯的平均硬度；HRC 才是洛氏，HV 是维氏。","chapter":"material"},{"no":20,"stem":"淬硬钢常用 HRC 60 表示硬度，HRC 是（ ）。","options":[{"key":"A","text":"布氏硬度"},{"key":"B","text":"洛氏硬度"},{"key":"C","text":"维氏硬度"},{"key":"D","text":"肖氏硬度"}],"answer":["B"],"explain":"HRC 是洛氏 C 标尺，量程约 20–68，是淬硬钢的通用硬度标尺。","chapter":"material"},{"no":21,"stem":"客户说\"这批料比以前硬了\"，对切削参数的正确建议方向是（ ）。","options":[{"key":"A","text":"提高转速"},{"key":"B","text":"适当降低切削速度"},{"key":"C","text":"加大切深"},{"key":"D","text":"不用改"}],"answer":["B"],"explain":"材料更硬时应适当降低切削速度：硬度越高刀具磨损越快，不能靠提转速、加大切深硬冲。","chapter":"material"},{"no":22,"stem":"下列材料中导热最差、切削热最容易集中在刀尖的是（ ）。","options":[{"key":"A","text":"铝合金"},{"key":"B","text":"钛合金"},{"key":"C","text":"灰铸铁"},{"key":"D","text":"黄铜"}],"answer":["B"],"explain":"钛合金导热最差，切削热传不进工件也传不进切屑，最容易集中在刀尖；铝、黄铜导热好，铸铁尚可。","chapter":"material"},{"no":23,"stem":"客户问\"P20 是什么材料\"，正确回答是（ ）。","options":[{"key":"A","text":"不锈钢"},{"key":"B","text":"铝合金"},{"key":"C","text":"预硬塑料模具钢"},{"key":"D","text":"铸铁"}],"answer":["C"],"explain":"P20 是预硬塑料模具钢，预硬态归 P 组；它不是不锈钢、铝合金或铸铁。","chapter":"material"},{"no":24,"stem":"高硅铝合金（Si>12%）不能用普通硬质合金加工的原因是（ ）。","options":[{"key":"A","text":"硅相磨粒磨损剧烈，刀具寿命极短"},{"key":"B","text":"材料太软"},{"key":"C","text":"刀具太贵"},{"key":"D","text":"材料粘刀"}],"answer":["A"],"explain":"高硅铝合金中硅相硬度很高，对普通硬质合金形成剧烈磨粒磨损，寿命极短；原因不是软、粘或价格贵，需改用 PCD/金刚石涂层。","chapter":"material"},{"no":25,"stem":"客户问\"铣削和车削有什么区别\"，正确的是（ ）。","options":[{"key":"A","text":"铣削主运动是刀具旋转、断续切削；车削是工件旋转"},{"key":"B","text":"两者一样"},{"key":"C","text":"铣削是工件旋转"},{"key":"D","text":"没有区别"}],"answer":["A"],"explain":"铣削主运动是刀具旋转、属断续切削；车削是工件旋转、刀具进给。两者主运动不同。","chapter":"parameter"},{"no":26,"stem":"每齿进给量 fz 的单位是（ ）。","options":[{"key":"A","text":"mm/min"},{"key":"B","text":"mm/z"},{"key":"C","text":"m/min"},{"key":"D","text":"r/min"}],"answer":["B"],"explain":"fz 是每齿进给量，单位 mm/z；vf 进给速度是 mm/min，vc 切削速度是 m/min，n 转速是 r/min，别混用。","chapter":"parameter"},{"no":27,"stem":"客户订单写\"D12 四刃立铣刀\"，D12 指（ ）。","options":[{"key":"A","text":"刃长 12 mm"},{"key":"B","text":"刀具直径 12 mm"},{"key":"C","text":"总长 12 mm"},{"key":"D","text":"柄径 12 mm"}],"answer":["B"],"explain":"型号里的 D 指刀具直径，D12 即直径 12 mm；不是刃长、总长或柄径。","chapter":"tool_type"},{"no":28,"stem":"下列不属于铣刀常见涂层的是（ ）。","options":[{"key":"A","text":"TiAlN"},{"key":"B","text":"AlCrN"},{"key":"C","text":"DLC"},{"key":"D","text":"不锈钢"}],"answer":["D"],"explain":"常见铣刀涂层有 TiN、TiAlN、AlCrN、DLC 等；“不锈钢”是工件材料，不是涂层。","chapter":"material_tool"},{"no":29,"stem":"客户问\"为什么同一把刀铣铝和铣钢的参数差很多\"，核心原因是（ ）。","options":[{"key":"A","text":"材料切削行为不同，参数要按材料分组调整"},{"key":"B","text":"刀具价格不同"},{"key":"C","text":"机床品牌不同"},{"key":"D","text":"没有原因"}],"answer":["A"],"explain":"同一把刀铣铝和铣钢参数差很多，核心是材料切削行为（组别）不同，vc 起点和进给要按材料分组调整，与价格、机床品牌无关。","chapter":"material"},{"no":30,"stem":"销售人员给客户推荐刀具前，最需要先确认的信息是（ ）。","options":[{"key":"A","text":"只问预算"},{"key":"B","text":"只问交期"},{"key":"C","text":"只看样品照片"},{"key":"D","text":"材料牌号与状态、加工特征、粗精与工况、机床条件"}],"answer":["D"],"explain":"推荐刀具前最需要先确认材料牌号与状态、加工特征、粗精加工与工况、机床条件；只问预算、交期或看样品照片都不够。","chapter":"sales"},{"no":31,"stem":"立铣刀的主要用途是（ ）。","options":[{"key":"A","text":"只有平面"},{"key":"B","text":"侧面、槽与轮廓铣削"},{"key":"C","text":"只有孔加工"},{"key":"D","text":"只有螺纹"}],"answer":["B"],"explain":"立铣刀负责侧面、槽、轮廓和台阶面，是铣削的万能刀；不专门做平面、孔或螺纹。","chapter":"tool_type"},{"no":32,"stem":"球头铣刀的主要用途是（ ）。","options":[{"key":"A","text":"三维曲面精铣"},{"key":"B","text":"大面积开粗"},{"key":"C","text":"钻孔"},{"key":"D","text":"倒角"}],"answer":["A"],"explain":"球头刀用于三维曲面精铣和圆角过渡；不适合开粗、钻孔或倒角。","chapter":"tool_type"},{"no":33,"stem":"圆鼻刀（牛鼻刀）的结构特点是（ ）。","options":[{"key":"A","text":"刃口全是尖角"},{"key":"B","text":"只能铣平面"},{"key":"C","text":"底角带圆角 R，兼顾刀尖强度与仿形"},{"key":"D","text":"只能钻孔"}],"answer":["C"],"explain":"圆鼻刀（牛鼻刀）是平底加底角圆角 R，把尖角应力分散、抗崩性好，兼顾刚性与仿形；它清不出直角死角。","chapter":"tool_type"},{"no":34,"stem":"面铣刀（可转位刀盘）的主要用途是（ ）。","options":[{"key":"A","text":"小孔加工"},{"key":"B","text":"螺纹加工"},{"key":"C","text":"曲面加工"},{"key":"D","text":"大面积平面铣削"}],"answer":["D"],"explain":"面铣刀（可转位刀盘）用于大面积平面铣削；不做小孔、螺纹或曲面。","chapter":"tool_type"},{"no":35,"stem":"键槽铣刀与普通立铣刀的关键区别是（ ）。","options":[{"key":"A","text":"端刃过中心，可垂直下刀"},{"key":"B","text":"价格更低"},{"key":"C","text":"刃数更多"},{"key":"D","text":"直径更大"}],"answer":["A"],"explain":"键槽铣刀端刃过中心，中心处也有切削速度，可以垂直下刀；普通立铣刀端刃不过中心，这是关键区别。","chapter":"tool_type"},{"no":36,"stem":"倒角刀的作用是（ ）。","options":[{"key":"A","text":"铣大平面"},{"key":"B","text":"孔口与棱边倒角"},{"key":"C","text":"钻中心孔"},{"key":"D","text":"铰孔"}],"answer":["B"],"explain":"倒角刀用于孔口与棱边倒角、去毛刺、沉头孔；不能铣平面，也不承担钻中心孔。","chapter":"tool_type"},{"no":37,"stem":"客户要加工 M6、M8、M10 三种螺纹孔，每种数量不多，较经济的推荐是（ ）。","options":[{"key":"A","text":"每种规格买专用丝锥"},{"key":"B","text":"用钻头直接钻"},{"key":"C","text":"螺纹铣刀（一把刀可加工多种规格）"},{"key":"D","text":"用铰刀"}],"answer":["C"],"explain":"三种规格、每种数量不多时，用螺纹铣刀更经济：一把刀可加工多种孔径与螺距；每种规格买专用丝锥不划算，钻头、铰刀不能做螺纹。","chapter":"tool_type"},{"no":38,"stem":"客户要攻大量 M8 盲孔螺纹，应优先考虑（ ）。","options":[{"key":"A","text":"螺旋槽丝锥（排屑向孔口）"},{"key":"B","text":"直槽丝锥"},{"key":"C","text":"手攻"},{"key":"D","text":"镗刀"}],"answer":["A"],"explain":"大量盲孔螺纹优先螺旋槽丝锥，排屑向孔口排出，避免切屑挤在盲孔底部；直槽丝锥更适合通孔。","chapter":"tool_type"},{"no":39,"stem":"点钻（定心钻）的作用是（ ）。","options":[{"key":"A","text":"孔口倒角"},{"key":"B","text":"铰孔"},{"key":"C","text":"铣小平面"},{"key":"D","text":"打定心窝，为麻花钻导向"}],"answer":["D"],"explain":"点钻（定心钻）只打定心窝，为麻花钻导向、防止入钻偏移；不负责倒角、铰孔或铣平面。","chapter":"tool_type"},{"no":40,"stem":"点钻锥角与麻花钻锋角的关系铁律是（ ）。","options":[{"key":"A","text":"锥角越小越好"},{"key":"B","text":"锥角必须 ≥ 锋角（如 120° 点钻配 118° 麻花钻）"},{"key":"C","text":"锥角略小于锋角更易切入"},{"key":"D","text":"两者无关"}],"answer":["B"],"explain":"点钻锥角必须 ≥ 麻花钻锋角（如 120° 点钻配 118° 麻花钻），否则钻尖会打滑偏移；不是越小越好。","chapter":"tool_type"},{"no":41,"stem":"铰刀的作用是（ ）。","options":[{"key":"A","text":"对已有孔扩铰，提高孔径精度与表面质量"},{"key":"B","text":"在实体材料上钻孔"},{"key":"C","text":"倒角"},{"key":"D","text":"铣槽"}],"answer":["A"],"explain":"铰刀对已有孔扩铰，提高孔径精度与表面质量；不能在实体材料上钻孔，也不能校正孔位偏差。","chapter":"tool_type"},{"no":42,"stem":"铰孔前预孔一般预留的铰削余量约为（ ）。","options":[{"key":"A","text":"1–2 mm"},{"key":"B","text":"0.01 mm"},{"key":"C","text":"0.1–0.2 mm"},{"key":"D","text":"不需要留余量"}],"answer":["C"],"explain":"铰孔前一般留 0.1–0.2 mm 铰削余量（小孔偏小）；1–2 mm 太大铰不动，0.01 mm 太小磨不到。","chapter":"tool_type"},{"no":43,"stem":"客户做高速高精铣削、深腔清角，跳动最小、刚性最好的刀柄是（ ）。","options":[{"key":"A","text":"侧固式"},{"key":"B","text":"热缩刀柄"},{"key":"C","text":"普通弹簧夹头"},{"key":"D","text":"钻夹头"}],"answer":["B"],"explain":"高速高精、深腔清角要求跳动最小、刚性最好，选热缩刀柄；侧固、ER 夹头、钻夹头跳动或刚性都不及。","chapter":"holder"},{"no":44,"stem":"弹簧夹头（ER）的典型径向跳动为（ ）。","options":[{"key":"A","text":"0.005–0.02 mm"},{"key":"B","text":"0.05–0.1 mm"},{"key":"C","text":"0.002 mm 以内"},{"key":"D","text":"没有跳动"}],"answer":["A"],"explain":"ER 弹簧夹头典型径向跳动约 0.005–0.02 mm，属通用水平；0.05–0.1 mm 偏大，热缩/液压才能到 0.003 以内。","chapter":"holder"},{"no":45,"stem":"侧固式（削平柄）刀柄适合的场合是（ ）。","options":[{"key":"A","text":"镜面精加工"},{"key":"B","text":"高速动平衡加工"},{"key":"C","text":"精密铰孔"},{"key":"D","text":"大扭矩重切削粗铣"}],"answer":["D"],"explain":"侧固式（削平柄）夹持刚性高、适合大扭矩重切削粗铣；不适合镜面精铣、高速动平衡或精密铰孔。","chapter":"holder"},{"no":46,"stem":"HSK 刀柄的定位方式是（ ）。","options":[{"key":"A","text":"仅靠锥面"},{"key":"B","text":"短锥面 + 端面双定位"},{"key":"C","text":"螺纹连接"},{"key":"D","text":"焊接"}],"answer":["B"],"explain":"HSK 刀柄是短锥面加端面双定位，刚性和重复定位精度高；不是仅靠锥面、螺纹或焊接。","chapter":"holder"},{"no":47,"stem":"装刀后程序中必须调用的补偿指令是（ ）。","options":[{"key":"A","text":"G02"},{"key":"B","text":"M08"},{"key":"C","text":"G43（刀具长度补偿）"},{"key":"D","text":"G28"}],"answer":["C"],"explain":"装刀后程序必须调用 G43 刀具长度补偿；G02 是圆弧插补，M08 是开冷却，G28 是回参考点。","chapter":"holder"},{"no":48,"stem":"不同标准的拉钉（BT/SK/HSK 等）（ ）。","options":[{"key":"A","text":"不能混用"},{"key":"B","text":"可以随意混用"},{"key":"C","text":"加垫片就能混用"},{"key":"D","text":"与刀柄无关"}],"answer":["A"],"explain":"BT、SK、HSK 等标准拉钉尺寸与锥柄不同，不能混用，加垫片也不行。","chapter":"holder"},{"no":49,"stem":"精铣对刀具径向跳动的通常要求是（ ）。","options":[{"key":"A","text":"≤0.2 mm"},{"key":"B","text":"≤0.02 mm"},{"key":"C","text":"无要求"},{"key":"D","text":"越大越好"}],"answer":["B"],"explain":"精铣对径向跳动要求通常 ≤0.02 mm；0.2 mm 偏大，跳动会一比一叠加到每一齿上。","chapter":"holder"},{"no":50,"stem":"2 刃铣刀的突出特点是（ ）。","options":[{"key":"A","text":"更耐磨"},{"key":"B","text":"只能精加工"},{"key":"C","text":"容屑槽大，适合软材料大切屑"},{"key":"D","text":"芯厚最大、刚性最高"}],"answer":["C"],"explain":"2 刃铣刀容屑槽最大、适合软材料大切屑；它芯厚小、刚性低，并不最耐磨，刚性也不是最高。","chapter":"tool_type"},{"no":51,"stem":"钢件通用粗精加工最常用的刃数是（ ）。","options":[{"key":"A","text":"4 刃"},{"key":"B","text":"2 刃"},{"key":"C","text":"8 刃"},{"key":"D","text":"1 刃"}],"answer":["A"],"explain":"钢件通用粗精加工最常用 4 刃，排屑与刚性平衡最好；2 刃偏软料，8 刃偏精铣高硬度。","chapter":"tool_type"},{"no":52,"stem":"铝合金高效切削常用的刀具是（ ）。","options":[{"key":"A","text":"6 刃钢用刀"},{"key":"B","text":"3 刃大螺旋锋利刃"},{"key":"C","text":"负前角重载刀"},{"key":"D","text":"陶瓷刀"}],"answer":["B"],"explain":"铝合金高效切削用 3 刃大螺旋锋利刃；6 刃排屑空间小，负前角重载刀和陶瓷刀都不适合软铝。","chapter":"tool_type"},{"no":53,"stem":"淬硬钢精铣常用的刀具系列是（ ）。","options":[{"key":"A","text":"55° 通用正前角系列"},{"key":"B","text":"铝用大螺旋系列"},{"key":"C","text":"铸铁专用系列"},{"key":"D","text":"65°/68° 负前角小切宽系列"}],"answer":["D"],"explain":"淬硬钢精铣用 65°/68° 负前角、小切宽系列，抗崩耐磨；通用正前角、铝用大螺旋、铸铁专用系列都不匹配。","chapter":"tool_type"},{"no":54,"stem":"TiAlN 涂层的典型颜色与适用场景是（ ）。","options":[{"key":"A","text":"黑紫色，适合钢类高速与干式切削"},{"key":"B","text":"金色，专用于铝"},{"key":"C","text":"绿色，专用于塑料"},{"key":"D","text":"无色透明"}],"answer":["A"],"explain":"TiAlN 涂层多呈黑紫色，适合钢类高速与干式切削；金色一般是 TiN，绿色/无色对应其他涂层。","chapter":"material_tool"},{"no":55,"stem":"客户说\"刀总是崩\"，关于涂层正确的说法是（ ）。","options":[{"key":"A","text":"换更硬的涂层就能解决"},{"key":"B","text":"崩刃与涂层完全无关、也没法改善"},{"key":"C","text":"涂层不提高基体抗冲击能力，应先查基体、几何与切削工况"},{"key":"D","text":"涂层越贵越好"}],"answer":["C"],"explain":"崩刃要先查基体、几何和切削工况；涂层不提高基体抗冲击能力，换更硬或更贵的涂层解决不了崩刃。","chapter":"material_tool"},{"no":56,"stem":"销售人员推荐刀具的正确顺序是（ ）。","options":[{"key":"A","text":"先报最低价"},{"key":"B","text":"先问材料与工况，再定刀型/涂层/刃数，最后谈价格与交期"},{"key":"C","text":"只推库里最贵的"},{"key":"D","text":"让客户自己挑"}],"answer":["B"],"explain":"正确顺序是先问材料与工况，再定刀型、涂层、刃数，最后才谈价格与交期；不能先报最低价或只推最贵库存。","chapter":"sales"},{"no":57,"stem":"整体硬质合金刀与可转位刀片刀的区别是（ ）。","options":[{"key":"A","text":"整体式一体成型、刚性好、适合中小直径；可转位换刃成本低、适合大直径面铣"},{"key":"B","text":"没有区别"},{"key":"C","text":"整体式只能粗加工"},{"key":"D","text":"刀片式精度一定更高"}],"answer":["A"],"explain":"整体硬质合金刀一体成型、刚性好，适合中小直径；可转位刀片刀换刃成本低、适合大直径面铣。可转位并不精度一定更高。","chapter":"tool_type"},{"no":58,"stem":"客户加工深腔、排屑困难，刀具配置上最好推荐（ ）。","options":[{"key":"A","text":"无涂层刀具"},{"key":"B","text":"更大直径刀具"},{"key":"C","text":"更长悬伸的普通刀"},{"key":"D","text":"内冷孔刀具 + 大流量高压内冷"}],"answer":["D"],"explain":"深腔排屑困难时，最好配内冷孔刀具加大流量高压内冷；长悬伸普通刀、无涂层刀或加大直径都解决不了排屑。","chapter":"sales"},{"no":59,"stem":"谈刀具价格与寿命时，给客户的正确建议是（ ）。","options":[{"key":"A","text":"越便宜越好"},{"key":"B","text":"综合单件成本（刀具价 × 更换次数 + 停机与废品损失），不只看采购价"},{"key":"C","text":"越贵越好"},{"key":"D","text":"寿命不重要"}],"answer":["B"],"explain":"看刀具要算综合单件成本：刀具价 × 更换次数，再加停机与废品损失，不能只看采购价，也不是越贵越好。","chapter":"sales"},{"no":60,"stem":"客户问\"同一把刀能不能铣不同材料\"，正确回答是（ ）。","options":[{"key":"A","text":"完全通用"},{"key":"B","text":"绝对不行"},{"key":"C","text":"可以使用但有最佳适用范围，跨材料组的加工应换专用刀具"},{"key":"D","text":"无所谓"}],"answer":["C"],"explain":"刀具存在最佳适用范围，跨材料组加工应换专用刀具；既不是完全通用，也不是绝对不能用。","chapter":"sales"},{"no":61,"stem":"转速公式 n = 1000vc/(πD)（π 取 3.14），vc = 100 m/min、D = 10 mm 时，n 约为（ ）。","options":[{"key":"A","text":"318 r/min"},{"key":"B","text":"1000 r/min"},{"key":"C","text":"3183 r/min"},{"key":"D","text":"31830 r/min"}],"answer":["C"],"explain":"n = 1000vc/(πD) = 1000×100/(3.14×10)，约 3180 r/min 量级；注意单位换算，别把小数点算错一位。","chapter":"parameter"},{"no":62,"stem":"进给速度 vf 与 fz、z（刃数）、n 的关系是（ ）。","options":[{"key":"A","text":"vf = fz × z × n"},{"key":"B","text":"vf = fz × n ÷ z"},{"key":"C","text":"vf = n × z ÷ fz"},{"key":"D","text":"vf = fz × z ÷ n"}],"answer":["A"],"explain":"进给速度 vf = fz × z × n（每齿进给 × 刃数 × 转速）。","chapter":"parameter"},{"no":63,"stem":"D12 四刃铣刀，fz = 0.06 mm/z，n = 3000 r/min，vf =（ ）。","options":[{"key":"A","text":"720 mm/min"},{"key":"B","text":"360 mm/min"},{"key":"C","text":"216 mm/min"},{"key":"D","text":"1440 mm/min"}],"answer":["A"],"explain":"vf = 0.06 × 4 × 3000 = 720 mm/min。","chapter":"parameter"},{"no":64,"stem":"转速不变、刀具直径加大一倍，切削速度（ ）。","options":[{"key":"A","text":"增加一倍"},{"key":"B","text":"减半"},{"key":"C","text":"不变"},{"key":"D","text":"变为四倍"}],"answer":["A"],"explain":"n 不变时，vc = πDn/1000 随直径 D 成正比，直径加大一倍，切削速度增加一倍。","chapter":"parameter"},{"no":65,"stem":"切削速度不变、刀具直径加大一倍，主轴转速（ ）。","options":[{"key":"A","text":"加倍"},{"key":"B","text":"减半"},{"key":"C","text":"不变"},{"key":"D","text":"平方关系"}],"answer":["B"],"explain":"vc 不变时，n = 1000vc/(πD) 与直径成反比，直径加大一倍，主轴转速减半。","chapter":"parameter"},{"no":66,"stem":"客户问\"转速是高好还是低好\"，正确的回答方向是（ ）。","options":[{"key":"A","text":"越高越好"},{"key":"B","text":"越低越好"},{"key":"C","text":"先按材料定切削速度起点，再结合机床约束定转速，不是越高越好"},{"key":"D","text":"无所谓"}],"answer":["C"],"explain":"转速不是越高越好：先按材料定切削速度起点，再结合机床转速上限等约束确定转速。","chapter":"parameter"},{"no":67,"stem":"切削速度过高的最常见后果是（ ）。","options":[{"key":"A","text":"一定崩刃"},{"key":"B","text":"切削温度高、磨损加快、刀具寿命缩短"},{"key":"C","text":"表面一定更好"},{"key":"D","text":"功率一定不足"}],"answer":["B"],"explain":"切削速度过高最常见后果是切削温度升高、磨损加快、刀具寿命缩短；不一定崩刃，也不保证表面更好。","chapter":"parameter"},{"no":68,"stem":"每齿进给量过小（切屑厚度低于刃口钝圆）的后果是（ ）。","options":[{"key":"A","text":"效率更高"},{"key":"B","text":"刀具寿命更长"},{"key":"C","text":"没有影响"},{"key":"D","text":"刀刃挤压滑擦，表面变差、磨损加快"}],"answer":["D"],"explain":"fz 过小、切屑厚度薄到刃口钝圆以下时，刀刃变成挤压滑擦，表面变差、磨损加快；不是越小越光越省。","chapter":"parameter"},{"no":69,"stem":"满槽切削的进给速度一般应比侧铣（ ）。","options":[{"key":"A","text":"降低约 50%"},{"key":"B","text":"提高 50%"},{"key":"C","text":"保持不变"},{"key":"D","text":"加倍"}],"answer":["A"],"explain":"满槽切削排屑空间受限，进给速度一般比侧铣降低约 50%，不能反而提高进给。","chapter":"parameter"},{"no":70,"stem":"长悬伸/薄壁工况的参数处理是（ ）。","options":[{"key":"A","text":"提高转速与进给"},{"key":"B","text":"保持不变"},{"key":"C","text":"降速降进给（约七成，ks≈0.74、kf≈0.70）"},{"key":"D","text":"只降转速"}],"answer":["C"],"explain":"长悬伸/薄壁工况刚性差，应降速降进给，约取七成（速度系数 ks≈0.74、进给系数 kf≈0.70）。","chapter":"parameter"},{"no":71,"stem":"客户机床主轴最高 8000 r/min，但工艺要求转速 9550 r/min，正确处理是（ ）。","options":[{"key":"A","text":"强行超速运行"},{"key":"B","text":"按主轴上限 8000 运行并重算实际切削速度（≈251 m/min），或减小刀具直径"},{"key":"C","text":"放弃订单"},{"key":"D","text":"提高进给补偿"}],"answer":["B"],"explain":"需求转速超过主轴上限时，按上限运行并重算实际切削速度（约 251 m/min）确认可接受，或减小刀具直径；严禁强行超速。","chapter":"parameter"},{"no":72,"stem":"切削功率校核通常以主轴额定功率的（ ）为红线。","options":[{"key":"A","text":"100%"},{"key":"B","text":"120%"},{"key":"C","text":"不需要校核"},{"key":"D","text":"80%"}],"answer":["D"],"explain":"切削功率校核通常以主轴额定功率的 80% 为红线，不留到 100% 或 120%。","chapter":"parameter"},{"no":73,"stem":"主轴扭矩不足的典型表现是（ ）。","options":[{"key":"A","text":"闷车或断刀"},{"key":"B","text":"表面质量更好"},{"key":"C","text":"刀具寿命更长"},{"key":"D","text":"噪音减小"}],"answer":["A"],"explain":"主轴扭矩不足会闷车或断刀；不会改善表面、延长寿命或减小噪音。","chapter":"parameter"},{"no":74,"stem":"MRR 指的是（ ）。","options":[{"key":"A","text":"刀具寿命"},{"key":"B","text":"主轴扭矩"},{"key":"C","text":"材料去除率（加工效率）"},{"key":"D","text":"表面粗糙度"}],"answer":["C"],"explain":"MRR 是材料去除率（材料去除体积/时间），衡量加工效率；不是寿命、扭矩或粗糙度。","chapter":"parameter"},{"no":75,"stem":"比切削力 kc 的含义是（ ）。","options":[{"key":"A","text":"刀具涂层代号"},{"key":"B","text":"切下单位断面积所需的切削力（N/mm²），决定功率需求"},{"key":"C","text":"机床精度等级"},{"key":"D","text":"冷却压力"}],"answer":["B"],"explain":"比切削力 kc 是切下单位断面积所需的切削力（N/mm²），直接决定功率需求；不是涂层代号、精度等级或冷却压力。","chapter":"parameter"},{"no":76,"stem":"材料越硬，比切削力 kc（ ）。","options":[{"key":"A","text":"越大"},{"key":"B","text":"越小"},{"key":"C","text":"不变"},{"key":"D","text":"与硬度无关"}],"answer":["A"],"explain":"材料越硬，塑性变形抗力越大，比切削力 kc 越大，功率需求也越大。","chapter":"parameter"},{"no":77,"stem":"同一刀具从粗铣转精铣，参数调整方向是（ ）。","options":[{"key":"A","text":"全部提高"},{"key":"B","text":"全部降低"},{"key":"C","text":"vc 降低、fz 提高"},{"key":"D","text":"vc 提高、fz 降低、ap/ae 降低"}],"answer":["D"],"explain":"粗铣转精铣：vc 适当提高、fz 降低、ap/ae 降低，以保证表面质量和尺寸精度。","chapter":"parameter"},{"no":78,"stem":"球头刀曲面精铣的行距主要由（ ）决定。","options":[{"key":"A","text":"允许的残留高度"},{"key":"B","text":"主轴功率"},{"key":"C","text":"刀柄类型"},{"key":"D","text":"程序大小"}],"answer":["A"],"explain":"球头刀曲面精铣的行距（步距）主要由允许的残留高度决定；与功率、刀柄、程序大小无直接关系。","chapter":"parameter"},{"no":79,"stem":"R3 球刀精铣，要求残留高度 0.005 mm，行距约为（ ）。","options":[{"key":"A","text":"3 mm"},{"key":"B","text":"0.05 mm"},{"key":"C","text":"0.49 mm"},{"key":"D","text":"1.5 mm"}],"answer":["C"],"explain":"行距按允许残留高度由球刀半径反推（s = 2√(2Rh−h²)）；球半径越大、同样残留高度下行距可越大。","chapter":"parameter"},{"no":80,"stem":"球头刀倾斜 10–15° 使用时的有效切削直径约为（ ）。","options":[{"key":"A","text":"0.5D"},{"key":"B","text":"0.90–0.95D"},{"key":"C","text":"1.1–1.2D"},{"key":"D","text":"0.2D"}],"answer":["B"],"explain":"球刀倾斜 10–15° 避开球心切削，有效切削直径约为 0.90–0.95D。","chapter":"parameter"},{"no":81,"stem":"客户问\"同样直径的刀，为什么推荐的转速不一样\"，正确解释是（ ）。","options":[{"key":"A","text":"不同材料的切削速度起点不同，转速由 vc 和直径共同决定"},{"key":"B","text":"随机给"},{"key":"C","text":"看机床价格"},{"key":"D","text":"没有原因"}],"answer":["A"],"explain":"同样直径转速不一样，是因为不同材料切削速度起点不同，转速由 vc 和直径 D 共同决定。","chapter":"parameter"},{"no":82,"stem":"整体硬质合金立铣刀粗铣 45 钢，vc 的合理起点约为（ ）。","options":[{"key":"A","text":"20 m/min"},{"key":"B","text":"350 m/min"},{"key":"C","text":"600 m/min"},{"key":"D","text":"130–180 m/min"}],"answer":["D"],"explain":"整体硬质合金立铣刀粗铣 45 钢，vc 合理起点约 130–180 m/min。","chapter":"parameter"},{"no":83,"stem":"铣削 304 不锈钢（外冷）的 vc 合理起点约为（ ）。","options":[{"key":"A","text":"200 m/min"},{"key":"B","text":"70–100 m/min"},{"key":"C","text":"15 m/min"},{"key":"D","text":"350 m/min"}],"answer":["B"],"explain":"铣 304 不锈钢（外冷）vc 合理起点约 70–100 m/min；不锈钢速度不能取钢件那么高。","chapter":"parameter"},{"no":84,"stem":"铣削钛合金 TC4 的 vc 合理起点约为（ ）。","options":[{"key":"A","text":"50 m/min 左右"},{"key":"B","text":"200 m/min"},{"key":"C","text":"300 m/min"},{"key":"D","text":"80 m/min"}],"answer":["A"],"explain":"铣钛合金 TC4，vc 约 50 m/min 起步，速度要低。","chapter":"parameter"},{"no":85,"stem":"铣削镍基高温合金（Inconel 718）的 vc 合理起点约为（ ）。","options":[{"key":"A","text":"150 m/min"},{"key":"B","text":"300 m/min"},{"key":"C","text":"20 m/min 左右"},{"key":"D","text":"80 m/min"}],"answer":["C"],"explain":"铣 Inconel 718 镍基高温合金 vc 约 20 m/min 左右，是常见材料中速度最低的一档。","chapter":"parameter"},{"no":86,"stem":"铣削铝合金的 vc 合理范围约为（ ）。","options":[{"key":"A","text":"30 m/min"},{"key":"B","text":"150–350 m/min"},{"key":"C","text":"15 m/min"},{"key":"D","text":"600 m/min 以上随意"}],"answer":["B"],"explain":"铝合金导热好、切屑带走热量，vc 范围约 150–350 m/min，可高速切削。","chapter":"parameter"},{"no":87,"stem":"淬硬钢精铣的径向切宽上限是（ ）。","options":[{"key":"A","text":"≤0.5D"},{"key":"B","text":"等于刀具直径"},{"key":"C","text":"≤0.02D"},{"key":"D","text":"不限制"}],"answer":["C"],"explain":"淬硬钢精铣径向切宽上限 ≤0.02D，小切宽抗崩；不能取 0.5D 或满刀。","chapter":"parameter"},{"no":88,"stem":"精铣侧壁的径向切宽 ae 一般控制为（ ）。","options":[{"key":"A","text":"≤0.1D"},{"key":"B","text":"≥0.5D"},{"key":"C","text":"等于刀具直径"},{"key":"D","text":"不限制"}],"answer":["A"],"explain":"精铣侧壁径向切宽 ae 一般控制 ≤0.1D，留出精铣余量。","chapter":"parameter"},{"no":89,"stem":"客户说\"机床功率带不动\"，建议的调整顺序是（ ）。","options":[{"key":"A","text":"先提转速"},{"key":"B","text":"先降 ap 或 ae，再考虑降 vf"},{"key":"C","text":"不加分析直接换大机床"},{"key":"D","text":"不管"}],"answer":["B"],"explain":"机床功率带不动时，先降 ap 或 ae 减小切削负荷，再考虑降 vf；不要先提转速，也不无条件直接换大机床。","chapter":"parameter"},{"no":90,"stem":"销售人员向客户收集参数信息的意义是（ ）。","options":[{"key":"A","text":"显得专业"},{"key":"B","text":"为了多卖刀"},{"key":"C","text":"无所谓"},{"key":"D","text":"帮客户把参数落在安全合理区间，减少试错、报废与投诉"}],"answer":["D"],"explain":"向客户收集参数信息，是为了把参数落在安全合理区间，减少试错、报废与投诉；不是为了显得专业或多卖刀。","chapter":"parameter"},{"no":91,"stem":"客户要铣一个大平面，应推荐（ ）。","options":[{"key":"A","text":"球头刀"},{"key":"B","text":"面铣刀（可转位刀盘）"},{"key":"C","text":"麻花钻"},{"key":"D","text":"丝锥"}],"answer":["B"],"explain":"铣大平面推荐面铣刀（可转位刀盘）；球头刀做曲面，钻头、丝锥做孔和螺纹。","chapter":"strategy"},{"no":92,"stem":"客户要铣侧壁轮廓，应推荐（ ）。","options":[{"key":"A","text":"立铣刀"},{"key":"B","text":"面铣刀盘"},{"key":"C","text":"点钻"},{"key":"D","text":"铰刀"}],"answer":["A"],"explain":"铣侧壁轮廓推荐立铣刀；面铣刀盘做大平面，点钻、铰刀做孔。","chapter":"strategy"},{"no":93,"stem":"客户要加工模具三维曲面，应推荐（ ）。","options":[{"key":"A","text":"面铣刀盘"},{"key":"B","text":"麻花钻"},{"key":"C","text":"球头铣刀"},{"key":"D","text":"铰刀"}],"answer":["C"],"explain":"加工模具三维曲面推荐球头铣刀；面铣刀盘做平面，钻头、铰刀做孔。","chapter":"strategy"},{"no":94,"stem":"客户机床功率小、要开深型腔且排屑难，较高效的方式是（ ）。","options":[{"key":"A","text":"大切宽满槽"},{"key":"B","text":"球刀开粗"},{"key":"C","text":"面铣"},{"key":"D","text":"插铣"}],"answer":["D"],"explain":"小功率机床开深型腔、排屑难，用插铣：切削力沿主轴轴向，刀具几乎不承受径向弯矩。","chapter":"strategy"},{"no":95,"stem":"客户机床刚性一般、要开窄深槽，适合的方式是（ ）。","options":[{"key":"A","text":"摆线铣（小切宽大切深圆弧轨迹）"},{"key":"B","text":"满槽大切宽直线走"},{"key":"C","text":"面铣"},{"key":"D","text":"铰孔"}],"answer":["A"],"explain":"机床刚性一般、开窄深槽，适合摆线铣：小切宽、大切深的圆弧轨迹，接触弧短、切削力稳定。","chapter":"strategy"},{"no":96,"stem":"封闭型腔的正确下刀方式是（ ）。","options":[{"key":"A","text":"G01 直接垂直扎刀"},{"key":"B","text":"不管它直接下"},{"key":"C","text":"螺旋下刀或坡走下刀"},{"key":"D","text":"手动敲进去"}],"answer":["C"],"explain":"封闭型腔应螺旋下刀或坡走下刀；普通立铣刀不能直接垂直扎刀。","chapter":"strategy"},{"no":97,"stem":"普通立铣刀（端刃不过中心）能否垂直下刀？（ ）","options":[{"key":"A","text":"能"},{"key":"B","text":"不能，中心无切削能力会崩刃"},{"key":"C","text":"看直径"},{"key":"D","text":"都可以"}],"answer":["B"],"explain":"普通立铣刀端刃不过中心，中心处线速度为零，垂直下刀是挤压不是切削，会顶刀、崩刃。","chapter":"strategy"},{"no":98,"stem":"硬材料坡走下刀的坡角应控制在（ ）。","options":[{"key":"A","text":"10° 左右"},{"key":"B","text":"15° 左右"},{"key":"C","text":"30° 左右"},{"key":"D","text":"≤2°"}],"answer":["D"],"explain":"硬材料坡走下刀坡角应 ≤2°；坡角过大等于变相垂直扎刀，端刃受力剧增。软材料坡角可大一些。","chapter":"strategy"},{"no":99,"stem":"插铣退刀的正确动作是（ ）。","options":[{"key":"A","text":"停转或快速抬起"},{"key":"B","text":"保持旋转缓慢上提"},{"key":"C","text":"左右摆动着拔出"},{"key":"D","text":"反转拔出"}],"answer":["A"],"explain":"插铣退刀要停转或快速抬起，避免旋转慢提时拖刀蹭伤侧壁。","chapter":"strategy"},{"no":100,"stem":"插铣时相邻插削点之间的重叠量约为（ ）。","options":[{"key":"A","text":"0（不留芯）"},{"key":"B","text":"2D"},{"key":"C","text":"0.3–0.6D"},{"key":"D","text":"无所谓"}],"answer":["C"],"explain":"插铣相邻插削点之间重叠量约 0.3–0.6D，不留芯；不是 0 也不是 2D。","chapter":"strategy"},{"no":101,"stem":"摆线铣的径向切宽范围约为（ ）。","options":[{"key":"A","text":"0.5–1D"},{"key":"B","text":"0.05–0.15D"},{"key":"C","text":"2D"},{"key":"D","text":"不限制"}],"answer":["B"],"explain":"摆线铣径向切宽很小，约 0.05–0.15D，配大切深。","chapter":"strategy"},{"no":102,"stem":"螺旋铣孔时，孔径尺寸由（ ）决定。","options":[{"key":"A","text":"插补圆半径"},{"key":"B","text":"刀具名义直径"},{"key":"C","text":"主轴功率"},{"key":"D","text":"转速"}],"answer":["A"],"explain":"螺旋铣孔孔径由刀具插补圆轨迹半径决定，不由刀径决定（孔径 = 轨迹直径 + 刀径）。","chapter":"strategy"},{"no":103,"stem":"螺旋铣孔的螺距（每转下降量）一般控制为（ ）。","options":[{"key":"A","text":"≥2D"},{"key":"B","text":"无关"},{"key":"C","text":"越大越好"},{"key":"D","text":"≤0.5D"}],"answer":["D"],"explain":"螺旋铣孔每圈下降量（螺距）一般控制 ≤0.5D，视材料调整。","chapter":"strategy"},{"no":104,"stem":"精铣侧壁的径向切宽 ae 一般为（ ）。","options":[{"key":"A","text":"≤0.1D"},{"key":"B","text":"0.5D"},{"key":"C","text":"1D"},{"key":"D","text":"不限制"}],"answer":["A"],"explain":"侧壁精铣径向切宽 ae 一般 ≤0.1D。","chapter":"strategy"},{"no":105,"stem":"侧壁精铣的走刀方式首选（ ）。","options":[{"key":"A","text":"逆铣多刀接刀"},{"key":"B","text":"随意"},{"key":"C","text":"顺铣一刀走完"},{"key":"D","text":"往复走刀"}],"answer":["C"],"explain":"侧壁精铣首选顺铣一刀走完，接刀少、表面匀；逆铣多刀接刀痕迹重。","chapter":"strategy"},{"no":106,"stem":"深腔加工的排屑措施是（ ）。","options":[{"key":"A","text":"加大切深"},{"key":"B","text":"内冷/气吹 + 分层"},{"key":"C","text":"关闭冷却"},{"key":"D","text":"提高转速甩屑"}],"answer":["B"],"explain":"深腔加工靠内冷/气吹加分层排屑；不能靠加大切深、关冷却或提高转速甩屑。","chapter":"strategy"},{"no":107,"stem":"刀具悬伸超过 3D 时应（ ）。","options":[{"key":"A","text":"提高转速补偿"},{"key":"B","text":"加大进给"},{"key":"C","text":"不管"},{"key":"D","text":"换长颈/锥颈刀具并降低参数"}],"answer":["D"],"explain":"悬伸超过 3D 刚性急降，应换长颈/锥颈刀具并降低参数；不能靠提高转速补偿刚性不足。","chapter":"strategy"},{"no":108,"stem":"二次开粗/清角的目的（ ）。","options":[{"key":"A","text":"清除拐角残留，让精加工余量均匀、保护精铣刀"},{"key":"B","text":"省刀具"},{"key":"C","text":"装饰性工序"},{"key":"D","text":"没有意义"}],"answer":["A"],"explain":"二次开粗/清角是清除拐角残留，让精加工余量均匀、保护精铣刀；不是装饰工序。","chapter":"strategy"},{"no":109,"stem":"清角刀具的直径应（ ）。","options":[{"key":"A","text":"≥底角 R 的 2 倍"},{"key":"B","text":"≤型腔底角 R"},{"key":"C","text":"与底角 R 无关"},{"key":"D","text":"越大越好"}],"answer":["B"],"explain":"清角刀具直径应 ≤ 型腔底角 R，才能进到角部；直径大于 R 进不去死角。","chapter":"strategy"},{"no":110,"stem":"高速铣削（HSM）策略的核心是（ ）。","options":[{"key":"A","text":"重切慢走"},{"key":"B","text":"满槽高速"},{"key":"C","text":"轻切快走（小切宽、大切深、高进给、恒定切屑负荷）"},{"key":"D","text":"只提高转速"}],"answer":["C"],"explain":"高速铣削（HSM）策略核心是轻切快走：小切宽、大切深、高进给、恒定切屑负荷；不是重切慢走或满槽高速。","chapter":"strategy"},{"no":111,"stem":"高速铣削对机床的要求不包括（ ）。","options":[{"key":"A","text":"丝杠间隙大、反向间隙未补偿"},{"key":"B","text":"高转速主轴"},{"key":"C","text":"动平衡刀柄"},{"key":"D","text":"数控系统前瞻预处理"}],"answer":["A"],"explain":"HSM 需要高转速主轴、动平衡刀柄、系统前瞻预处理；丝杠间隙大、反向间隙未补偿不满足要求。","chapter":"strategy"},{"no":112,"stem":"铝合金高速铣削的切削速度范围约为（ ）。","options":[{"key":"A","text":"20–50 m/min"},{"key":"B","text":"150–350 m/min"},{"key":"C","text":"5–10 m/min"},{"key":"D","text":"不用考虑"}],"answer":["B"],"explain":"铝合金高速铣削 vc 约 150–350 m/min。","chapter":"strategy"},{"no":113,"stem":"薄壁件的铣削策略是（ ）。","options":[{"key":"A","text":"大切宽大切深"},{"key":"B","text":"负前角重压刀具"},{"key":"C","text":"钝刀慢慢蹭"},{"key":"D","text":"锋利刀、小切宽层铣、高转速"}],"answer":["D"],"explain":"薄壁件用锋利刀、小切宽层铣、高转速；不能用钝刀慢慢蹭，也不宜负前角挤压。","chapter":"strategy"},{"no":114,"stem":"客户加工带黑皮的锻件毛坯，第一刀建议（ ）。","options":[{"key":"A","text":"降速切入（硬皮工况）"},{"key":"B","text":"满参数硬冲"},{"key":"C","text":"提高进给"},{"key":"D","text":"不管黑皮"}],"answer":["A"],"explain":"带黑皮的锻件毛坯第一刀要降速切入，应对硬皮/硬点冲击，防崩刃；不能满参数硬冲。","chapter":"strategy"},{"no":115,"stem":"面铣刀直径与工件宽度的合理比值约为（ ）。","options":[{"key":"A","text":"0.5 倍"},{"key":"B","text":"3 倍以上"},{"key":"C","text":"1.3–1.5 倍"},{"key":"D","text":"无关"}],"answer":["C"],"explain":"面铣刀直径约取工件宽度的 1.3–1.5 倍，兼顾覆盖与切削力。","chapter":"strategy"},{"no":116,"stem":"型腔开粗环切的步距一般控制为（ ）。","options":[{"key":"A","text":"≤0.5D"},{"key":"B","text":"≥1.5D"},{"key":"C","text":"3D"},{"key":"D","text":"无关"}],"answer":["A"],"explain":"型腔开粗环切步距一般 ≤0.5D，保证排屑与切削稳定。","chapter":"strategy"},{"no":117,"stem":"客户加工 P20 模具要求镜面，换刀判据是（ ）。","options":[{"key":"A","text":"VB 达 0.3 mm"},{"key":"B","text":"VB≥0.03 mm 强制换刀"},{"key":"C","text":"不换"},{"key":"D","text":"崩了再换"}],"answer":["B"],"explain":"P20 模具镜面加工要求高，VB≥0.03 mm 即强制换刀；0.3 mm 是常规钢件阈值。","chapter":"strategy"},{"no":118,"stem":"深孔钻削的正确方法是（ ）。","options":[{"key":"A","text":"一次钻到底不停"},{"key":"B","text":"手动慢摇"},{"key":"C","text":"啄钻分段退屑 + 内冷"},{"key":"D","text":"干钻到底"}],"answer":["C"],"explain":"深孔钻削必须啄钻分段退屑并配合内冷；一次钻到底切屑排不出，会堵屑、烧钻、断钻。","chapter":"strategy"},{"no":119,"stem":"客户图纸对孔位精度要求高，推荐的组合工艺是（ ）。","options":[{"key":"A","text":"直接钻"},{"key":"B","text":"直接铰"},{"key":"C","text":"随便"},{"key":"D","text":"点钻 → 麻花钻 → 扩孔/粗镗 → 精铰或精镗"}],"answer":["D"],"explain":"孔位精度要求高的组合工艺：点钻 → 麻花钻 → 扩孔/粗镗 → 精铰或精镗；直接钻或直接铰保证不了精度。","chapter":"strategy"},{"no":120,"stem":"销售拿到零件图后判断加工方式的第一步是（ ）。","options":[{"key":"A","text":"识别特征（平面/侧壁/槽/型腔/曲面/孔），再匹配刀具与方式"},{"key":"B","text":"先报价"},{"key":"C","text":"先推库存"},{"key":"D","text":"只问交期"}],"answer":["A"],"explain":"拿到零件图第一步是识别特征（平面/侧壁/槽/型腔/曲面/孔），再匹配刀具与加工方式；报价、推库存、问交期都在后面。","chapter":"strategy"},{"no":121,"stem":"客户投诉\"工件表面有规律性波纹\"，最可能的原因是（ ）。","options":[{"key":"A","text":"积屑瘤"},{"key":"B","text":"颤振（共振）"},{"key":"C","text":"正常现象"},{"key":"D","text":"刀具太贵"}],"answer":["B"],"explain":"表面有规律性波纹是颤振（共振）的典型表现；积屑瘤表现为尺寸飘、发亮鳞刺。","chapter":"diagnosis"},{"no":122,"stem":"抑制颤振的第一个动作通常是（ ）。","options":[{"key":"A","text":"缩短悬伸、增强刚性"},{"key":"B","text":"加大切深增加阻尼"},{"key":"C","text":"立即提高转速"},{"key":"D","text":"换更便宜的刀"}],"answer":["A"],"explain":"抑制颤振第一个动作是缩短悬伸、增强刚性——刚性随悬伸接近三次方变化，见效最快；再降速、减 ae、改顺铣。","chapter":"diagnosis"},{"no":123,"stem":"客户说\"尺寸忽大忽小、表面发亮有鳞刺\"，最可能是（ ）。","options":[{"key":"A","text":"机床断电"},{"key":"B","text":"刀具太短"},{"key":"C","text":"积屑瘤"},{"key":"D","text":"冷却液加太多"}],"answer":["C"],"explain":"尺寸忽大忽小、表面发亮有鳞刺，最可能是积屑瘤：刃口冷焊金属块长大又脱落。","chapter":"diagnosis"},{"no":124,"stem":"对付积屑瘤的正确方向是（ ）。","options":[{"key":"A","text":"降低切削速度"},{"key":"B","text":"提高切削速度跳出中低速区，配合锋利刃口与润滑"},{"key":"C","text":"加大切深"},{"key":"D","text":"换钝一点的刀"}],"answer":["B"],"explain":"对付积屑瘤要提高 vc 跳出 10–50 m/min 中低速敏感区，配合锋利刃口与润滑；降速、用钝刀会加重粘刀。","chapter":"diagnosis"},{"no":125,"stem":"客户说\"侧壁上宽下窄有锥度\"，这种现象叫（ ）。","options":[{"key":"A","text":"积屑瘤"},{"key":"B","text":"正常"},{"key":"C","text":"程序错误"},{"key":"D","text":"让刀"}],"answer":["D"],"explain":"侧壁上宽下窄有锥度是让刀：刚性不足，刀被切削力推开，弹回后少切。","chapter":"diagnosis"},{"no":126,"stem":"让刀的正确对策是（ ）。","options":[{"key":"A","text":"缩短悬伸、减小切宽、用锋利刃口降低切削力"},{"key":"B","text":"加大切深"},{"key":"C","text":"提高进给"},{"key":"D","text":"不用管"}],"answer":["A"],"explain":"让刀对策是缩短悬伸、减小切宽、用锋利刃口降低切削力；加大切深只会加重让刀。","chapter":"diagnosis"},{"no":127,"stem":"切屑发蓝发紫说明（ ）。","options":[{"key":"A","text":"参数太保守"},{"key":"B","text":"冷却液太多"},{"key":"C","text":"切削区温度过高"},{"key":"D","text":"材料太软"}],"answer":["C"],"explain":"切屑发蓝发紫说明切削区温度过高；颜色正常短卷才是匹配良好。","chapter":"diagnosis"},{"no":128,"stem":"主轴功率表读数突然大幅上升，应该（ ）。","options":[{"key":"A","text":"加大进给继续切"},{"key":"B","text":"停机检查（刀具磨损、积屑或排屑堵塞）"},{"key":"C","text":"不管"},{"key":"D","text":"立即断电拆刀"}],"answer":["B"],"explain":"主轴功率/电流读数突然大幅上升，应停机检查刀具磨损、积屑或排屑堵塞；不能继续加大进给，也不必直接断电拆刀。","chapter":"diagnosis"},{"no":129,"stem":"加工中出现尖啸噪声，正确处理是（ ）。","options":[{"key":"A","text":"停机，检查悬伸、转速、切宽，调整后再试"},{"key":"B","text":"加大进给把声音压住"},{"key":"C","text":"继续切完再说"},{"key":"D","text":"与加工无关"}],"answer":["A"],"explain":"出现尖啸噪声应停机，检查悬伸、转速、切宽，调整后再试；不能靠加大进给压住声音。","chapter":"diagnosis"},{"no":130,"stem":"常规钢件精铣的后刀面磨损 VB 换刀阈值约为（ ）。","options":[{"key":"A","text":"3 mm"},{"key":"B","text":"0.03 mm"},{"key":"C","text":"0.003 mm"},{"key":"D","text":"0.3 mm"}],"answer":["D"],"explain":"常规钢件精铣后刀面磨损 VB 换刀阈值约 0.3 mm；0.03 mm 是镜面标准。","chapter":"diagnosis"},{"no":131,"stem":"P20 模具镜面铣削的换刀判据是（ ）。","options":[{"key":"A","text":"VB 达 0.3 mm"},{"key":"B","text":"VB 达 1 mm"},{"key":"C","text":"VB≥0.03 mm 强制换刀"},{"key":"D","text":"不换刀"}],"answer":["C"],"explain":"P20 模具镜面铣削 VB≥0.03 mm 强制换刀，保证表面质量。","chapter":"diagnosis"},{"no":132,"stem":"\"只要还能切就不换刀\"这种做法（ ）。","options":[{"key":"A","text":"是错误的，必须按寿命管理强制换刀"},{"key":"B","text":"是正确的省钱方法"},{"key":"C","text":"值得推荐"},{"key":"D","text":"与质量无关"}],"answer":["A"],"explain":"“只要还能切就不换刀”是错误的，必须按寿命管理到期强制换刀，否则磨损后期会批量出废品。","chapter":"diagnosis"},{"no":133,"stem":"客户问高压内冷有什么用，正确的回答是（ ）。","options":[{"key":"A","text":"好看、显得高级"},{"key":"B","text":"高压把切屑从切削区冲走并控制刀尖温度，深腔深孔必需"},{"key":"C","text":"只是习惯"},{"key":"D","text":"随便用用"}],"answer":["B"],"explain":"高压内冷把切屑从切削区冲走并控制刀尖温度，深腔、深孔工序必需；不只是好看或习惯。","chapter":"cooling"},{"no":134,"stem":"石墨电极加工必须（ ）。","options":[{"key":"A","text":"大量浇切削液"},{"key":"B","text":"徒手清理"},{"key":"C","text":"不管粉尘"},{"key":"D","text":"气吹除尘（导电粉尘会损坏机床电气）"}],"answer":["D"],"explain":"石墨电极加工必须气吹除尘：石墨粉尘导电，会损坏机床电气；大量浇切削液会形成导电泥浆，更难清理。","chapter":"cooling"},{"no":135,"stem":"钛合金切屑的防火要求是（ ）。","options":[{"key":"A","text":"及时清理、远离火源"},{"key":"B","text":"堆在机床边即可"},{"key":"C","text":"遇水更安全"},{"key":"D","text":"无要求"}],"answer":["A"],"explain":"钛合金切屑细且易燃，要及时清理、远离火源；不能堆在机床边，也不是遇水更安全。","chapter":"cooling"},{"no":136,"stem":"铝合金加工禁用含氯切削液的原因是（ ）。","options":[{"key":"A","text":"太贵"},{"key":"B","text":"氯会腐蚀工件"},{"key":"C","text":"气味大"},{"key":"D","text":"无原因"}],"answer":["B"],"explain":"铝合金加工禁用含氯切削液，因为氯会腐蚀工件；与价格、气味无关。","chapter":"cooling"},{"no":137,"stem":"不锈钢粘刀时切削液的建议是（ ）。","options":[{"key":"A","text":"清水"},{"key":"B","text":"不用切削液"},{"key":"C","text":"含硫极压添加剂并保证浓度（加工后清洗防腐蚀）"},{"key":"D","text":"含氯高浓度液"}],"answer":["C"],"explain":"不锈钢粘刀可用含硫极压添加剂并保证浓度，加工后清洗防腐蚀；不用含氯高浓度液，清水或干切也不够。","chapter":"cooling"},{"no":138,"stem":"加工硬化材料的切深应（ ）。","options":[{"key":"A","text":"跨过硬化层"},{"key":"B","text":"小于硬化层慢慢蹭"},{"key":"C","text":"每刀都停顿观察"},{"key":"D","text":"越浅越好"}],"answer":["A"],"explain":"加工硬化材料切深要跨过硬化层（ap≥0.3 mm）；小于硬化层等于每刀切在硬化层里，越切越磨损。","chapter":"cooling"},{"no":139,"stem":"发生崩刃后第一步是（ ）。","options":[{"key":"A","text":"继续切完这一批"},{"key":"B","text":"停机"},{"key":"C","text":"立即加大切深"},{"key":"D","text":"先归咎客户"}],"answer":["B"],"explain":"发生崩刃后第一步是停机，保全现场；不能继续切完这批，也不能先归咎客户或加大切深。","chapter":"diagnosis"},{"no":140,"stem":"断刀卡在工件孔里，正确的处理是（ ）。","options":[{"key":"A","text":"用手锤敲出"},{"key":"B","text":"反转猛拉"},{"key":"C","text":"不管它"},{"key":"D","text":"停机评估残留与位置，用小参数加工掉残片或电火花去除，严禁硬敲硬拔"}],"answer":["D"],"explain":"断刀卡在孔里，应停机评估残留与位置，用小参数加工掉残片或用电火花去除；严禁手锤硬敲、反转猛拉。","chapter":"sales"},{"no":141,"stem":"首件试切的降档幅度是（ ）。","options":[{"key":"A","text":"进给 +20%、转速 +15%"},{"key":"B","text":"各降 50%"},{"key":"C","text":"进给 −20%、转速 −15%"},{"key":"D","text":"直接满参数"}],"answer":["C"],"explain":"首件试切降档幅度：进给 −20%、转速 −15%，从保守参数起步。","chapter":"sales"},{"no":142,"stem":"试切合格后的提速节奏是（ ）。","options":[{"key":"A","text":"一次加 50%"},{"key":"B","text":"每次加 10% 逐级提升"},{"key":"C","text":"不再调整"},{"key":"D","text":"每次降 10%"}],"answer":["B"],"explain":"试切合格后每次 +10% 逐级提到推荐值，不跳档；不是一次加 50%。","chapter":"sales"},{"no":143,"stem":"首件试切的观察内容（\"五看\"）不包括（ ）。","options":[{"key":"A","text":"机床品牌"},{"key":"B","text":"声音"},{"key":"C","text":"切屑颜色与形态"},{"key":"D","text":"表面状态"}],"answer":["A"],"explain":"首件“五看”是声音、切屑颜色与形态、表面状态、排屑、刀具温升；机床品牌不在观察内容内。","chapter":"sales"},{"no":144,"stem":"批量生产尺寸稳定的关键是（ ）。","options":[{"key":"A","text":"随机换不同品牌刀具"},{"key":"B","text":"不做首件确认"},{"key":"C","text":"固定刀具/装夹/参数 + 寿命到期强制换刀"},{"key":"D","text":"凭手感"}],"answer":["C"],"explain":"批量尺寸稳定的关键是固定刀具、装夹、参数并到期强制换刀；随机换品牌、不做首件确认、凭手感都会波动。","chapter":"sales"},{"no":145,"stem":"客户投诉批量质量事故，销售的第一动作是（ ）。","options":[{"key":"A","text":"协助停机隔离可疑品、保留现场与刀具"},{"key":"B","text":"先谈赔偿金额"},{"key":"C","text":"先否认责任"},{"key":"D","text":"删除记录"}],"answer":["A"],"explain":"批量质量事故第一动作是协助停机隔离可疑品、保留现场与刀具；先谈赔偿、否认责任或删记录都错误。","chapter":"sales"},{"no":146,"stem":"下列不属于批量超差常见原因的是（ ）。","options":[{"key":"A","text":"刀具磨损"},{"key":"B","text":"机床颜色"},{"key":"C","text":"装夹位移"},{"key":"D","text":"参数漂移"}],"answer":["B"],"explain":"批量超差常见原因有刀具磨损、装夹位移、参数漂移；机床颜色与质量无关。","chapter":"sales"},{"no":147,"stem":"客户说\"崩刃就是你们刀不行\"，正确的沟通姿态是（ ）。","options":[{"key":"A","text":"直接认错退款"},{"key":"B","text":"指责客户操作不当"},{"key":"C","text":"不再理会"},{"key":"D","text":"先了解工况与崩口形态，收集证据再定位原因（黑皮/参数/装夹/排屑）"}],"answer":["D"],"explain":"面对“崩刃就是刀不行”，应先了解工况与崩口形态、收集证据再定位原因（黑皮/参数/装夹/排屑）；不直接认错退款，也不指责客户。","chapter":"sales"},{"no":148,"stem":"下列属于现场安全红线的是（ ）。","options":[{"key":"A","text":"戴手套操作旋转刀具更安全"},{"key":"B","text":"开着防护门观察加工"},{"key":"C","text":"刀具旋转时严禁测量、停机清屑用钩刷、不戴手套操作"},{"key":"D","text":"徒手清屑最快"}],"answer":["C"],"explain":"安全红线：刀具旋转时严禁测量，停机清屑用钩刷不用手，不戴手套操作旋转刀具；开防护门观察、徒手清屑都违规。","chapter":"sales"},{"no":149,"stem":"镁合金切屑的特别注意事项是（ ）。","options":[{"key":"A","text":"严禁与水接触（反应生成氢气，有燃爆风险）"},{"key":"B","text":"多浇水降温"},{"key":"C","text":"随意堆放"},{"key":"D","text":"无特殊要求"}],"answer":["A"],"explain":"镁合金切屑严禁与水接触，反应会生成氢气、有燃爆风险；不能多浇水降温。","chapter":"cooling"},{"no":150,"stem":"售后回访的价值是（ ）。","options":[{"key":"A","text":"浪费时间"},{"key":"B","text":"收集刀具寿命与失效数据，改进推荐并预防投诉"},{"key":"C","text":"只为催款"},{"key":"D","text":"无意义"}],"answer":["B"],"explain":"售后回访用来收集刀具寿命与失效数据，改进推荐、预防投诉；不是浪费时间或只为催款。","chapter":"sales"}],"multi":[{"no":1,"stem":"下列属于 ISO 513 P 组的材料有（ ）。","options":[{"key":"A","text":"45 钢"},{"key":"B","text":"42CrMo"},{"key":"C","text":"P20 预硬模具钢"},{"key":"D","text":"304 不锈钢"}],"answer":["A","B","C"],"explain":"P 组为钢：45 钢、42CrMo、P20 预硬模具钢都属此类；304 是 M 不锈钢，排除。","chapter":"material"},{"no":2,"stem":"下列属于 M 组的材料有（ ）。","options":[{"key":"A","text":"304"},{"key":"B","text":"316"},{"key":"C","text":"17-4PH"},{"key":"D","text":"HT200 灰铸铁"}],"answer":["A","B","C"],"explain":"M 组为不锈钢：304、316、17-4PH；HT200 灰铸铁属 K 组，排除。","chapter":"material"},{"no":3,"stem":"下列属于 N 组的材料有（ ）。","options":[{"key":"A","text":"6061 铝合金"},{"key":"B","text":"7075 铝合金"},{"key":"C","text":"灰铸铁"},{"key":"D","text":"紫铜"}],"answer":["A","B","D"],"explain":"N 组为有色金属：6061、7075 铝和紫铜；灰铸铁属 K 组，排除。","chapter":"material"},{"no":4,"stem":"下列属于 S 组的材料有（ ）。","options":[{"key":"A","text":"钛合金 TC4"},{"key":"B","text":"Inconel 718"},{"key":"C","text":"GH4169 高温合金"},{"key":"D","text":"45 钢"}],"answer":["A","B","C"],"explain":"S 组为耐热合金与钛：TC4、Inconel 718、GH4169；45 钢属 P 组，排除。","chapter":"material"},{"no":5,"stem":"O 组材料包括（ ）。","options":[{"key":"A","text":"PEEK 工程塑料"},{"key":"B","text":"石墨"},{"key":"C","text":"氧化锆陶瓷"},{"key":"D","text":"CFRP 碳纤维"}],"answer":["A","B","C","D"],"explain":"PEEK 塑料、石墨、氧化锆陶瓷、CFRP 碳纤维都属非金属，归 O 组，四项全选。","chapter":"material"},{"no":6,"stem":"硬质合金的特点有（ ）。","options":[{"key":"A","text":"红硬性好（耐热）"},{"key":"B","text":"抗压强但抗弯与抗冲击差"},{"key":"C","text":"细晶粒牌号适合精加工"},{"key":"D","text":"可以随意磕碰摔落"}],"answer":["A","B","C"],"explain":"硬质合金红硬性好、抗压强但抗弯抗冲击差，细晶粒牌号适合精加工；它怕磕碰摔落，“可以随意磕碰”错误。","chapter":"material_tool"},{"no":7,"stem":"铣刀常见涂层有（ ）。","options":[{"key":"A","text":"TiN"},{"key":"B","text":"TiAlN"},{"key":"C","text":"AlCrN"},{"key":"D","text":"聚四氟乙烯"}],"answer":["A","B","C"],"explain":"铣刀常见涂层有 TiN、TiAlN、AlCrN；聚四氟乙烯不是刀具涂层，排除。","chapter":"material_tool"},{"no":8,"stem":"涂层的作用包括（ ）。","options":[{"key":"A","text":"提高表面硬度"},{"key":"B","text":"降低摩擦、减少粘结"},{"key":"C","text":"抗氧化耐高温"},{"key":"D","text":"化学惰性、防工件材料粘刀"}],"answer":["A","B","C","D"],"explain":"涂层四项作用：提高表面硬度、降低摩擦减少粘结、抗氧化耐高温、化学惰性防粘刀，全选。","chapter":"material_tool"},{"no":9,"stem":"高速钢的特点有（ ）。","options":[{"key":"A","text":"韧性好"},{"key":"B","text":"可重磨"},{"key":"C","text":"红硬性差、不适合高速"},{"key":"D","text":"特别耐冲击"}],"answer":["A","B","C"],"explain":"高速钢韧性好、可重磨，但红硬性差、不适合高速；“特别耐冲击”不是它的主要特点。","chapter":"material_tool"},{"no":10,"stem":"PCD 金刚石刀具适合加工（ ）。","options":[{"key":"A","text":"铝合金"},{"key":"B","text":"高硅铝合金"},{"key":"C","text":"石墨"},{"key":"D","text":"淬硬钢"}],"answer":["A","B","C"],"explain":"PCD 金刚石适合铝合金、高硅铝、石墨；淬硬钢用 CBN 或硬质合金，排除。","chapter":"material_tool"},{"no":11,"stem":"描述一把铣刀需要的要素包括（ ）。","options":[{"key":"A","text":"基体材料"},{"key":"B","text":"涂层"},{"key":"C","text":"几何角度"},{"key":"D","text":"直径与刃数"}],"answer":["A","B","C","D"],"explain":"描述一把铣刀要讲清基体材料、涂层、几何角度、直径与刃数，四项全选。","chapter":"tool_type"},{"no":12,"stem":"客户咨询时销售人员应收集的信息有（ ）。","options":[{"key":"A","text":"材料牌号与硬度/热处理状态"},{"key":"B","text":"加工部位、特征与尺寸"},{"key":"C","text":"粗加工还是精加工、深腔还是薄壁"},{"key":"D","text":"机床最高转速与功率"}],"answer":["A","B","C","D"],"explain":"咨询时应收集材料牌号与硬度/热处理状态、加工部位特征与尺寸、粗精/深腔/薄壁、机床最高转速与功率，全选。","chapter":"sales"},{"no":13,"stem":"关于材料硬度换算，正确的说法有（ ）。","options":[{"key":"A","text":"HB 用于退火/调质钢与铸铁"},{"key":"B","text":"HRC 用于淬硬钢（约 20–68 量程）"},{"key":"C","text":"HB≈230 约对应 HRC 22"},{"key":"D","text":"三个标尺可以随便线性换算"}],"answer":["A","B","C"],"explain":"HB 用于退火/调质钢与铸铁，HRC 用于淬硬钢（量程约 20–68），HB≈230 约对应 HRC 22；三把标尺不能随便线性换算，排除 D。","chapter":"material"},{"no":14,"stem":"加工硬化倾向明显的材料有（ ）。","options":[{"key":"A","text":"304"},{"key":"B","text":"316"},{"key":"C","text":"钛合金"},{"key":"D","text":"6061 铝合金"}],"answer":["A","B","C"],"explain":"加工硬化倾向明显的是 304、316、钛合金；6061 铝不明显，排除。","chapter":"material"},{"no":15,"stem":"关于铣削与钻削的区别，正确的有（ ）。","options":[{"key":"A","text":"铣削以旋转刀具断续切削，可走轮廓与槽"},{"key":"B","text":"钻削以轴向进给为主"},{"key":"C","text":"普通立铣刀（端刃不过中心）可以随意垂直扎刀"},{"key":"D","text":"两者用途不同、不可混用"}],"answer":["A","B","D"],"explain":"铣削以旋转刀具断续切削、可走轮廓与槽，钻削以轴向进给为主，两者用途不同不可混用；普通立铣刀不能随意垂直扎刀，排除 C。","chapter":"strategy"},{"no":16,"stem":"关于\"看料选刀\"，正确的有（ ）。","options":[{"key":"A","text":"材料组别决定刀具族方向"},{"key":"B","text":"硬度影响参数档位"},{"key":"C","text":"热处理状态（调质/淬硬）很关键"},{"key":"D","text":"只选最便宜的就行"}],"answer":["A","B","C"],"explain":"看料选刀：材料组别定刀具族方向，硬度影响参数档位，热处理状态（调质/淬硬）很关键；只选最便宜错误。","chapter":"material"},{"no":17,"stem":"客户问\"加工铝合金用什么刀\"，合理回答要点包括（ ）。","options":[{"key":"A","text":"3 刃/2 刃大螺旋锋利刃"},{"key":"B","text":"大容屑槽"},{"key":"C","text":"DLC 涂层或锋利细晶硬质合金、高硅铝用 PCD"},{"key":"D","text":"提醒禁用含氯切削液"}],"answer":["A","B","C","D"],"explain":"铝合金用 2/3 刃大螺旋锋利刃、大容屑槽、DLC 或锋利细晶硬质合金，高硅铝用 PCD，并提醒禁用含氯切削液，全选。","chapter":"material"},{"no":18,"stem":"关于钛合金加工，正确的有（ ）。","options":[{"key":"A","text":"导热差、热量集中刀尖"},{"key":"B","text":"化学活泼"},{"key":"C","text":"切削速度要低（约 50 m/min 起步）"},{"key":"D","text":"禁用含氯切削液"}],"answer":["A","B","C","D"],"explain":"钛合金导热差、热量集中刀尖，化学活泼，切削速度要低（约 50 m/min 起步），禁用含氯切削液，全选。","chapter":"material"},{"no":19,"stem":"关于铸铁加工，正确的有（ ）。","options":[{"key":"A","text":"切屑崩碎"},{"key":"B","text":"表皮常夹砂硬皮"},{"key":"C","text":"可以干切或风冷"},{"key":"D","text":"必须大量水基切削液浇淋"}],"answer":["A","B","C"],"explain":"铸铁切屑崩碎、表皮常夹砂硬皮，可干切或风冷；不必大量水基切削液浇淋，排除 D。","chapter":"material"},{"no":20,"stem":"销售人员拿不准技术方案时，正确的做法有（ ）。","options":[{"key":"A","text":"如实记录客户工况"},{"key":"B","text":"带回信息找工艺支持确认"},{"key":"C","text":"不轻易承诺参数与寿命"},{"key":"D","text":"随意报一个参数先把单签下来"}],"answer":["A","B","C"],"explain":"拿不准方案时要如实记录工况、带回找工艺支持确认、不轻易承诺参数与寿命；随意报参数签单错误。","chapter":"sales"},{"no":21,"stem":"立铣刀可以完成的加工有（ ）。","options":[{"key":"A","text":"侧面铣削"},{"key":"B","text":"槽铣削"},{"key":"C","text":"轮廓铣削"},{"key":"D","text":"台阶面铣削"}],"answer":["A","B","C","D"],"explain":"立铣刀可完成侧面铣、槽铣、轮廓铣、台阶面铣削，四项全选。","chapter":"tool_type"},{"no":22,"stem":"球头刀的适用场合有（ ）。","options":[{"key":"A","text":"三维曲面精铣"},{"key":"B","text":"小半径过渡清角"},{"key":"C","text":"倒圆角"},{"key":"D","text":"型腔开粗主力"}],"answer":["A","B","C"],"explain":"球头刀用于三维曲面精铣、小半径过渡清角、倒圆角；型腔开粗主力不是球刀，排除 D。","chapter":"tool_type"},{"no":23,"stem":"常见的刀柄类型有（ ）。","options":[{"key":"A","text":"热缩刀柄"},{"key":"B","text":"液压刀柄"},{"key":"C","text":"弹簧夹头"},{"key":"D","text":"侧固式"}],"answer":["A","B","C","D"],"explain":"常见刀柄类型有热缩、液压、弹簧夹头 ER、侧固式，四项全选。","chapter":"holder"},{"no":24,"stem":"热缩刀柄的特点有（ ）。","options":[{"key":"A","text":"跳动可 ≤0.003 mm"},{"key":"B","text":"夹持刚性高"},{"key":"C","text":"需要专用感应加热设备"},{"key":"D","text":"夹持段必须清洁无油"}],"answer":["A","B","C","D"],"explain":"热缩刀柄跳动可 ≤0.003 mm、夹持刚性高，需专用感应加热设备，夹持段必须清洁无油，全选。","chapter":"holder"},{"no":25,"stem":"影响刀具选型的工况因素有（ ）。","options":[{"key":"A","text":"材料组别"},{"key":"B","text":"粗加工还是精加工"},{"key":"C","text":"深腔、薄壁、满槽等约束"},{"key":"D","text":"机床刚性与功率"}],"answer":["A","B","C","D"],"explain":"影响选型的工况因素有材料组别、粗精加工、深腔/薄壁/满槽约束、机床刚性与功率，全选。","chapter":"tool_type"},{"no":26,"stem":"刃数选择的正确原则有（ ）。","options":[{"key":"A","text":"材料软、切屑大，刃数要少"},{"key":"B","text":"精加工、小余量，刃数可多"},{"key":"C","text":"满槽排屑差，宁可少两刃"},{"key":"D","text":"刃数越多越好"}],"answer":["A","B","C"],"explain":"刃数原则：材料软切屑大要少刃，精加工小余量可多刃，满槽排屑差宁可少两刃；刃数并非越多越好。","chapter":"tool_type"},{"no":27,"stem":"涂层选择要考虑的因素有（ ）。","options":[{"key":"A","text":"与工件材料的化学匹配（含铝涂层遇铝、含碳涂层遇钢的问题）"},{"key":"B","text":"干切还是湿切"},{"key":"C","text":"切削温度高低"},{"key":"D","text":"涂层颜色是否好看"}],"answer":["A","B","C"],"explain":"选涂层要看与工件材料的化学匹配、干切还是湿切、切削温度高低；涂层颜色是否好看与性能无关，排除 D。","chapter":"material_tool"},{"no":28,"stem":"与丝锥攻丝相比，螺纹铣的优势有（ ）。","options":[{"key":"A","text":"一把刀可加工多种孔径与螺距"},{"key":"B","text":"崩刃可补刀，不报废整孔"},{"key":"C","text":"通孔盲孔通用、排屑好"},{"key":"D","text":"小孔加工效率更高"}],"answer":["A","B","C"],"explain":"螺纹铣相比丝锥：一把刀可加工多种孔径螺距、崩刃可补刀不报废整孔、通孔盲孔通用排屑好；小孔效率不如钻头，排除 D。","chapter":"tool_type"},{"no":29,"stem":"铰孔质量差的常见原因有（ ）。","options":[{"key":"A","text":"铰削余量过大或过小"},{"key":"B","text":"切削液选用不当"},{"key":"C","text":"铰刀跳动大或已钝"},{"key":"D","text":"转速过高产生振动"}],"answer":["A","B","C","D"],"explain":"铰孔质量差常见原因：铰削余量过大或过小、切削液选用不当、铰刀跳动大或已钝、转速过高产生振动，全选。","chapter":"tool_type"},{"no":30,"stem":"关于孔加工组合工艺，正确的有（ ）。","options":[{"key":"A","text":"高精度孔顺序：点钻 → 麻花钻 → 扩孔/粗镗 → 精铰或精镗"},{"key":"B","text":"深孔可以跳过定心直接一次钻到底"},{"key":"C","text":"深孔钻削要分段退屑并加强冷却"},{"key":"D","text":"铰刀可以用来校正钻孔的位置偏差"}],"answer":["A","C"],"explain":"高精度孔顺序：点钻 → 麻花钻 → 扩孔/粗镗 → 精铰或精镗；深孔不能跳过定心一次钻到底，铰刀也不能校正位置偏差，排除 B、D。","chapter":"tool_type"},{"no":31,"stem":"装夹刀具时的正确做法有（ ）。","options":[{"key":"A","text":"夹持长度足够、不能只夹刀尖"},{"key":"B","text":"柄部与夹持孔清洁无油"},{"key":"C","text":"装后测量径向跳动"},{"key":"D","text":"装上就行，不用看"}],"answer":["A","B","C"],"explain":"装夹刀具要夹持足够长、不只夹刀尖，柄部与夹持孔清洁无油，装后测量径向跳动；装上不看错误。","chapter":"holder"},{"no":32,"stem":"客户说\"刀装上就振\"，可能的原因有（ ）。","options":[{"key":"A","text":"悬伸过长"},{"key":"B","text":"夹持不紧或夹持孔有异物"},{"key":"C","text":"跳动过大"},{"key":"D","text":"刀具太贵"}],"answer":["A","B","C"],"explain":"刀装上就振，可能悬伸过长、夹持不紧或夹持孔有异物、跳动过大；刀具价格与振动无关，排除 D。","chapter":"holder"},{"no":33,"stem":"面铣刀盘选型要点有（ ）。","options":[{"key":"A","text":"刀径约为工件宽度的 1.3–1.5 倍"},{"key":"B","text":"刀片牌号按被加工材料选"},{"key":"C","text":"换刀片后重测轴向/径向跳动"},{"key":"D","text":"刀盘越大越好"}],"answer":["A","B","C"],"explain":"面铣刀盘选型：刀径约工件宽度 1.3–1.5 倍，刀片牌号按被加工材料选，换刀片后重测跳动；刀盘不是越大越好，排除 D。","chapter":"tool_type"},{"no":34,"stem":"关于可转位刀片，正确的有（ ）。","options":[{"key":"A","text":"换刃成本低"},{"key":"B","text":"适合大直径面铣"},{"key":"C","text":"刀体与刀片必须匹配"},{"key":"D","text":"一片崩了整把刀报废"}],"answer":["A","B","C"],"explain":"可转位刀片换刃成本低、适合大直径面铣、刀体与刀片必须匹配；一片刀片崩了不报废整把刀体，排除 D。","chapter":"tool_type"},{"no":35,"stem":"深腔加工的刀具方案要点有（ ）。","options":[{"key":"A","text":"长颈/锥颈刀具"},{"key":"B","text":"内冷刀具与大流量冷却"},{"key":"C","text":"分层切削"},{"key":"D","text":"加大切宽提高效率"}],"answer":["A","B","C"],"explain":"深腔刀具方案：长颈/锥颈刀具、内冷刀具加大流量冷却、分层切削；加大切宽提高效率错误，排除 D。","chapter":"tool_type"},{"no":36,"stem":"薄壁件刀具推荐的要点有（ ）。","options":[{"key":"A","text":"锋利大螺旋刃口降低切削力"},{"key":"B","text":"小切宽层铣"},{"key":"C","text":"高转速小 fz"},{"key":"D","text":"负前角挤压刀具更稳"}],"answer":["A","B","C"],"explain":"薄壁件用锋利大螺旋刃口降低切削力、小切宽层铣、高转速小 fz；负前角挤压刀具会加大变形，排除 D。","chapter":"tool_type"},{"no":37,"stem":"销售人员应能识别的刀具失效模式有（ ）。","options":[{"key":"A","text":"崩刃"},{"key":"B","text":"后刀面磨损带 VB 变宽"},{"key":"C","text":"塑性变形（刀尖塌陷、刀体发蓝）"},{"key":"D","text":"热裂纹与涂层剥落"}],"answer":["A","B","C","D"],"explain":"可识别的失效模式：崩刃、后刀面磨损带 VB 变宽、塑性变形（刀尖塌陷/刀体发蓝）、热裂纹与涂层剥落，全选。","chapter":"diagnosis"},{"no":38,"stem":"向客户做刀具寿命承诺前应确认的有（ ）。","options":[{"key":"A","text":"材料批次与硬度波动"},{"key":"B","text":"工况是否稳定"},{"key":"C","text":"机床状态"},{"key":"D","text":"客户的装夹与操作水平"}],"answer":["A","B","C","D"],"explain":"做寿命承诺前要确认材料批次与硬度波动、工况是否稳定、机床状态、客户装夹与操作水平，全选。","chapter":"sales"},{"no":39,"stem":"关于库存与服务，正确的动作有（ ）。","options":[{"key":"A","text":"按客户常用规格备安全库存"},{"key":"B","text":"记录客户机床与现有刀柄标准"},{"key":"C","text":"提醒客户定期点检拉钉与夹头"},{"key":"D","text":"缺货时随便发不同品牌替代"}],"answer":["A","B","C"],"explain":"库存服务：按常用规格备安全库存，记录客户机床与现有刀柄标准，提醒定期点检拉钉与夹头；缺货不能随便发不同品牌替代，排除 D。","chapter":"sales"},{"no":40,"stem":"回访客户使用情况时应了解的问题有（ ）。","options":[{"key":"A","text":"换刀间隔与加工件数"},{"key":"B","text":"有无崩刃、异响等异常"},{"key":"C","text":"表面与尺寸是否稳定"},{"key":"D","text":"只问要不要续单"}],"answer":["A","B","C"],"explain":"回访要了解换刀间隔与加工件数、有无崩刃异响等异常、表面与尺寸是否稳定；不能只问要不要续单，排除 D。","chapter":"sales"},{"no":41,"stem":"切削三要素包括（ ）。","options":[{"key":"A","text":"切削速度 vc"},{"key":"B","text":"进给量 fz/vf"},{"key":"C","text":"切深 ap/ae"},{"key":"D","text":"刀具品牌"}],"answer":["A","B","C"],"explain":"切削三要素是切削速度 vc、进给量 fz/vf、切深 ap/ae；刀具品牌不属于三要素，排除 D。","chapter":"parameter"},{"no":42,"stem":"影响主轴转速的因素有（ ）。","options":[{"key":"A","text":"切削速度 vc"},{"key":"B","text":"刀具直径 D"},{"key":"C","text":"机床主轴最高转速限制"},{"key":"D","text":"机床颜色"}],"answer":["A","B","C"],"explain":"影响主轴转速的有切削速度 vc、刀具直径 D、机床主轴最高转速限制；机床颜色无关，排除 D。","chapter":"parameter"},{"no":43,"stem":"每齿进给 fz 取得过大的后果有（ ）。","options":[{"key":"A","text":"切削力上升"},{"key":"B","text":"刀齿可能崩刃"},{"key":"C","text":"表面质量变差"},{"key":"D","text":"刀具寿命必然大幅延长"}],"answer":["A","B","C"],"explain":"fz 过大：切削力上升、刀齿可能崩刃、表面质量变差；刀具寿命不会必然延长，排除 D。","chapter":"parameter"},{"no":44,"stem":"工况修正系数要修正的参数是（ ）。","options":[{"key":"A","text":"切削速度 vc"},{"key":"B","text":"每齿进给 fz"},{"key":"C","text":"刀具直径"},{"key":"D","text":"机床品牌"}],"answer":["A","B"],"explain":"工况修正系数主要修正切削速度 vc 和每齿进给 fz；不修正刀具直径或机床品牌。","chapter":"parameter"},{"no":45,"stem":"下列工况中需要降低参数的有（ ）。","options":[{"key":"A","text":"满槽"},{"key":"B","text":"深腔"},{"key":"C","text":"长悬伸/薄壁"},{"key":"D","text":"带硬皮的毛坯"}],"answer":["A","B","C","D"],"explain":"满槽、深腔、长悬伸/薄壁、带硬皮毛坯都需要降低参数，全选。","chapter":"parameter"},{"no":46,"stem":"功率校核超限时可以采取的措施有（ ）。","options":[{"key":"A","text":"降低 ap"},{"key":"B","text":"降低 ae"},{"key":"C","text":"降低 vf"},{"key":"D","text":"强行超速"}],"answer":["A","B","C"],"explain":"功率校核超限时可降 ap、降 ae、降 vf；强行超速错误，排除 D。","chapter":"parameter"},{"no":47,"stem":"关于扭矩校核，正确的有（ ）。","options":[{"key":"A","text":"T = 9549 × Pc / n"},{"key":"B","text":"同一功率下转速越低扭矩越大"},{"key":"C","text":"低速大直径刀具最容易扭矩超限"},{"key":"D","text":"扭矩无关紧要"}],"answer":["A","B","C"],"explain":"扭矩 T = 9549×Pc/n；同一功率下转速越低扭矩越大，低速大直径刀具最容易扭矩超限；扭矩并非无关紧要，排除 D。","chapter":"parameter"},{"no":48,"stem":"关于球头刀，正确的说法有（ ）。","options":[{"key":"A","text":"球心处切削速度为零"},{"key":"B","text":"应倾斜 10–15° 避开球心切削"},{"key":"C","text":"行距由残留高度反推"},{"key":"D","text":"球刀适合开粗"}],"answer":["A","B","C"],"explain":"球头刀球心处切削速度为零，应倾斜 10–15° 避开球心切削，行距由残留高度反推；球刀不适合开粗，排除 D。","chapter":"parameter"},{"no":49,"stem":"参数表中\"vc 起始值\"的正确理解有（ ）。","options":[{"key":"A","text":"是典型工况的起点参考"},{"key":"B","text":"上机要按试切流程降档验证"},{"key":"C","text":"异常时要回退排查"},{"key":"D","text":"直接满参数批量生产"}],"answer":["A","B","C"],"explain":"vc 起始值是典型工况的起点参考，上机要按试切流程降档验证，异常时回退排查；不能直接满参数批量生产，排除 D。","chapter":"parameter"},{"no":50,"stem":"客户机床功率只有 7.5 kW，要铣大余量硬材料，合理建议有（ ）。","options":[{"key":"A","text":"降低 ap/ae 减小切削负荷"},{"key":"B","text":"改用大切深小切宽策略"},{"key":"C","text":"提高转速硬切"},{"key":"D","text":"先做功率校核再定参数"}],"answer":["A","B","D"],"explain":"7.5 kW 小功率铣大余量硬料：降 ap/ae 减小负荷，改用大切深小切宽策略，先做功率校核再定参数；提高转速硬切错误，排除 C。","chapter":"parameter"},{"no":51,"stem":"关于转速受限（需求 > 主轴上限）的处理，正确的有（ ）。","options":[{"key":"A","text":"按主轴上限运行"},{"key":"B","text":"重算实际切削速度确认仍在合理范围"},{"key":"C","text":"可考虑减小刀具直径"},{"key":"D","text":"强行超速运行"}],"answer":["A","B","C"],"explain":"转速受限时：按主轴上限运行、重算实际切削速度确认仍合理、可考虑减小刀具直径；强行超速错误，排除 D。","chapter":"parameter"},{"no":52,"stem":"销售人员需要向工艺/技术部门转交的信息有（ ）。","options":[{"key":"A","text":"材料牌号与硬度"},{"key":"B","text":"机床型号、主轴上限与功率"},{"key":"C","text":"加工特征与余量"},{"key":"D","text":"客户现有刀具与失败经历"}],"answer":["A","B","C","D"],"explain":"转交工艺/技术部门的信息：材料牌号与硬度、机床型号主轴上限与功率、加工特征与余量、客户现有刀具与失败经历，全选。","chapter":"sales"},{"no":53,"stem":"关于比切削力 kc，正确的有（ ）。","options":[{"key":"A","text":"45 钢约 1750 N/mm²"},{"key":"B","text":"42CrMo 调质约 2200"},{"key":"C","text":"铝合金明显更低"},{"key":"D","text":"与材料无关"}],"answer":["A","B","C"],"explain":"比切削力 kc：45 钢约 1750 N/mm²，42CrMo 调质约 2200，铝合金明显更低；kc 与材料密切相关，排除 D。","chapter":"parameter"},{"no":54,"stem":"同样是 D10 四刃铣刀，下列说法正确的有（ ）。","options":[{"key":"A","text":"铣铝和铣钢的推荐转速不同"},{"key":"B","text":"铣钛合金时转速最低"},{"key":"C","text":"进给速度与 vc、fz 都相关"},{"key":"D","text":"一套参数走天下"}],"answer":["A","B","C"],"explain":"同是 D10 四刃：铣铝和铣钢推荐转速不同，铣钛合金转速最低，进给速度与 vc、fz 都相关；一套参数走天下错误，排除 D。","chapter":"parameter"},{"no":55,"stem":"试切降档的正确数字是（ ）。","options":[{"key":"A","text":"首件进给 −20%"},{"key":"B","text":"首件转速 −15%"},{"key":"C","text":"合格后逐级 +10%"},{"key":"D","text":"首件直接满参数"}],"answer":["A","B","C"],"explain":"试切降档：首件进给 −20%、转速 −15%，合格后逐级 +10%；首件直接满参数错误，排除 D。","chapter":"parameter"},{"no":56,"stem":"客户说\"参数给高一点没关系\"，你应该提醒（ ）。","options":[{"key":"A","text":"超过刀具能力会崩刃或异常磨损"},{"key":"B","text":"机床可能过载闷车"},{"key":"C","text":"表面与尺寸风险"},{"key":"D","text":"高参数一定省成本"}],"answer":["A","B","C"],"explain":"参数给高的风险：超刀具能力会崩刃或异常磨损，机床可能过载闷车，表面与尺寸有风险；高参数并不一定省成本，排除 D。","chapter":"parameter"},{"no":57,"stem":"关于每转进给 fr，正确的有（ ）。","options":[{"key":"A","text":"fr = fz × z"},{"key":"B","text":"刃数增加 vf 不变时 fz 减小"},{"key":"C","text":"与刃数有关"},{"key":"D","text":"与转速无关"}],"answer":["A","B","C"],"explain":"每转进给 fr = fz×z；刃数增加而 vf 不变时 fz 减小；fr 与刃数有关。fr 与转速无关的说法错误，排除 D。","chapter":"parameter"},{"no":58,"stem":"判断参数是否过高的现场信号有（ ）。","options":[{"key":"A","text":"切屑发蓝发紫"},{"key":"B","text":"功率/电流大幅上升"},{"key":"C","text":"尖啸噪声"},{"key":"D","text":"刀具异常磨损加快"}],"answer":["A","B","C","D"],"explain":"参数过高的现场信号：切屑发蓝发紫、功率/电流大幅上升、尖啸噪声、刀具异常磨损加快，全选。","chapter":"parameter"},{"no":59,"stem":"向客户解释\"为什么这批料参数要下调\"，可用的理由有（ ）。","options":[{"key":"A","text":"实测硬度高于典型值"},{"key":"B","text":"硬度修正按指数关系降速"},{"key":"C","text":"材料批次波动"},{"key":"D","text":"参数随意定的"}],"answer":["A","B","C"],"explain":"解释这批料要降参数：实测硬度高于典型值、硬度修正按指数关系降速、材料批次波动；参数不是随意定的，排除 D。","chapter":"parameter"},{"no":60,"stem":"销售在参数沟通中的正确角色有（ ）。","options":[{"key":"A","text":"收集工况信息"},{"key":"B","text":"转达推荐起点与约束"},{"key":"C","text":"提醒试切验证"},{"key":"D","text":"替客户拍板满参数批量生产"}],"answer":["A","B","C"],"explain":"销售在参数沟通中负责收集工况、转达推荐起点与约束、提醒试切验证；不能替客户拍板满参数批量生产，排除 D。","chapter":"parameter"},{"no":61,"stem":"客户要开一个深腔，可行的方案有（ ）。","options":[{"key":"A","text":"插铣"},{"key":"B","text":"摆线铣"},{"key":"C","text":"分层环切"},{"key":"D","text":"一次性大切深满槽"}],"answer":["A","B","C"],"explain":"深腔可行方案：插铣、摆线铣、分层环切；一次性大切深满槽错误，排除 D。","chapter":"strategy"},{"no":62,"stem":"需要用球头刀的场景有（ ）。","options":[{"key":"A","text":"模具型面"},{"key":"B","text":"叶轮曲面"},{"key":"C","text":"倒圆角过渡"},{"key":"D","text":"大平面开粗"}],"answer":["A","B","C"],"explain":"需要球头刀的场景：模具型面、叶轮曲面、倒圆角过渡；大平面开粗用面铣刀，排除 D。","chapter":"strategy"},{"no":63,"stem":"封闭腔正确的下刀方式有（ ）。","options":[{"key":"A","text":"螺旋下刀"},{"key":"B","text":"坡走下刀"},{"key":"C","text":"键槽铣刀（端刃过中心）垂直下刀"},{"key":"D","text":"普通立铣刀直接垂直扎"}],"answer":["A","B","C"],"explain":"封闭腔正确下刀：螺旋下刀、坡走下刀、键槽铣刀（端刃过中心）垂直下刀；普通立铣刀不能直接垂直扎，排除 D。","chapter":"strategy"},{"no":64,"stem":"插铣的要点有（ ）。","options":[{"key":"A","text":"切削力沿主轴轴向，适合刚性差的机床"},{"key":"B","text":"插削点重叠 0.3–0.6D"},{"key":"C","text":"退刀停转或快抬"},{"key":"D","text":"侧壁质量好，无需精铣"}],"answer":["A","B","C"],"explain":"插铣切削力沿主轴轴向、适合刚性差的机床，插削点重叠 0.3–0.6D，退刀停转或快抬；插铣侧壁质量差、仍需精铣，排除 D。","chapter":"strategy"},{"no":65,"stem":"摆线铣的特点有（ ）。","options":[{"key":"A","text":"小切宽 0.05–0.15D"},{"key":"B","text":"大切深"},{"key":"C","text":"圆弧轨迹、接触弧短散热快"},{"key":"D","text":"满槽直线走刀"}],"answer":["A","B","C"],"explain":"摆线铣小切宽 0.05–0.15D、大切深、圆弧轨迹接触弧短散热快；满槽直线走刀错误，排除 D。","chapter":"strategy"},{"no":66,"stem":"螺旋铣孔的优点有（ ）。","options":[{"key":"A","text":"一把刀加工多种孔径"},{"key":"B","text":"崩刃可补刀不报废整孔"},{"key":"C","text":"通孔盲孔通用"},{"key":"D","text":"小孔效率比钻头高"}],"answer":["A","B","C"],"explain":"螺旋铣孔优点：一把刀加工多种孔径、崩刃可补刀不报废整孔、通孔盲孔通用；小孔效率不如钻头，排除 D。","chapter":"strategy"},{"no":67,"stem":"深腔加工的综合措施有（ ）。","options":[{"key":"A","text":"分层切削"},{"key":"B","text":"内冷或气吹排屑"},{"key":"C","text":"长颈/锥颈刀具"},{"key":"D","text":"加大切宽提速"}],"answer":["A","B","C"],"explain":"深腔综合措施：分层切削、内冷或气吹排屑、长颈/锥颈刀具；加大切宽提速错误，排除 D。" "进给速度不变时，刃数越多，每齿负荷越小。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"vf 不变时，fz = vf/(z·n)，刃数越多每齿负荷越小，正确。","chapter":"tool_type"},{"no":20,"stem":"推荐刀具时应先了解客户的材料与工况，再谈型号与价格。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"推荐刀具应先了解客户材料与工况，再谈型号与价格，正确。","chapter":"sales"},{"no":21,"stem":"主轴转速由切削速度和刀具直径共同决定。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"主轴转速 n = 1000vc/(πD)，由切削速度和刀具直径共同决定，正确。","chapter":"parameter"},{"no":22,"stem":"刀具直径越大，相同切削速度下转速越高。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"转速越低","chapter":"parameter"},{"no":23,"stem":"进给速度的计算与刃数有关。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"进给速度 vf = fz×z×n，计算与刃数 z 有关，正确。","chapter":"parameter"},{"no":24,"stem":"满槽切削时应提高进给以缩短加工时间。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"应降至约 50%","chapter":"parameter"},{"no":25,"stem":"球头刀正对工件时，球心处的切削速度为零。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"球面上各点旋转半径不同，正对工件时球心半径趋近零、切削速度为零，正确。","chapter":"parameter"},{"no":26,"stem":"需求转速超过主轴上限时，可以强行超速运行。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"严禁超速","chapter":"parameter"},{"no":27,"stem":"功率校核通常以主轴额定功率的 80% 为红线。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"功率校核通常以主轴额定功率的 80% 为红线，正确。","chapter":"parameter"},{"no":28,"stem":"材料越硬，比切削力越大，功率需求越大。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"材料越硬比切削力 kc 越大，切除同样材料所需功率越大，正确。","chapter":"parameter"},{"no":29,"stem":"首件试切应降 20% 进给、15% 转速，合格后逐级提升。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"首件进给 −20%、转速 −15% 起步，合格后逐级提升，正确。","chapter":"sales"},{"no":30,"stem":"精加工时每齿进给越小越好，越小表面越光。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"过小进入挤压区，表面反而差","chapter":"parameter"},{"no":31,"stem":"面铣刀盘越大越好，不受机床功率限制。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"受功率约束","chapter":"strategy"},{"no":32,"stem":"摆线铣适合小功率机床开深槽。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"摆线铣小切宽大切深、切削力稳定，适合小功率机床开深槽，正确。","chapter":"strategy"},{"no":33,"stem":"插铣可以获得很好的侧壁质量，无需再精铣。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"侧壁差，需精铣","chapter":"strategy"},{"no":34,"stem":"普通立铣刀可以像键槽铣刀一样垂直扎刀。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"普通立铣刀端刃不过中心，不能像键槽铣刀那样垂直扎刀，错误。","chapter":"strategy"},{"no":35,"stem":"螺旋铣孔一把刀可以加工多种孔径。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"螺旋铣孔孔径由轨迹半径决定，一把刀可加工多种孔径，正确。","chapter":"strategy"},{"no":36,"stem":"高速铣削就是把转速开到最高。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"是策略体系","chapter":"strategy"},{"no":37,"stem":"清角刀具直径应不大于型腔底角 R。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"清角刀具直径应不大于型腔底角 R，才能进到角部，正确。","chapter":"strategy"},{"no":38,"stem":"深腔加工必须重视排屑与内冷。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"深腔加工排屑困难，必须重视排屑与内冷，正确。","chapter":"strategy"},{"no":39,"stem":"悬伸过长时，提高转速可以补偿刚性不足。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"应换长颈刀并降参数","chapter":"strategy"},{"no":40,"stem":"黑皮毛坯第一刀应降速切入。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"黑皮毛坯第一刀有硬点冲击，应降速切入防崩刃，正确。","chapter":"strategy"},{"no":41,"stem":"振纹的间距通常与系统振动频率和主轴转速相关。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"振纹间距通常与系统振动频率和主轴转速相关，正确。","chapter":"diagnosis"},{"no":42,"stem":"让刀可以通过加大切深来解决。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"应缩悬伸、减小切宽","chapter":"diagnosis"},{"no":43,"stem":"切屑颜色越深（蓝紫），说明切削区温度越高。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"切屑颜色越深（蓝紫），说明切削区温度越高，正确。","chapter":"diagnosis"},{"no":44,"stem":"高压内冷的主要价值是冲走切屑并控制切削区温度。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"高压内冷主要价值是冲走切屑并控制切削区温度，正确。","chapter":"cooling"},{"no":45,"stem":"干式切削对所有材料都能延长刀具寿命。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"因材料与涂层而异","chapter":"cooling"},{"no":46,"stem":"深孔一次钻到底不停退，是提高效率的正确方法。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"应啄钻退屑","chapter":"strategy"},{"no":47,"stem":"加工硬化材料时，切深小于硬化层会加速刀具磨损。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"加工硬化材料切深若小于硬化层，每刀都切在硬化层里，会加速刀具磨损，正确。","chapter":"diagnosis"},{"no":48,"stem":"批量生产中刀具寿命到期强制更换，是稳定尺寸的重要手段。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"批量生产中刀具寿命到期强制更换，是稳定尺寸的重要手段，正确。","chapter":"sales"},{"no":49,"stem":"试切出现异常声音时，可以加大进给把噪声压住继续加工。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["F"],"explain":"必须停机调整","chapter":"diagnosis"},{"no":50,"stem":"崩刃后应先停机保全现场，再分析原因。（　）","options":[{"key":"T","text":"正确（√）"},{"key":"F","text":"错误（×）"}],"answer":["T"],"explain":"崩刃后应先停机保全现场，再分析原因，正确。","chapter":"diagnosis"}],"qa":[{"no":1,"stem":"客户在电话里说：\"我要铣一批不锈钢零件，你们有什么推荐？\"请列出你至少应该追问的五个信息，并说明每个信息为什么重要。","options":[],"answer":[],"explain":"至少追问：①具体牌号与状态（304/316/沉淀硬化，决定 M 组内档位与参数）；②加工部位与特征（侧壁/槽/型腔/孔，决定刀型）；③粗加工还是精加工（决定几何与刃数）；④机床最高转速、功率与是否带内冷（决定参数可行域与刀具配置）；⑤批量与节拍（决定推荐\"效率优先\"还是\"稳定优先\"）。这些信息不齐，任何推荐都是猜。","chapter":"sales"},{"no":2,"stem":"客户问：\"我们用普通硬质合金铣刀铣高硅铝合金，一天换三把刀，你们有什么办法？\"请给出原因分析、推荐方案（刀具材料方向）与预期效果说明。","options":[],"answer":[],"explain":"原因：高硅铝合金中的硅相硬度极高，对普通硬质合金是剧烈的磨粒磨损，属于\"材料与刀具材料不匹配\"，调参数解决不了。方案：改用 PCD（聚晶金刚石）铣刀，寿命通常可提升一个数量级以上；同时说明 PCD 加工铝合金表面质量好、适合批量；提醒金刚石类刀具不能碰钢件。","chapter":"material"},{"no":3,"stem":"简述 ISO 513 七组划分的逻辑，每组各举一种典型材料，并说明为什么销售必须先弄清客户的材料组别。","options":[],"answer":[],"explain":"七组按切削行为分类：P 钢（45 钢）、M 不锈钢（304）、K 铸铁（HT200）、N 有色金属（6061）、S 耐热合金（TC4）、H 淬硬钢（HRC50+）、O 非金属/特种（石墨）。组别决定了刀具材料、涂层、几何与参数的整个方向；跨组套用方案容易出质量事故与投诉。先定组，推荐才有依据。","chapter":"material"},{"no":4,"stem":"客户发来零件图：材料 HRC 55 淬硬模具钢，要求精铣型腔、表面光洁。请给出刀具推荐方向（材料/涂层/几何），以及必须向客户交代的关键约束。","options":[],"answer":[],"explain":"推荐：超细晶硬质合金 65°/68° 系列或 CBN；涂层 AlTiN/TiSiN 类；负前角、刃口强化；球头刀或小圆鼻刀精铣。关键约束：径向切宽 ae ≤0.02D（防冲击崩刃）、小切深多刀、机床要求高转速与好刚性、装夹跳动 ≤0.02 mm；提醒客户淬硬钢\"怕撞不怕磨\"，参数宁稳勿激。","chapter":"strategy"},{"no":5,"stem":"客户是模具厂：P20 模块要开深 60 mm 型腔，底部 R2.5 清角，侧壁要求光洁。请按\"开粗 → 二次开粗/清角 → 侧壁精铣\"给出刀具推荐（类型/直径/涂层）与必须交代的关键约束。","options":[],"answer":[],"explain":"开粗：D16/D12 圆鼻刀（R1.5 左右），AlCrN 涂层，螺旋下刀 + 由内向外环切，分层 ap≤0.25D、步距 ≤0.5D，留 0.3 余量；清角：刀径 ≤底角 R2.5，按底角 R 选球刀/小圆鼻；侧壁精铣：D12 四刃立铣 ae ≤0.1D 一刀走完，vc≈80（P20 粗铣基准，精铣适当上调）。关键约束：镜面/高光要求 VB≥0.03 强制换刀；悬伸 ≤3D（深 60 需长颈刀）；分层每层一致。","chapter":"strategy"},{"no":6,"stem":"客户抱怨：\"弹簧夹头夹 D6 刀铣钢件，跳动大、老崩刀。\"请分析可能原因并给出改善建议（夹头选择、夹持长度、跳动测量、备选刀柄）。","options":[],"answer":[],"explain":"可能原因：夹头磨损/异物、夹持长度不足（D6 细刀只夹刀尖）、跳动超标使单齿过载、悬伸过长。建议：换高精度 AA 级新夹头，夹持长度 ≥3 倍柄径，装后实测跳动 ≤0.02，必要时上液压刀柄（减振、跳动小）；同时核对切削参数与悬伸。","chapter":"holder"},{"no":7,"stem":"比较热缩刀柄与液压刀柄的差异与适用场景，并说明什么情况下你会向客户推荐热缩刀柄。","options":[],"answer":[],"explain":"热缩：感应加热膨胀后冷却抱紧，跳动 ≤0.003、刚性最高、外形细不干涉，适合高速高精与深腔清角；需设备、换刀慢。液压：油腔膨胀包络，跳动小、减振好、换刀快，适合精加工与异形柄，价格高。推荐热缩的时机：客户做模具精加工/高速铣/深腔清角，对跳动与刚性敏感、且能接受一次性投入加热设备。","chapter":"holder"},{"no":8,"stem":"客户要在一批铝件上加工 M5、M6、M8 三种螺纹孔各 200 个（通孔）。请给出螺纹加工方案建议（螺纹铣与丝锥的选择）、理由与注意事项（底孔、切削液、防粘铝）。","options":[],"answer":[],"explain":"三种规格共 600 孔、通孔：推荐螺纹铣刀一把覆盖 M5/M6/M8（孔径由插补半径控制），崩刃可补刀不报废整孔，铝件排屑好；若客户已有刚性攻丝基础且追求单孔效率，可配螺旋槽丝锥攻 M5/M6 小孔、螺纹铣做 M8。注意事项：底孔直径按螺纹铣工艺留足（牙型高成形靠插补）、用含润滑性的非含氯切削液防粘铝、圆弧切入切出、孔口倒角去毛刺。","chapter":"tool_type"},{"no":9,"stem":"客户问：\"D16 四刃刀铣 45 钢，转速和进给给多少？\"（按 vc≈150 m/min、fz≈0.08 mm/z，π 取 3.14）请算出 n 与 vf，并向客户说明这两个数应如何验证。","options":[],"answer":[],"explain":"n = 1000×150/(3.14×16) ≈ 2986 r/min；vf = 0.08×4×2986 ≈ 956 mm/min。说明：这是典型工况的起点，上机先按 80% 进给/85% 转速试切，确认声音、切屑、表面、排屑、刀具状态五项正常后逐级 +10% 提升到该值；异常先回退排查再继续。","chapter":"parameter"},{"no":10,"stem":"客户机床只有 6000 r/min，但工艺卡要求 8000 r/min。你如何向客户解释并提出建议？","options":[],"answer":[],"explain":"解释：转速需求来自 vc 与直径，主轴到不了不能超速（动平衡与安全风险）。建议三条路：①按 6000 运行，实际 vc = π×D×6000/1000，核对是否仍在材料合理区间，可接受就用；②减小刀具直径降低 vc 需求；③核对材料组别看是否本就给了偏高起点。绝不能让客户超速。","chapter":"parameter"},{"no":11,"stem":"客户抱怨\"按你们给的参数铣不动，机床闷车\"。请写出你的信息收集清单与调整建议方向。","options":[],"answer":[],"explain":"收集：材料与硬度、刀具直径与刃数、当前 n/vf/ap/ae、机床功率与主轴状态、装夹与悬伸、排屑与冷却。调整方向：先校核功率（Pc 与额定 80% 红线对比），降 ap 或 ae 减负荷；查装夹松动、悬伸；查排屑堵塞；降低档位后按试切流程重新起步。","chapter":"parameter"},{"no":12,"stem":"请用向客户讲解的口吻，说明\"参数表上的数字是起点不是定值\"以及试切验证流程（−20% 进给、−15% 转速 → 五看 → 逐级 +10%）。","options":[],"answer":[],"explain":"讲解口径：参数表是\"典型机床、典型工况\"下的经验中值，你的机床刚性、装夹、材料批次都有差异；所以先降档试——进给打 8 折、转速打 8.5 折，看声音（无尖啸）、切屑（颜色形态正常）、表面（无振纹）、排屑（通畅）、刀具（无异常温升）五项；都正常做 2–3 件再每次加 10% 提到推荐值。这样几分钟的试切换来的是批量不出废品、刀具不崩。","chapter":"parameter"},{"no":13,"stem":"客户发来零件：45 钢块 100×80×40，要铣 60×40、深 25 的型腔，底角 R3，侧壁 Ra1.6。请按工序给出刀具与方式推荐（开粗/清角/侧壁精铣/底面），并说明关键参数锚点。","options":[],"answer":[],"explain":"开粗：D16/D12 圆鼻刀（R1.5），螺旋下刀 + 由内向外环切，分层 ap=3（≤0.25D）、步距 ≤0.5D、vc 110–130、留 0.3 余量；清角：R3 底角配 ≤R3 刀具清拐角，留均匀 0.15；侧壁精铣：D12 四刃顺铣 ae ≤0.1D 一刀走完（vc 140–160）；底面：圆鼻/平底小 ap 行切。锚点：分层 ≤0.25D、步距 ≤0.5D、ae ≤0.1D。","chapter":"strategy"},{"no":14,"stem":"客户机床 11 kW、8000 r/min，要开钛合金深槽。请给出加工方式的选择逻辑（摆线与插铣怎么选）、参数锚点与冷却要求。","options":[],"answer":[],"explain":"方式选择：机床功率尚可（11 kW）优先摆线铣开槽（大切深小切宽、接触弧短散热快）；若排屑极差或槽更深则插铣开粗后精修。锚点：TC4 vc≈50、ae ≤0.2D、摆线切宽 0.05–0.15D；冷却：高压内冷（4–8 MPa）必需，压力与指向要保证，不是多浇就行；屑防火。","chapter":"strategy"},{"no":15,"stem":"客户问：\"为什么你们推荐插铣，同行推荐满槽？\"请从切削力方向、排屑、机床刚性、侧壁质量四方面比较两者，并给出选择建议。","options":[],"answer":[],"explain":"比较插铣与满槽：切削力方向——插铣力沿主轴轴向（机床最刚性方向），满槽径向力大；排屑——插铣半封闭但可大流量内冷冲屑，满槽两侧切削容屑减半最易堵；机床刚性——插铣适合小机床与长悬伸，满槽要求好刚性；侧壁质量——插铣差需精铣，满槽侧壁由侧刃成形较好但易振纹。建议：深腔、排屑难、机床刚性一般选插铣（后配侧壁精修）；浅槽、机床好、追求效率可用满槽（降 50% 进给）。","chapter":"strategy"},{"no":16,"stem":"客户要加工壁厚 2 mm 的薄壁铝框，担心变形。请从装夹、刀具、参数、走刀顺序四个方面给出一套建议。","options":[],"answer":[],"explain":"装夹：真空吸盘或多点柔性支撑、压紧点正对支撑、精加工前松开重夹轻压；刀具：锋利大螺旋铝用刀；参数：高转速小 fz、小切宽层铣（ae 小）、ap 分层一致；顺序：粗精分开、对称去除、双面交替、粗后释放应力再精铣；全程充分冷却控温。","chapter":"strategy"},{"no":17,"stem":"客户投诉：\"你们这刀不行，铣 304 全是毛刺还崩了两次。\"请写出你的处理步骤：收集哪些信息、如何初判、何时引入工艺支持、如何给出改善方案。","options":[],"answer":[],"explain":"步骤：①先止损——请客户停机、隔离已加工可疑品、保留崩刃刀具与切屑（拍照）；②收集——材料牌号与批次硬度、机床与刀柄、悬伸、参数（n/vf/ap/ae）、崩口位置与形态（端刃外角=冲击，侧刃剥落=排屑/磨损）、切削液；③初判——按\"冲击/参数/装夹/排屑\"四源头对照，粘刀+毛刺指向积屑瘤（速度落在 10–50 区、刃口钝、润滑不足）；④引入工艺支持——把完整工况反馈给技术同事复核参数与刀具方案；⑤给方案——换锋利大后角含铝韧性涂层刀具、vc 提到 90–110 或配高压内冷、含硫极压液、切深跨硬化层进给不停顿，并要求按试切流程重新验证，不做无依据的赔偿承诺。","chapter":"diagnosis"},{"no":18,"stem":"客户问：\"我们首件总是合格，批量做着做着就超差了。\"请列出至少五个可能原因与对应的排查动作。","options":[],"answer":[],"explain":"可能原因与排查：①刀具渐进磨损——记录换刀间隔，VB 测量，按寿命强制换；②装夹位移/松动——检查压板扭矩与定位面；③积屑瘤时大时小——查速度区间与切削液浓度；④排屑渐堵、二次切削——清屑、查内冷过滤；⑤材料批次硬度漂移——抽测硬度、按修正降速；⑥参数漂移或程序被改——锁定参数与首件对比。","chapter":"sales"},{"no":19,"stem":"请用向新客户讲解的口吻，说明\"为什么必须试切，不能直接按推荐参数批量生产\"，并给出说辞与流程。","options":[],"answer":[],"explain":"说辞：参数表是典型工况的中值，贵司机床刚性、装夹、材料批次与我们试验条件有差异；直接满参数等于把试错成本压到批量上。流程：首件进给 −20%、转速 −15% → 看声音、切屑、表面、排屑、刀具五项 → 正常做 2–3 件（VB<0.15）→ 每次加 10% 提到推荐值；任何一步异常先回退再排查。几分钟试切换批量稳定。","chapter":"sales"},{"no":20,"stem":"客户第一次采购，请你教他\"怎么验收刀具、怎么管理刀具寿命\"。请给出验收要点与寿命管理制度（VB、件数、声音三类判据 + 记录表要素）。","options":[],"answer":[],"explain":"验收：核对型号规格与包装标识、测径向跳动 ≤0.02（精铣）、外观无磕碰、涂层完好、记录批次。寿命管理：①VB 判据——常规精铣 0.3 mm、一般精件 0.15、镜面 0.03，达阈值强制换；②件数/时长判据——按计划件数或机时到期换，不等崩；③声音判据——尖啸、闷响、功率突升立即停机检查。记录表要素：日期、机床、材料批次、刀具型号、参数、加工件数、VB 或失效模式、处理结果；每月汇总对比，作为选型与议价依据。","chapter":"sales"}]};
