const LS_WRONG="quiz_wrong_v1", LS_HIST="quiz_history_v1", LS_RECORD="quiz_record_v1", LS_FAV="quiz_fav_v1", LS_PROGRESS="quiz_progress_v1", LS_DAILY="quiz_daily_v1", LS_DOUBT="quiz_doubt_v1", LS_SETTINGS="quiz_settings_v1";

let state = {view:"practice"};

function loadLS(k, def){try{return JSON.parse(localStorage.getItem(k))||def;}catch(e){return def;}}
function saveLS(k,v){localStorage.setItem(k,JSON.stringify(v));}
const WRONG_PASS=3;

/* ---------- 错题本 ---------- */
function getWrong(){
  let w=loadLS(LS_WRONG,{single:{},multi:{},judge:{},qa:{}});
  ["single","multi","judge","qa"].forEach(t=>{
    if(Array.isArray(w[t])){w[t]=Object.fromEntries(w[t].map(n=>[String(n),0]));}
    if(!w[t]||typeof w[t]!=="object")w[t]={};
    Object.keys(w[t]).forEach(k=>{
      const v=w[t][k];
      if(typeof v==="number")w[t][k]={c:v,w:0,t:0};
      else if(!v||typeof v!=="object")w[t][k]={c:0,w:0,t:0};
    });
  });
  return w;
}
function setWrong(w){saveLS(LS_WRONG,w);}
function wrongInfo(t,q){const w=getWrong();const v=w[t]&&w[t][q.no];return v||{c:0,w:0,t:0};}
function wrongCount(t,q){return wrongInfo(t,q).c;}
function inWrong(t,q){const w=getWrong();return !!(w[t]&&w[t][q.no]!=null);}
function recordResult(t,q,correct,ctx){
  const w=getWrong();if(!w[t])w[t]={};
  const key=String(q.no);
  const now=Date.now();
  if(ctx==="wrong"){
    // 错题本单独重练：答对累计，连续答对 3 次移除；答错清零并累计答错次数
    if(correct){
      const c=(w[t][key]?w[t][key].c:0)+1;
      if(c>=WRONG_PASS)delete w[t][key];
      else{w[t][key].c=c;w[t][key].t=now;}
    }else{
      const v=w[t][key]||{c:0,w:0,t:0};
      v.c=0;v.w=(v.w||0)+1;v.t=now;w[t][key]=v;
    }
  }else{
    // 普通练习 / 收藏练习 / 考试：答对不进、不改动错题本；答错才加入并累计答错次数
    if(correct)return;
    const v=w[t][key]||{c:0,w:0,t:0};
    v.c=0;v.w=(v.w||0)+1;v.t=now;w[t][key]=v;
  }
  setWrong(w);
}

/* ---------- 答题记录（题型/章节正确率） ---------- */
function getRecord(){
  let r=loadLS(LS_RECORD,{single:{total:0,right:0},multi:{total:0,right:0},judge:{total:0,right:0},qa:{total:0,right:0},chapters:{}});
  ["single","multi","judge","qa"].forEach(t=>{if(!r[t]||typeof r[t]!=="object")r[t]={total:0,right:0};});
  if(!r.chapters||typeof r.chapters!=="object")r.chapters={};
  Object.keys(CHAPTERS).forEach(ch=>{if(!r.chapters[ch]||typeof r.chapters[ch]!=="object")r.chapters[ch]={total:0,right:0};});
  return r;
}
function recordAnswer(t,correct,q){
  if(correct===undefined)return;
  const r=getRecord();r[t].total++;if(correct)r[t].right++;
  if(q&&q.chapter){const ch=r.chapters[q.chapter];ch.total++;if(correct)ch.right++;}
  saveLS(LS_RECORD,r);
  const d=loadLS(LS_DAILY,{});const k=todayKey();
  if(!d[k])d[k]={total:0,right:0};
  d[k].total++;if(correct)d[k].right++;saveLS(LS_DAILY,d);
}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dailySummary(){
  const d=loadLS(LS_DAILY,{});const today=d[todayKey()]||{total:0,right:0};
  const days=Object.keys(d).sort().slice(-7).reverse();
  return {today,days,all:d};
}
function accuracy(t){const r=getRecord()[t];return r.total?Math.round(r.right/r.total*100):null;}

function inFav(t,q){return getFav()[t].includes(q.no);}
function toggleFav(t,q){const f=getFav();const i=f[t].indexOf(q.no);if(i>=0)f[t].splice(i,1);else f[t].push(q.no);saveLS(LS_FAV,f);}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setupSwipe(){
  const el=document.getElementById("app");if(!el)return;
  let sx=0,sy=0,st=0;
  el.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;st=Date.now();},{passive:true});
  el.addEventListener("touchend",e=>{
    const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Date.now()-st>600)return;
    if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy))return;
    const prev=document.querySelector("#pPrev,#rPrev,#ePrev");
    const next=document.querySelector("#pNext,#rNext,#eNext");
    const btn=dx<0?next:prev;
    if(btn)btn.click();
  },{passive:true});
}
function qkey(t,q){return t+"#"+q.no;}

/* ---------- 进度持久化 ---------- */
function snapPool(pool){return pool.map(x=>({t:x.t,no:x.q.no}));}
function restorePool(snap){return (snap||[]).map(x=>({t:x.t,q:DATA[x.t].find(q=>q.no===x.no)})).filter(x=>x.q);}
function snapState(s){return {pool:snapPool(s.pool),idx:s.idx,answers:s.answers,results:s.results,autoNext:!!s.autoNext};}
function restoreState(s){return {pool:restorePool(s.pool),idx:s.idx,answers:s.answers||{},results:s.results||{},autoNext:!!s.autoNext};}
function snapReview(s){return {pool:snapPool(s.pool),idx:s.idx,hide:!!s.hide};}
function restoreReview(s){return {pool:restorePool(s.pool),idx:s.idx,hide:!!s.hide};}
function saveProgress(){
  const prog={};
  if(state.practiceMap)prog.practiceMap=Object.fromEntries(Object.entries(state.practiceMap).map(([k,v])=>[k,snapState(v)]));
  if(state.wrongPractice)prog.wrongPractice=snapState(state.wrongPractice);
  if(state.favPractice)prog.favPractice=snapState(state.favPractice);
  if(state.reviewMap)prog.reviewMap=Object.fromEntries(Object.entries(state.reviewMap).map(([k,v])=>[k,snapReview(v)]));
  if(state.review)prog.review={pool:snapPool(state.review.pool),idx:state.review.idx,hide:state.review.hide};
  if(state.exam&&!state.exam.submitted)prog.exam={pool:snapPool(state.exam.paper),idx:state.exam.idx,answers:state.exam.answers,qaEval:state.exam.qaEval};
  saveLS(LS_PROGRESS,prog);
}
function loadProgress(){
  const prog=loadLS(LS_PROGRESS,{});
  state.practiceMap={};
  if(prog.practiceMap)Object.entries(prog.practiceMap).forEach(([k,v])=>state.practiceMap[k]=restoreState(v));
  else if(prog.practice)state.practiceMap.all=restoreState(prog.practice);
  if(prog.wrongPractice)state.wrongPractice=restoreState(prog.wrongPractice);
  if(prog.favPractice)state.favPractice=restoreState(prog.favPractice);
  state.reviewMap={};
  if(prog.reviewMap)Object.entries(prog.reviewMap).forEach(([k,v])=>state.reviewMap[k]=restoreReview(v));
  else if(prog.review)state.reviewMap.all=restoreReview(prog.review);
  if(prog.review)state.review=state.reviewMap.all;
  if(prog.exam)state.exam={paper:restorePool(prog.exam.pool),idx:prog.exam.idx,answers:prog.exam.answers||{},qaEval:prog.exam.qaEval||{},submitted:false};
}

/* ---------- 题库检索 ---------- */
function searchPool(kw){
  kw=(kw||"").trim().toLowerCase();if(!kw)return[];
  let out=[];
  Object.keys(DATA).forEach(t=>DATA[t].forEach(q=>{
    const hay=(q.stem+" "+q.options.map(o=>o.text).join(" ")+" "+q.answer.join("")).toLowerCase();
    if(hay.includes(kw))out.push({t,q});
  }));
  return out;
}
function bindCheckAll(cls){
  const boxes=[...document.querySelectorAll("."+cls)];
  const all=boxes.find(b=>b.value==="all");
  boxes.forEach(b=>b.onchange=()=>{
    if(b===all&&b.checked){boxes.forEach(x=>{if(x!==all)x.checked=false;});}
    else if(b!==all&&b.checked){all.checked=false;}
  });
}
function selectedTypes(cls){
  const checked=[...document.querySelectorAll("."+cls+":checked")].map(b=>b.value);
  return checked.includes("all")?"all":checked;
}
function shuffleOptions(q){
  if(!q.options||!q.options.length) return q;
  const labels=["A","B","C","D","E","F","G","H"];
  const newOrder=shuffle(q.options.map((o,i)=>i)); // newOrder[新位置]=旧下标
  const options=newOrder.map((oi,i)=>({key:labels[i],text:q.options[oi].text}));
  const answer=q.answer.map(k=>{
    const oi=q.options.findIndex(o=>o.key===k);
    const np=newOrder.indexOf(oi);
    return labels[np];
  }).sort();
  return {...q,options,answer};
}
function buildPool(type,order,kw,limit,chapter){
  let pool=[];
  const types=(type==="all")?Object.keys(DATA):(Array.isArray(type)?type:[type]);
  if(kw&&kw.trim()){pool=searchPool(kw);}
  else{types.forEach(t=>DATA[t].forEach(q=>pool.push({t,q})));}
  if(chapter&&chapter!=="all")pool=pool.filter(x=>x.q.chapter===chapter);
  if(order==="random")order="qrand";
  if(order==="arand"||order==="qarand")pool=pool.map(x=>({t:x.t,q:shuffleOptions(x.q)}));
  if(order==="qrand"||order==="qarand")pool=shuffle(pool);
  if(limit&&limit>0)pool=pool.slice(0,limit);
  return pool;
}
function chapterCount(types,ch){
  const ts=(types==="all"||!types)?Object.keys(DATA):(Array.isArray(types)?types:[types]);
  let n=0;ts.forEach(t=>{const arr=DATA[t]||[];n+=ch?arr.filter(q=>q.chapter===ch).length:arr.length;});
  return n;
}
function fillChapterSelect(sel,types,cur){
  const opts=[`<option value="all">全部章节（${chapterCount(types)}）</option>`];
  Object.entries(CHAPTERS).forEach(([ch,c])=>{
    const n=chapterCount(types,ch);
    if(n>0)opts.push(`<option value="${ch}">${c.title}（${n}）</option>`);
  });
  sel.innerHTML=opts.join("");
  sel.value=(cur&&chapterCount(types,cur)>0)?cur:"all";
}

/* ---------- 刷题练习 ---------- */
function practiceStateName(ctx){return {wrong:"wrongPractice",fav:"favPractice"}[ctx]||"practice";}
function pmKeyOf(types){return (Array.isArray(types)?[...types].sort():[types]).join(",");}
function pmPoolKey(pool){return [...new Set(pool.map(x=>x.t))].sort().join(",");}
function backToPracticeHome(ctx){
  ctx=ctx||"practice";
  if(ctx==="practice"){
    if(state.practiceKey)delete state.practiceMap[state.practiceKey];
    state.practice=null;state.practiceKey=null;
  }else{state[practiceStateName(ctx)]=null;}
  saveProgress();
  if(ctx==="wrong")renderWrong(); else if(ctx==="fav")renderFav(); else renderPractice();
}
function renderPractice(){
  const types=Object.keys(DATA);
  const weak=weakType();
  // 五张卡独立统计：全部题型卡只看四类综合套，各题型卡只看对应套
  const pm=state.practiceMap||{};
  const progByType={};
  let allSet=null;
  Object.values(pm).forEach(s=>{
    if(!s||!s.pool)return;
    const tSet=new Set(s.pool.map(x=>x.t));
    if(tSet.size===types.length){allSet=s;}
    else{
      s.pool.forEach(x=>{
        const k=qkey(x.t,x.q);
        progByType[x.t]=progByType[x.t]||{done:new Set(),total:new Set()};
        progByType[x.t].total.add(k);
        if(s.results[k])progByType[x.t].done.add(k);
      });
    }
  });
  const footAll=allSet?`已练 ${Object.keys(allSet.results).length}/${allSet.pool.length}`:"未开始";
  const footType=t=>{const pr=progByType[t];return pr?`已练 ${pr.done.size}/${pr.total.size}`:"未开始";};
  app.innerHTML=`
  <div class="card">
    <div class="muted">选择题型、顺序与题量，逐题作答，即时显示对错与解析；答错自动加入错题本。</div>
    <div class="type-grid">
      <div class="type-card sel" data-val="all">
        <input type="checkbox" class="ptype" value="all" checked>
        <div class="type-icon" style="background:#F0F2F7;color:#1F2733">✦</div>
        <div class="t-title">全部题型</div>
        <div class="t-desc">四类综合练习</div>
        <div class="type-foot"><span class="cnt">${Object.values(DATA).reduce((a,x)=>a+x.length,0)} 题</span><span class="st">${footAll}</span></div>
      </div>
      ${types.map(t=>{const m=TYPE_META[t];return `<div class="type-card" data-val="${t}">
        <input type="checkbox" class="ptype" value="${t}">
        <div class="type-icon" style="background:${m.bg};color:${m.color}">${m.icon}</div>
        <div class="t-title">${m.title}</div>
        <div class="t-desc">${m.desc}</div>
        <div class="type-foot"><span class="cnt">${DATA[t].length} 题</span><span class="st">${footType(t)}</span></div>
      </div>`;}).join("")}
    </div>
    <div class="row">
      <label>章节：<select id="pChapter"></select></label>
      <label>顺序：<select id="pOrder">
        <option value="seq" selected>不随机</option><option value="qrand">题目顺序随机</option><option value="arand">答案顺序随机</option><option value="qarand">题目和答案顺序随机</option>
      </select></label>

      <label>答对后：<select id="pAuto">
        <option value="auto" selected>答对自动跳下一题</option><option value="manual">手动点下一题</option>
      </select></label>

      <button class="btn btn-ghost" id="pSearch">搜题练习</button>
      ${weak?`<button class="btn btn-ghost" id="pWeak">只练最弱题型：${TYPE_NAME[weak]}</button>`:""}
    </div>
    <div class="muted" id="pSearchInfo" style="margin-top:8px"></div>
  </div>`;
  const start=(pool,key,reset)=>{
    if(!pool.length){alert("没有匹配的题目");return;}
    const auto=document.getElementById("pAuto")&&document.getElementById("pAuto").value==="auto";
    key=key||pmPoolKey(pool);

    if(saved&&saved.idx<saved.pool.length){
      state.practice=saved;state.practiceKey=key;
    }else{
      const fresh={pool,idx:0,answers:{},results:{},autoNext:auto};
      state.practiceMap[key]=fresh;state.practice=fresh;state.practiceKey=key;

  };
  document.getElementById("pSearch").onclick=()=>{
    const kw=document.getElementById("pKw").value;

    document.getElementById("pSearchInfo").textContent=pool.length?`匹配到 ${pool.length} 题`:"无匹配结果";

function weakType(){
  let best=null,bestAcc=101;
  Object.keys(DATA).forEach(t=>{const a=accuracy(t);if(a!=null&&a<bestAcc){bestAcc=a;best=t;}});
  return best;
}

function renderPracticeCard(ctx){
  ctx=ctx||"practice";
  const sName=practiceStateName(ctx);
  const p=state[sName];
  if(!p||p.idx>=p.pool.length){
    app.innerHTML=`<div class="card"><h3>练习完成</h3><p class="muted">共 ${p?p.pool.length:0} 题。可在错题本回顾答错题目。</p>
      <div class="row"><button class="btn btn-ghost" onclick="backToPracticeHome('${ctx}')">返回练习</button></div></div>`;
    return;
  }
  const {t,q}=p.pool[p.idx];
  const key=qkey(t,q);
  const sel=(p.answers[key]||[]).slice();
  const done=!!p.results[key];
  const qaText=p.answers[key+"_text"]||"";
  const fav=inFav(t,q);
  const doubt=inDoubt(t,q);
  app.innerHTML=`
  <div class="card">
    <div class="muted">第 ${p.idx+1} / ${p.pool.length} 题${ctx==="wrong"?"（错题重练）":ctx==="fav"?"（收藏练习）":""}</div>
    <div class="progress"><i style="width:${(p.idx)/p.pool.length*100}%"></i></div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span class="tag ${t}">${TYPE_NAME[t]}</span><span class="muted">题号 ${q.no}</span>
      ${q.chapter&&CHAPTERS[q.chapter]?`<span class="chip" style="background:${CHAPTERS[q.chapter].bg};color:${CHAPTERS[q.chapter].color};border-color:transparent">${CHAPTERS[q.chapter].title}</span>`:""}
      ${ctx==="wrong"?'<span class="chip">错题重练</span>':""}${ctx==="fav"?'<span class="chip">收藏练习</span>':""}
      <button class="star-btn ${fav?"on":""}" id="favBtn" title="收藏/取消收藏">${fav?"★":"☆"} 收藏</button>
      <button class="star-btn ${doubt?"doubt-on":""}" id="doubtBtn" title="标记存疑">${doubt?"?":"？"} 存疑</button>
    </div>
    <div class="stem">${escapeHtml(q.stem)}</div>
    <div class="opts" id="opts">${renderOptions(t,q,sel,done)}</div>
    ${t==="qa"?`<textarea class="qa-box" id="qaText" ${done?"disabled":""} placeholder="在此输入你的作答（可对照下方参考答案要点自评）">${escapeHtml(qaText)}</textarea>`:""}
    <div class="feedback" id="fb"></div>
    <div class="row">
      ${!done?`<button class="btn btn-primary" id="pCheck">提交答案</button>`:""}
      <button class="btn btn-ghost" id="pPrev">上一题</button><button class="btn btn-primary" id="pNext">${p.idx===p.pool.length-1?"完成":"下一题"}</button>
      <button class="btn btn-ghost" id="pQuit">退出练习</button>
    </div>
    <div class="row">
      <label class="muted">跳到第 <input id="jumpNo" type="number" min="1" max="${p.pool.length}" value="${p.idx+1}" style="width:70px"> 题</label>
      <button class="btn btn-ghost" id="jumpBtn">跳转</button>
    </div>
    <div class="qnav">${p.pool.map((x,i)=>{
      const k2=qkey(x.t,x.q);let c="";
      const r=p.results[k2];
      if(r)c=r.correct?"qnav-ok":"qnav-no";
      else if((p.answers[k2]||[]).length||(p.answers[k2+"_text"]||"").trim())c="qnav-done";
      const isFav=inFav(x.t,x.q),isD=inDoubt(x.t,x.q);
      const extra=[isFav?"qnav-fav":"",isD?"qnav-doubt":""].filter(Boolean).join(" ");
      let mk="";if(isFav)mk+='<span class="mk">★</span>';if(isD)mk+='<span class="mk">?</span>';
      return `<button class="qnav-btn ${c} ${extra} ${i===p.idx?"qnav-cur":""}" data-i="${i}">${i+1}${mk}</button>`;
    }).join("")}</div>
  </div>`;

  const submitCurrent=(forceNext)=>{
    if(p.results[key])return;
    let correct;
    if(t==="qa"){
      p.answers[key+"_text"]=document.getElementById("qaText").value;
      p.results[key]={self:undefined};correct=undefined;
    }else{
      const curSel=(p.answers[key]||[]).slice();
      correct=isCorrect(t,q,curSel);
      p.results[key]={correct,sel:curSel};
      recordResult(t,q,correct,ctx);recordAnswer(t,correct,q);
    }
    saveProgress();renderPracticeCard(ctx);
    const auto=(p.autoNext&&correct===true&&t!=="qa")||forceNext;
    if(auto&&p.idx<p.pool.length-1){
      setTimeout(()=>{p.idx++;saveProgress();renderPracticeCard(ctx);},100);
    }
  };
  bindOptions(t,q,sel,done,p,()=>submitCurrent(true));
  document.getElementById("favBtn").onclick=()=>{toggleFav(t,q);renderPracticeCard(ctx);};
  const doubtBtn=document.getElementById("doubtBtn");
  if(doubtBtn)doubtBtn.onclick=()=>{toggleDoubt(t,q);renderPracticeCard(ctx);};
  if(t==="qa"){document.getElementById("qaText").oninput=e=>{p.answers[key+"_text"]=e.target.value;saveProgress();};}
  document.getElementById("pQuit").onclick=()=>{
    if(ctx==="practice"){
      if(state.practice&&state.practiceKey)state.practiceMap[state.practiceKey]=state.practice;
      state.practice=null;state.practiceKey=null;
      saveProgress();renderPractice();
    }
    else{state[sName]=null;saveProgress(); if(ctx==="wrong")renderWrong(); else renderFav();}
  };

  if(done){
    const r=p.results[key];
    if(t==="qa")renderQaFeedback(t,q,key,r,p,ctx);
    else showChoiceFeedback(t,q,r.sel,r.correct);
  }

  const chk=document.getElementById("pCheck");
  if(chk)chk.onclick=submitCurrent;
  const prev=document.getElementById("pPrev"),next=document.getElementById("pNext");
  if(prev)prev.onclick=()=>{if(p.idx>0){p.idx--;saveProgress();renderPracticeCard(ctx);}};
  if(next)next.onclick=()=>{if(p.idx===p.pool.length-1){renderPracticeCard(ctx);}else{p.idx++;saveProgress();renderPracticeCard(ctx);}};
  document.getElementById("jumpBtn").onclick=()=>{
    const n=parseInt(document.getElementById("jumpNo").value);
    if(n>=1&&n<=p.pool.length){p.idx=n-1;saveProgress();renderPracticeCard(ctx);}
  };
  document.querySelectorAll(".qnav-btn").forEach(b=>b.onclick=()=>{p.idx=parseInt(b.dataset.i);saveProgress();renderPracticeCard(ctx);});
}

function renderOptions(t,q,sel,disabled){
  return q.options.map(o=>{
    const on=sel.includes(o.key);
    return `<div class="opt ${on?"sel":""} ${disabled?"disabled":""}" data-key="${o.key}">
      <span class="key">${o.key}.</span><span>${escapeHtml(o.text)}</span></div>`;
  }).join("");
}
function bindOptions(t,q,sel,disabled,p,onDbl){
  document.querySelectorAll("#opts .opt").forEach(el=>{
    if(disabled){el.classList.add("disabled");return;}
    const k=el.dataset.key;
    const sync=(forceOn)=>{
      let cur=p.answers[qkey(t,q)]||[];
      if(t==="multi"){
        if(forceOn){if(!cur.includes(k))cur.push(k);}
        else{cur.includes(k)?cur.splice(cur.indexOf(k),1):cur.push(k);}
      }else{cur=[k];}
      p.answers[qkey(t,q)]=cur;saveProgress();
      document.querySelectorAll("#opts .opt").forEach(x=>x.classList.toggle("sel",cur.includes(x.dataset.key)));
    };
    el.onclick=()=>{
      sync(false);
      const now=Date.now();
      if(el._t&&now-el._t<300){sync(true);onDbl&&onDbl();}
      el._t=now;
    };
  });
}
function isCorrect(t,q,sel){
  const a=q.answer.slice().sort().join("");
  return sel.slice().sort().join("")===a;
}
function showChoiceFeedback(t,q,sel,correct){
  const fb=document.getElementById("fb");
  fb.style.display="block";
  fb.className="feedback "+(correct?"ok":"no");
  const right=q.answer.join("、");
  let html=`<div><b>${correct?"✓ 回答正确":"✗ 回答错误"}</b>　正确答案：${right}</div>`;
  if(q.explain)html+=`<div class="explain"><b>解析：</b>${escapeHtml(q.explain)}</div>`;
  fb.innerHTML=html;
  document.querySelectorAll("#opts .opt").forEach(el=>{
    const k=el.dataset.key;
    if(q.answer.includes(k))el.classList.add("correct");
    else if(sel.includes(k))el.classList.add("wrong");
  });
}
function renderQaFeedback(t,q,key,r,p,ctx){
  const fb=document.getElementById("fb");
  fb.style.display="block";
  fb.className="feedback ok";
  let selfHtml;
  if(r.self===undefined){
    selfHtml=`<div class="selfeval">
      <button class="btn btn-green" data-e="1">我答对了</button><button class="btn btn-red" data-e="0">加入错题</button></div>`;
  }else{
    selfHtml=`<span class="chip">${r.self?"已计为答对":"已加入错题"}</span>`;
  }
  fb.innerHTML=`<div><b>参考答案要点：</b></div><div class="explain">${escapeHtml(q.explain||"（原表未提供要点）")}</div>${selfHtml}`;
  fb.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const ok=b.dataset.e==="1";
    p.results[key].self=ok;
    recordResult(t,q,ok,ctx);recordAnswer("qa",ok,q);
    saveProgress();renderPracticeCard(ctx);
  });
}

/* ---------- 背题模式 ---------- */
function renderReview(){
  const types=Object.keys(DATA);
  // 背题进度与刷题同口径：全部卡只看四类综合套，各题型卡只看对应套
  const rpm=state.reviewMap||{};
  const rProgByType={};
  let rAllSet=null;
  Object.values(rpm).forEach(s=>{
    if(!s||!s.pool)return;
    const tSet=new Set(s.pool.map(x=>x.t));
    if(tSet.size===types.length){rAllSet=s;}
    else{
      s.pool.forEach((x,i)=>{
        const k=qkey(x.t,x.q);
        rProgByType[x.t]=rProgByType[x.t]||{done:new Set(),total:new Set()};
        rProgByType[x.t].total.add(k);
        if(i<s.idx)rProgByType[x.t].done.add(k);
      });
    }
  });
  const rFootAll=rAllSet?`已浏览 ${rAllSet.idx}/${rAllSet.pool.length}`:"未开始";
  const rFootType=t=>{const pr=rProgByType[t];return pr?`已浏览 ${pr.done.size}/${pr.total.size}`:"未开始";};
  app.innerHTML=`
  <div class="card">
    <div class="muted">背题模式：浏览题目与答案解析，可先隐藏答案自测，再显示核对。</div>
    <div class="type-grid">
      <div class="type-card sel" data-val="all">
        <input type="checkbox" class="rtype" value="all" checked>
        <div class="type-icon" style="background:#F0F2F7;color:#1F2733">✦</div>
        <div class="t-title">全部题型</div>
        <div class="t-desc">四类综合背题</div>
        <div class="type-foot"><span class="cnt">${Object.values(DATA).reduce((a,x)=>a+x.length,0)} 题</span><span class="st">${rFootAll}</span></div>
      </div>
      ${types.map(t=>{const m=TYPE_META[t];return `<div class="type-card" data-val="${t}">
        <input type="checkbox" class="rtype" value="${t}">
        <div class="type-icon" style="background:${m.bg};color:${m.color}">${m.icon}</div>
        <div class="t-title">${m.title}</div>
        <div class="t-desc">${m.desc}</div>
        <div class="type-foot"><span class="cnt">${DATA[t].length} 题</span><span class="st">${rFootType(t)}</span></div>
      </div>`;}).join("")}
    </div>
    <div class="row">
      <label>章节：<select id="rChapter"></select></label>
      <label>顺序：<select id="rOrder">
        <option value="seq" selected>不随机</option><option value="qrand">题目顺序随机</option><option value="arand">答案顺序随机</option><option value="qarand">题目和答案顺序随机</option>
      </select></label>
      <button class="btn btn-primary" id="rStart">开始背题</button>
    </div>
  </div>`;
  const rBoxes=[...document.querySelectorAll(".rtype")];
  const rAll=rBoxes.find(b=>b.value==="all");
  const rRefresh=()=>{document.querySelectorAll(".type-card").forEach(c=>{const b=rBoxes.find(x=>x.value===c.dataset.val);c.classList.toggle("sel",!!(b&&b.checked));});};
  const rChapter=document.getElementById("rChapter");
  const rRefreshChapter=()=>fillChapterSelect(rChapter,selectedTypes("rtype"),rChapter.value);
  rBoxes.forEach(b=>b.onchange=()=>{
    if(b===rAll&&b.checked){rBoxes.forEach(x=>{if(x!==rAll)x.checked=false;});}
    else if(b!==rAll&&b.checked){rAll.checked=false;}
    rRefresh();rRefreshChapter();
  });
  rRefreshChapter();
  const startReview=(sel,chapter,reset)=>{
    if(sel!=="all"&&!sel.length){alert("请至少选择题型");return;}
    state.reviewMap=state.reviewMap||{};
    const pool=buildPool(sel,document.getElementById("rOrder").value,"",0,chapter);
    if(!pool.length){alert("该章节暂无题目");return;}
    const base=sel==="all"?pmKeyOf(types):pmKeyOf(sel);
    const key=chapter==="all"?base:base+"#ch:"+chapter;
    const saved=(!reset&&state.reviewMap[key])?state.reviewMap[key]:null;
    let r;
    if(saved){r=saved;}
    else{r={pool,idx:0,hide:false};state.reviewMap[key]=r;}
    state.review=r;state.reviewKey=key;
    saveProgress();renderReviewCard();
  };
  document.getElementById("rStart").onclick=()=>startReview(selectedTypes("rtype"),document.getElementById("rChapter").value,true);
  document.querySelectorAll(".type-card").forEach(c=>{
    const b=rBoxes.find(x=>x.value===c.dataset.val);
    c.onclick=()=>{
      rBoxes.forEach(x=>x.checked=false);
      b.checked=true;
      rRefresh();rRefreshChapter();
    };
    // 双击某个题型：只选该题型并直接继续背题
    c.ondblclick=()=>{
      rBoxes.forEach(x=>x.checked=false);
      b.checked=true;rRefresh();
      startReview(b.value,document.getElementById("rChapter").value,false);
    };
  });
}
function renderReviewCard(){

  }

      const ok=!hide&&q.answer.includes(o.key);
      return `<div class="opt ${ok?"correct":""} disabled"><span class="key">${o.key}.</span><span>${escapeHtml(o.text)}</span></div>`;
    }).join("")}</div>`;

    fbHtml=`<div class="feedback" style="display:block"><button class="btn btn-ghost" id="revealBtn">显示答案</button></div>`;

    fbHtml=`<div class="feedback ok" style="display:block"><div><b>参考答案要点：</b></div><div class="explain">${escapeHtml(q.explain||"（原表未提供要点）")}</div></div>`;
  }else{
    fbHtml=`<div class="feedback ok" style="display:block"><div><b>正确答案：${rightText}</b></div>
      ${q.explain?`<div class="explain"><b>解析：</b>${escapeHtml(q.explain)}</div>`:""}</div>`;
  }
  app.innerHTML=`
  <div class="card">
    <div class="muted">第 ${r.idx+1} / ${r.pool.length} 题</div>
    <div class="progress"><i style="width:${r.idx/r.pool.length*100}%"></i></div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span class="tag ${t}">${TYPE_NAME[t]}</span><span class="muted">题号 ${q.no}</span>
      ${q.chapter&&CHAPTERS[q.chapter]?`<span class="chip" style="background:${CHAPTERS[q.chapter].bg};color:${CHAPTERS[q.chapter].color};border-color:transparent">${CHAPTERS[q.chapter].title}</span>`:""}
      <button class="star-btn ${inFav(t,q)?"on":""}" id="favBtn">${inFav(t,q)?"★":"☆"} 收藏</button>
      <button class="star-btn ${inDoubt(t,q)?"doubt-on":""}" id="doubtBtn" title="标记存疑">${inDoubt(t,q)?"?":"？"} 存疑</button>
    </div>
    <div class="stem">${escapeHtml(q.stem)}</div>
    ${optsHtml}
    ${fbHtml}
    <div class="row">
      <button class="btn btn-ghost" id="rPrev">上一题</button>
      <button class="btn btn-primary" id="rNext">${r.idx===r.pool.length-1?"完成":"下一题"}</button>
      <button class="btn btn-ghost" id="rHide">${hide?"显示答案":"隐藏答案"}</button>
      <button class="btn btn-ghost" id="rQuit">退出背题</button>
    </div>
    <div class="row">
      <label class="muted">跳到第 <input id="jumpNo" type="number" min="1" max="${r.pool.length}" value="${r.idx+1}" style="width:70px"> 题</label>
      <button class="btn btn-ghost" id="jumpBtn">跳转</button>
    </div>
    <div class="qnav">${r.pool.map((x,i)=>{
      const isFav=inFav(x.t,x.q),isD=inDoubt(x.t,x.q);
      const extra=[isFav?"qnav-fav":"",isD?"qnav-doubt":""].filter(Boolean).join(" ");
      let mk="";if(isFav)mk+='<span class="mk">★</span>';if(isD)mk+='<span class="mk">?</span>';
      return `<button class="qnav-btn ${extra} ${i===r.idx?"qnav-cur":""}" data-i="${i}">${i+1}${mk}</button>`;
    }).join("")}</div>
  </div>`;
  document.getElementById("favBtn").onclick=()=>{toggleFav(t,q);renderReviewCard();};
  const rDoubt=document.getElementById("doubtBtn");
  if(rDoubt)rDoubt.onclick=()=>{toggleDoubt(t,q);renderReviewCard();};
  document.getElementById("rQuit").onclick=()=>{state.review=null;saveProgress();renderReview();};
  const reveal=document.getElementById("revealBtn");
  if(reveal)reveal.onclick=()=>{r.hide=false;saveProgress();renderReviewCard();};

  if(prev)prev.onclick=()=>{if(r.idx>0){r.idx--;saveProgress();renderReviewCard();}};
  if(next)next.onclick=()=>{if(r.idx===r.pool.length-1){renderReviewCard();}else{r.idx++;saveProgress();renderReviewCard();}};

    const n=parseInt(document.getElementById("jumpNo").value);
    if(n>=1&&n<=r.pool.length){r.idx=n-1;saveProgress();renderReviewCard();}
  };
  document.querySelectorAll(".qnav-btn").forEach(b=>b.onclick=()=>{r.idx=parseInt(b.dataset.i);saveProgress();renderReviewCard();});

  if(eDoubt)eDoubt.onclick=()=>{toggleDoubt(t,q);renderExamCard();};
  document.querySelectorAll("#app .qnav-btn").forEach(b=>b.onclick=()=>{e.idx=parseInt(b.dataset.i);saveProgress();renderExamCard();});
  if(t==="qa")document.getElementById("qaText").oninput=ev=>{e.answers[qkey(t,q)+"_text"]=ev.target.value;saveProgress();};
  document.getElementById("ePrev").onclick=()=>{if(e.idx>0){e.idx--;saveProgress();renderExamCard();}};
  document.getElementById("eQuit").onclick=()=>{if(confirm("确定退出本次考试？作答进度将清除。")){state.exam=null;saveProgress();renderExamHome();}};
  const next=document.getElementById("eNext");
  if(next)next.onclick=()=>{
    if(t==="qa")e.answers[qkey(t,q)+"_text"]=document.getElementById("qaText").value;
    e.idx++;saveProgress();renderExamCard();
  };
  document.getElementById("eSubmit").onclick=()=>{
    if(t==="qa")e.answers[qkey(t,q)+"_text"]=document.getElementById("qaText").value;
    const u=unansweredCount(e);
    if(u>0&&!confirm("还有 "+u+" 题未作答，确定交卷吗？未作答的题目将按答错处理并计入错题本。"))return;
    submitExam();
  };
}
function unansweredCount(e){
  return e.paper.filter(({t,q})=>{
    if(t==="qa")return !(e.answers[qkey(t,q)+"_text"]||"").trim();
    return !(e.answers[qkey(t,q)]||[]).length;
  }).length;
}
function bindOptionsExam(t,q,sel){
  document.querySelectorAll("#opts .opt").forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.key;
      let cur=state.exam.answers[qkey(t,q)]||[];
      if(t==="multi"){cur.includes(k)?cur.splice(cur.indexOf(k),1):cur.push(k);}else{cur=[k];}
      state.exam.answers[qkey(t,q)]=cur;saveProgress();
      document.querySelectorAll("#opts .opt").forEach(x=>x.classList.toggle("sel",cur.includes(x.dataset.key)));
    };
  });
}
function submitExam(){
  const e=state.exam;
  let score=0,detail={single:{r:0,a:0},multi:{r:0,a:0},judge:{r:0,a:0},qa:{r:0,a:0}};
  const wrongList=[];
  e.paper.forEach(({t,q})=>{
    detail[t].a++;
    if(t==="qa"){
      const ansText=(e.answers[qkey(t,q)+"_text"]||"").trim();
      if(!ansText)recordResult(t,q,false); // 未作答的简答计入错题本
      return;
    }
    const sel=e.answers[qkey(t,q)]||[];
    const correct=isCorrect(t,q,sel);
    if(correct){score+=SCORE[t];detail[t].r++;}
    else{wrongList.push({t,q,sel});recordResult(t,q,false);}
    recordAnswer(t,correct,q);
  });
  state.exam.autoScore=score;
  state.exam.wrongList=wrongList;
  state.exam.detail=detail;
  state.exam.submitted=true;
  saveProgress();
  renderExamResult();
}
function renderExamResult(){
  const e=state.exam;
  const qaList=e.paper.filter(x=>x.t==="qa");
  const qaHtml=qaList.map(({t,q})=>{
    const ev=e.qaEval[qkey(t,q)];
    const ans=e.answers[qkey(t,q)+"_text"]||"";
    return `<div class="card" style="margin-bottom:10px">
      <div><span class="tag qa">简答 ${SCORE[t]} 分</span><span class="muted">题号 ${q.no}</span></div>
      <div class="stem">${escapeHtml(q.stem)}</div>
      <div class="explain"><b>我的作答：</b>${escapeHtml(ans)||"（未作答）"}</div>
      <div class="explain"><b>参考答案要点：</b>${escapeHtml(q.explain||"（原表未提供）")}</div>
      <div class="selfeval" data-q="${qkey(t,q)}">
        ${ev===undefined?`<button class="btn btn-green" data-v="1">答对 +${SCORE[t]}分</button><button class="btn btn-red" data-v="0">答错</button>`
          :`<span class="chip">${ev?`已计 ${SCORE[t]} 分`:"未得分"}</span>`}
      </div></div>`;
  }).join("");
  const obj=Object.keys(e.detail).map(t=>`${TYPE_NAME[t]} ${e.detail[t].r}/${e.detail[t].a}`).join("　");
  app.innerHTML=`
  <div class="card">
    <h3>考试结果</h3>
    <div class="score-big" id="finalScore">${e.autoScore} 分（客观题）</div>
    <p class="muted" style="text-align:center">${obj}</p>
    <div class="row" style="justify-content:center">
      <button class="btn btn-ghost" id="saveHist">保存本次成绩</button>
      <button class="btn btn-ghost" onclick="state.exam=null;saveProgress();renderExamHome()">返回</button>
    </div>
  </div>
  <h3 style="margin:14px 0 8px">简答自评（${qaList.length} 题）</h3>
  ${qaHtml}
  <h3 style="margin:14px 0 8px">客观题答错清单</h3>
  <div id="wrongBox"></div>`;
  document.querySelectorAll(".selfeval").forEach(box=>{
    const key=box.dataset.q;
    box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      e.qaEval[key]=b.dataset.v==="1";
      if(!e.qaEval[key])recordResultByKey(key,false);
      const [kt,kn]=key.split("#");const qq=DATA[kt].find(x=>x.no===parseInt(kn));
      recordAnswer("qa",e.qaEval[key],qq);
      saveProgress();renderExamResult();
    });
  });
  function refreshTotal(){
    let qa=0;Object.values(e.qaEval).forEach(v=>{if(v)qa+=SCORE.qa;});
    document.getElementById("finalScore").textContent=(e.autoScore+qa)+" 分";
  }
  refreshTotal();
  document.getElementById("saveHist").onclick=()=>{
    let qa=0;Object.values(e.qaEval).forEach(v=>{if(v)qa+=SCORE.qa;});
    const total=e.autoScore+qa;
    const hist=loadLS(LS_HIST,[]);
    hist.push({date:new Date().toLocaleString(),score:total,total:e.paper.length,obj:JSON.parse(JSON.stringify(e.detail))});
    saveLS(LS_HIST,hist);
    state.exam=null;saveProgress();
    alert("成绩已保存，可在成绩统计查看。");renderStats();
  };
  const wb=document.getElementById("wrongBox");
  wb.innerHTML=e.wrongList.length?e.wrongList.map(({t,q,sel})=>`
    <div class="card" style="margin-bottom:10px">
      <div><span class="tag ${t}">${TYPE_NAME[t]}</span><span class="muted">题号 ${q.no}</span></div>
      <div class="stem">${escapeHtml(q.stem)}</div>
      <div class="explain"><b>你的选择：</b>${sel.join("、")||"未作答"}　<b>正确答案：</b>${q.answer.join("、")}</div>
      ${q.explain?`<div class="explain"><b>解析：</b>${escapeHtml(q.explain)}</div>`:""}
    </div>`).join(""):`<div class="card muted">客观题全部答对，很棒！</div>`;
}
function recordResultByKey(key,correct){const [t,no]=key.split("#");recordResult(t,{no:parseInt(no)},correct);}

/* ---------- 错题本 ---------- */
function renderWrong(){
  const w=getWrong();
  let allPool=[];
  Object.keys(w).forEach(t=>{Object.keys(w[t]).forEach(noStr=>{const no=parseInt(noStr);const q=DATA[t].find(x=>x.no===no);if(q)allPool.push({t,q,info:w[t][noStr]});});});
  if(!allPool.length){app.innerHTML=`<div class="card muted">暂无错题，继续保持！</div>`;return;}
  const existTypes=Object.keys(DATA).filter(t=>allPool.some(x=>x.t===t));
  const wrongCount=t=>allPool.filter(x=>x.t===t).length;
  const sortPool=list=>{
    const mode=document.getElementById("wSort")?document.getElementById("wSort").value:"weak";
    const arr=list.slice();
    if(mode==="recent")arr.sort((a,b)=>b.info.t-a.info.t);
    else arr.sort((a,b)=>a.info.c-b.info.c||a.info.t-b.info.t);
    return arr;
  };
  const filterPool=()=>{
    const sel=selectedTypes("wtype");
    const wch=document.getElementById("wChapter")?document.getElementById("wChapter").value:"all";
    let f=sel==="all"?allPool:allPool.filter(x=>sel.includes(x.t));
    if(wch&&wch!=="all")f=f.filter(x=>(x.q.chapter||"other")===wch);
    return sortPool(f);
  };
  const rowsHtml=list=>list.map(x=>{const q=x.q;const hot=x.info.w>=2;const right=x.t==="judge"?(q.answer[0]==="T"?"√ 正确":"× 错误"):q.answer.join("、");return `<div class="card" style="margin-bottom:10px">
    <div><span class="tag ${x.t}">${TYPE_NAME[x.t]}</span><span class="muted">题号 ${q.no}</span>
    ${q.chapter&&CHAPTERS[q.chapter]?`<span class="chip" style="margin-left:6px;background:${CHAPTERS[q.chapter].bg};color:${CHAPTERS[q.chapter].color};border-color:transparent">${CHAPTERS[q.chapter].title}</span>`:""}
    <span class="chip" style="margin-left:6px">已连续答对 ${x.info.c}/${WRONG_PASS} 次</span>
    ${hot?'<span class="chip" style="margin-left:6px;border-color:var(--red);color:var(--red);background:#FCEEEE">高频易错</span>':""}</div>
    <div class="stem">${escapeHtml(q.stem)}</div>
    <div class="explain"><b>正确答案：</b>${right||"（见参考答案要点）"}</div>
    ${q.explain?`<div class="explain"><b>解析：</b>${escapeHtml(q.explain)}</div>`:""}</div>`;}).join("");
  app.innerHTML=`
  <div class="card">
    <div class="muted" id="wCount"></div>
    <div class="type-grid">
      <div class="type-card sel" data-val="all">
        <input type="checkbox" class="wtype" value="all" checked>
        <div class="type-icon" style="background:#F0F2F7;color:#1F2733">✦</div>
        <div class="t-title">全部错题</div>
        <div class="t-desc">四类错题综合重练</div>
        <div class="type-foot"><span class="cnt">${allPool.length} 题</span><span class="st">待重练</span></div>
      </div>
      ${existTypes.map(t=>{const m=TYPE_META[t];return `<div class="type-card" data-val="${t}">
        <input type="checkbox" class="wtype" value="${t}">
        <div class="type-icon" style="background:${m.bg};color:${m.color}">${m.icon}</div>
        <div class="t-title">${m.title}</div>
        <div class="t-desc">${m.desc}</div>
        <div class="type-foot"><span class="cnt">${wrongCount(t)} 题</span><span class="st">待重练</span></div>
      </div>`;}).join("")}
    </div>
    <div class="row">
      <label>排序：<select id="wSort">
        <option value="weak">最薄弱优先</option>
        <option value="recent">最近练习优先</option>
      </select></label>
      <label>章节：<select id="wChapter"></select></label>
      <label>抽题量：<input id="wLimit" type="number" min="0" max="320" value="0" style="width:70px"> <span class="muted">0=全部</span></label>
    </div>
    <div class="row"><button class="btn btn-primary" id="wStart">开始重练</button>
    <button class="btn btn-ghost" id="wClear">清空错题本</button></div>
  </div>
  <div id="wRows"></div>`;
  const boxes=[...document.querySelectorAll(".wtype")];
  const allBox=boxes.find(b=>b.value==="all");
  const wChapter=document.getElementById("wChapter");
  const fillWChapter=()=>{
    const sel=selectedTypes("wtype");
    const sub=sel==="all"?allPool:allPool.filter(x=>sel.includes(x.t));
    const counts={};sub.forEach(x=>{const ch=x.q.chapter||"other";counts[ch]=(counts[ch]||0)+1;});
    const opts=[`<option value="all">全部章节（${sub.length}）</option>`];
    Object.entries(CHAPTERS).forEach(([ch,c])=>{if(counts[ch])opts.push(`<option value="${ch}">${c.title}（${counts[ch]}）</option>`);});
    wChapter.innerHTML=opts.join("");
    if(!counts[wChapter.value])wChapter.value="all";
  };
  const refresh=()=>{const f=filterPool();document.getElementById("wCount").textContent=`共 ${f.length} 道错题；需连续答对 ${WRONG_PASS} 次后才会自动移出错题本，答错则重新计数。`;document.getElementById("wRows").innerHTML=rowsHtml(f);};
  const wRefresh=()=>{document.querySelectorAll(".type-card").forEach(c=>{const b=boxes.find(x=>x.value===c.dataset.val);c.classList.toggle("sel",!!(b&&b.checked));});};
  boxes.forEach(b=>b.onchange=()=>{
    if(b===allBox&&b.checked){boxes.forEach(x=>{if(x!==allBox)x.checked=false;});}
    else if(b!==allBox&&b.checked){allBox.checked=false;}
    wRefresh();fillWChapter();refresh();
  });
  document.getElementById("wSort").onchange=refresh;
  wChapter.onchange=refresh;
  fillWChapter();
  refresh();
  const launchWrong=()=>{
    let f=filterPool();
    if(!f.length){alert("没有匹配的错题");return;}
    const n=parseInt(document.getElementById("wLimit").value)||0;
    if(n>0)f=shuffle(f).slice(0,n);
    state.wrongPractice={pool:f.map(({t,q})=>({t,q})),idx:0,answers:{},results:{}};
    saveProgress();renderPracticeCard("wrong");
  };
  document.getElementById("wStart").onclick=launchWrong;
  document.querySelectorAll(".type-card").forEach(c=>{
    const b=boxes.find(x=>x.value===c.dataset.val);
    c.onclick=()=>b.click();
    // 双击某个题型：只选该题型并直接开始重练
    c.ondblclick=()=>{
      boxes.forEach(x=>x.checked=false);
      b.checked=true;wRefresh();launchWrong();
    };
  });
  document.getElementById("wClear").onclick=()=>{if(confirm("确定清空全部错题？")){setWrong({single:{},multi:{},judge:{},qa:{}});saveProgress();renderWrong();}};
}

/* ---------- 成绩统计 ---------- */
function renderStats(){
  const hist=loadLS(LS_HIST,[]);
  const w=getWrong();
  const wCount=Object.values(w).reduce((a,b)=>a+Object.keys(b).length,0);
  const avg=hist.length?(hist.reduce((a,h)=>a+h.score,0)/hist.length).toFixed(1):"—";
  const rec=getRecord();
  const ds=dailySummary();
  const todayAcc=ds.today.total?Math.round(ds.today.right/ds.today.total*100):null;
  const daysRows=ds.days.map(k=>{const v=ds.all[k];const a=v.total?Math.round(v.right/v.total*100):0;return `<tr><td>${k}</td><td>${v.total}</td><td>${v.right}</td><td>${a}%</td></tr>`;}).join("");
  const bars=Object.keys(DATA).map(t=>{
    const r=rec[t];const pct=r.total?Math.round(r.right/r.total*100):null;
    const width=pct==null?0:pct;
    return `<div class="bar-row">
      <div class="bar-label">${TYPE_NAME[t]}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
      <div class="bar-val">${pct==null?"无记录":pct+"%（"+r.right+"/"+r.total+"）"}</div>
      <button class="btn btn-ghost" data-clear="${t}" style="padding:4px 10px;font-size:12px">清除</button>
    </div>`;}).join("");
  const chBars=Object.entries(CHAPTERS).map(([ch,c])=>{
    const r=rec.chapters[ch];const pct=r.total?Math.round(r.right/r.total*100):null;
    const width=pct==null?0:pct;
    return `<div class="bar-row">
      <div class="bar-label ch">${c.title}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${width}%;background:${c.color}"></div></div>
      <div class="bar-val">${pct==null?"无记录":pct+"%（"+r.right+"/"+r.total+"）"}</div>
    </div>`;}).join("");
  const weakCh=Object.entries(rec.chapters).filter(([,r])=>r.total>0).sort((a,b)=>a[1].right/a[1].total-b[1].right/b[1].total)[0];
  const weakChText=weakCh?`${CHAPTERS[weakCh[0]].title}（${Math.round(weakCh[1].right/weakCh[1].total*100)}%）`:"暂无数据";
  const trend=hist.slice(-10);
  let trendSvg="";
  if(trend.length>=2){
    const W=560,H=120,pad=10;
    const max=100;const pts=trend.map((h,i)=>{const x=pad+(W-2*pad)*(i/(trend.length-1));const y=H-pad-(H-2*pad)*(h.score/max);return [x,y];});
    const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    trendSvg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px;margin-top:10px">
      ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--blue)"/>`).join("")}
      <path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2"/>
    </svg>`;
  }
  app.innerHTML=`
  <div class="stat-grid">
    <div class="stat"><div class="num">${hist.length}</div><div class="muted">考试次数</div></div>
    <div class="stat"><div class="num">${avg}</div><div class="muted">平均分</div></div>
    <div class="stat"><div class="num">${hist.length?Math.max(...hist.map(h=>h.score)):"—"}</div><div class="muted">最高分</div></div>
    <div class="stat"><div class="num">${wCount}</div><div class="muted">当前错题</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3 style="margin:0 0 10px">今日学习</h3>
    <div class="stat-grid">
      <div class="stat"><div class="num">${ds.today.total}</div><div class="muted">今日做题</div></div>
      <div class="stat"><div class="num">${todayAcc==null?"—":todayAcc+"%"}</div><div class="muted">今日正确率</div></div>
    </div>
    ${daysRows?`<table style="margin-top:10px"><thead><tr><th>日期</th><th>题量</th><th>答对</th><th>正确率</th></tr></thead><tbody>${daysRows}</tbody></table>`:""}
  </div>
  <div class="card" style="margin-top:14px">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h3 style="margin:0">各题型正确率</h3>
      <button class="btn btn-ghost" id="clearAllRec" style="padding:4px 10px;font-size:12px">清空全部正确率</button>
    </div>${bars}
    ${trend.length>=2?`<h3 style="margin-top:16px">最近成绩趋势</h3>${trendSvg}`:""}
  </div>
  <div class="card" style="margin-top:14px">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h3 style="margin:0">章节掌握度</h3>
      <span class="muted">最薄弱章节：<b>${weakChText}</b></span>
    </div>${chBars}
  </div>
  <div class="card">
    <div class="row">
      <button class="btn btn-ghost" id="expBtn">导出备份（错题/成绩/记录/收藏/存疑）</button>
      <button class="btn btn-ghost" id="impBtn">导入备份</button>
      <button class="btn btn-ghost" id="bankBtn">导出题库对照表(CSV)</button>
      <input type="file" id="impFile" accept="application/json" class="hidden">
    </div>
  </div>
  <div class="card">
    ${hist.length?`<table><thead><tr><th>时间</th><th>得分</th><th>题数</th><th>题型答对情况</th></tr></thead><tbody>
      ${hist.slice().reverse().map(h=>`<tr><td>${h.date}</td><td><b>${h.score}</b></td><td>${h.total}</td><td class="muted">${Object.keys(h.obj).map(t=>`${TYPE_NAME[t]} ${h.obj[t].r}/${h.obj[t].a}`).join("，")}</td></tr>`).join("")}
    </tbody></table>`:`<div class="muted">暂无考试记录，先去完成一次模拟考试吧。</div>`}
  </div>`;
  document.getElementById("expBtn").onclick=exportBackup;
  document.getElementById("bankBtn").onclick=exportBank;
  const impFile=document.getElementById("impFile");
  document.getElementById("impBtn").onclick=()=>impFile.click();
  impFile.onchange=()=>{if(impFile.files[0])importBackup(impFile.files[0]);};
  document.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{
    const r=getRecord();r[b.dataset.clear]={total:0,right:0};saveLS(LS_RECORD,r);renderStats();
  });
  document.getElementById("clearAllRec").onclick=()=>{
    if(confirm("确定清空全部题型的正确率记录？（不影响错题本、收藏与考试成绩）")){
      const ch={};Object.keys(CHAPTERS).forEach(k=>ch[k]={total:0,right:0});
      saveLS(LS_RECORD,{single:{total:0,right:0},multi:{total:0,right:0},judge:{total:0,right:0},qa:{total:0,right:0},chapters:ch});
      renderStats();
    }
  };
}
function exportBackup(){
  const data={wrong:getWrong(),hist:loadLS(LS_HIST,[]),record:getRecord(),fav:getFav(),doubt:getDoubt(),exportedAt:new Date().toLocaleString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="刷题备份.json";a.click();URL.revokeObjectURL(a.href);
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{try{
    const d=JSON.parse(reader.result);
    if(d.wrong)setWrong(d.wrong);
    if(d.hist)saveLS(LS_HIST,d.hist);
    if(d.record)saveLS(LS_RECORD,d.record);
    if(d.fav)saveLS(LS_FAV,d.fav);
    if(d.doubt)saveLS(LS_DOUBT,d.doubt);
    alert("导入成功");renderStats();
  }catch(e){alert("文件格式不正确，导入失败");}};
  reader.readAsText(file);
}
function exportBank(){
  const rows=[["题型","题号","题干","选项","答案","解析"]];
  Object.keys(DATA).forEach(t=>DATA[t].forEach(q=>{
    const opts=q.options.map(o=>o.key+". "+o.text).join(" | ");
    rows.push([TYPE_NAME[t],q.no,q.stem,opts,q.answer.join(","),q.explain||""]);
  }));
  const csv=rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="铣削刀具题库对照表.csv";a.click();URL.revokeObjectURL(a.href);
}

/* ---------- 键盘快捷键 ---------- */
document.addEventListener("keydown",e=>{
  const ae=document.activeElement;
  if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT"))return;
  const k=e.key.toLowerCase();
  if(state.view==="practice"||state.view==="wrong"||state.view==="fav")practiceKeys(k,e);
  else if(state.view==="review")reviewKeys(k,e);
  else if(state.view==="exam")examKeys(k,e);
});
function currentPractice(){
  const ctx=state.view==="wrong"?"wrong":state.view==="fav"?"fav":"practice";
  return {ctx,p:state[practiceStateName(ctx)]};
}
function clickOpt(key){const el=document.querySelector(`#opts .opt[data-key="${key}"]`);if(el)el.click();}
function practiceKeys(k,e){
  const {ctx,p}=currentPractice();if(!p)return;
  if(["a","b","c","d"].includes(k)){clickOpt(k.toUpperCase());e.preventDefault();return;}
  if(k==="1"){clickOpt("T");e.preventDefault();return;}
  if(k==="2"){clickOpt("F");e.preventDefault();return;}
  if(k==="arrowleft"){
    const prev=document.getElementById("pPrev");
    if(prev){prev.click();}
    else if(p.idx>0){p.idx--;saveProgress();renderPracticeCard(ctx);}
    e.preventDefault();return;
  }
  if(k==="arrowright"){
    const n=document.getElementById("pNext");
    if(n){n.click();}
    else if(p.idx<p.pool.length-1){p.idx++;saveProgress();renderPracticeCard(ctx);}
    e.preventDefault();return;
  }
  if(k==="enter"){const chk=document.getElementById("pCheck");if(chk)chk.click();else{const n=document.getElementById("pNext");if(n)n.click();}e.preventDefault();}
}
function reviewKeys(k,e){
  if(k==="arrowleft"){const p=document.getElementById("rPrev");if(p)p.click();e.preventDefault();return;}
  if(k==="arrowright"){const n=document.getElementById("rNext");if(n)n.click();e.preventDefault();return;}
  if(k==="enter"){const rv=document.getElementById("revealBtn");if(rv)rv.click();else{const n=document.getElementById("rNext");if(n)n.click();}e.preventDefault();}
}
function examKeys(k,e){
  if(["a","b","c","d"].includes(k)){clickOpt(k.toUpperCase());e.preventDefault();return;}
  if(k==="1"){clickOpt("T");e.preventDefault();return;}
  if(k==="2"){clickOpt("F");e.preventDefault();return;}
  if(k==="arrowleft"){const p=document.getElementById("ePrev");if(p)p.click();e.preventDefault();return;}
  if(k==="arrowright"){const n=document.getElementById("eNext");if(n)n.click();e.preventDefault();return;}
}

function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

applySettings();
loadProgress();
setupSwipe();
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
