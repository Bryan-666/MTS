<style>

  nav{display:flex;gap:8px;flex-wrap:wrap;}
  nav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--sub);}
  nav button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
  .muted{color:var(--sub);font-size:13px;}
  .btn{border:none;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--txt);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .opts{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .opt{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;}
  .opt:hover{border-color:var(--blue);}
  .opt.sel{border-color:var(--blue);background:#EEF3FF;}
  .opt.correct{border-color:var(--green);background:#EAF7EF;}
  .opt.wrong{border-color:var(--red);background:#FCEEEE;}
  .opt .key{font-weight:bold;min-width:22px;}
  .tag{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;margin-right:6px;}
  .tag.single{background:#EEF3FF;color:var(--blue);}
  .tag.multi{background:#F3EEFF;color:#7C3AED;}
  .tag.judge{background:#EAF7EF;color:var(--green);}
  .tag.qa{background:#FFF4E5;color:var(--amber);}
  .stem{font-size:16px;margin-top:8px;}
  .qa-box{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;font-family:inherit;margin-top:12px;resize:vertical;}
  .feedback{margin-top:14px;border-radius:10px;padding:12px 14px;display:none;}
  .feedback.ok{background:#EAF7EF;border:1px solid var(--green);}
  .feedback.no{background:#FCEEEE;border:1px solid var(--red);}
  .explain{margin-top:8px;font-size:14px;color:var(--txt);}
  .explain b{color:var(--blue);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;}
  .progress{height:8px;background:#ECEFF4;border-radius:6px;overflow:hidden;margin:10px 0;}
  .progress>i{display:block;height:100%;background:var(--blue);width:0;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .stat{background:var(--bg);border-radius:12px;padding:16px;text-align:center;}
  .stat .num{font-size:26px;font-weight:bold;color:var(--blue);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;}
  th{color:var(--sub);font-weight:600;}
  .hidden{display:none;}
  .chip{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:3px 10px;}
  .score-big{font-size:40px;font-weight:bold;text-align:center;margin:10px 0;}
  .selfeval{display:flex;gap:10px;margin-top:10px;}
  .opt.disabled{pointer-events:none;}
  .qnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;max-height:128px;overflow-y:auto;}
  .qnav-btn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;color:var(--txt);}
  .qnav-btn.qnav-cur{border-color:var(--blue);background:#EEF3FF;font-weight:bold;}
  .qnav-btn.qnav-done{border-color:var(--amber);color:var(--amber);}
  .qnav-btn.qnav-ok{background:#EAF7EF;border-color:var(--green);color:var(--green);}
  .qnav-btn.qnav-no{background:#FCEEEE;border-color:var(--red);color:var(--red);}
  @media(max-width:600px){.wrap{padding:10px;}header h1{font-size:17px;}}
</style>
</head>

options": [{"key": "T", "text": "正确（√）"}, {"key": "F", "text": "错误（×）"}], "answer": ["T"], "explain": ""}, {"no": 48, "stem": "批量生产中刀具寿命到期强制更换，是稳定尺寸的重要手段。（　）", "options": [{"key": "T", "text": "正确（√）"}, {"key": "F", "text": "错误（×）"}], "answer": ["T"], "explain": ""}, {"no": 49, "stem": "试切出现异常声音时，可以加大进给把噪声压住继续加工。（　）", "options": [{"key": "T", "text": "正确（√）"}, {"key": "F", "text": "错误（×）"}], "answer": ["F"], "explain": "必须停机调整"}, {"no": 50, "stem": "崩刃后应先停机保全现场，再分析原因。（　）", "options": [{"key": "T", "text": "正确（√）"}, {"key": "F", "text": "错误（×）"}], "answer": ["T"], "explain": ""}], "qa": [{"no": 1, "stem": "客户在电话里说：\"我要铣一批不锈钢零件，你们有什么推荐？\"请列出你至少应该追问的五个信息，并说明每个信息为什么重要。", "options": [], "answer": [], "explain": "至少追问：①具体牌号与状态（304/316/沉淀硬化，决定 M 组内档位与参数）；②加工部位与特征（侧壁/槽/型腔/孔，决定刀型）；③粗加工还是精加工（决定几何与刃数）；④机床最高转速、功率与是否带内冷（决定参数可行域与刀具配置）；⑤批量与节拍（决定推荐\"效率优先\"还是\"稳定优先\"）。这些信息不齐，任何推荐都是猜。"}, {"no": 2, "stem": "客户问：\"我们用普通硬质合金铣刀铣高硅铝合金，一天换三把刀，你们有什么办法？\"请给出原因分析、推荐方案（刀具材料方向）与预期效果说明。", "options": [], "answer": [], "explain": "原因：高硅铝合金中的硅相硬度极高，对普通硬质合金是剧烈的磨粒磨损，属于\"材料与刀具材料不匹配\"，调参数解决不了。方案：改用 PCD（聚晶金刚石）铣刀，寿命通常可提升一个数量级以上；同时说明 PCD 加工铝合金表面质量好、适合批量；提醒金刚石类刀具不能碰钢件。"}, {"no": 3, "stem": "简述 ISO 513 七组划分的逻辑，每组各举一种典型材料，并说明为什么销售必须先弄清客户的材料组别。", "options": [], "answer": [], "explain": "七组按切削行为分类：P 钢（45 钢）、M 不锈钢（304）、K 铸铁（HT200）、N 有色金属（6061）、S 耐热合金（TC4）、H 淬硬钢（HRC50+）、O 非金属/特种（石墨）。组别决定了刀具材料、涂层、几何与参数的整个方向；跨组套用方案容易出质量事故与投诉。先定组，推荐才有依据。"}, {"no": 4, "stem": "客户发来零件图：材料 HRC 55 淬硬模具钢，要求精铣型腔、表面光洁。请给出刀具推荐方向（材料/涂层/几何），以及必须向客户交代的关键约束。", "options": [], "answer": [], "explain": "推荐：超细晶硬质合金 65°/68° 系列或 CBN；涂层 AlTiN/TiSiN 类；负前角、刃口强化；球头刀或小圆鼻刀精铣。关键约束：径向切宽 ae ≤0.02D（防冲击崩刃）、小切深多刀、机床要求高转速与好刚性、装夹跳动 ≤0.02 mm；提醒客户淬硬钢\"怕撞不怕磨\"，参数宁稳勿激。"}, {"no": 5, "stem": "客户是模具厂：P20 模块要开深 60 mm 型腔，底部 R2.5 清角，侧壁要求光洁。请按\"开粗 → 二次开粗/清角 → 侧壁精铣\"给出刀具推荐（类型/直径/涂层）与必须交代的关键约束。", "options": [], "answer": [], "explain": "开粗：D16/D12 圆鼻刀（R1.5 左右），AlCrN 涂层，螺旋下刀 + 由内向外环切，分层 ap≤0.25D、步距 ≤0.5D，留 0.3 余量；清角：刀径 ≤底角 R2.5，按底角 R 选球刀/小圆鼻；侧壁精铣：D12 四刃立铣 ae ≤0.1D 一刀走完，vc≈80（P20 粗铣基准，精铣适当上调）。关键约束：镜面/高光要求 VB≥0.03 强制换刀；悬伸 ≤3D（深 60 需长颈刀）；分层每层一致。"}, {"no": 6, "stem": "客户抱怨：\"弹簧夹头夹 D6 刀铣钢件，跳动大、老崩刀。\"请分析可能原因并给出改善建议（夹头选择、夹持长度、跳动测量、备选刀柄）。", "options": [], "answer": [], "explain": "可能原因：夹头磨损/异物、夹持长度不足（D6 细刀只夹刀尖）、跳动超标使单齿过载、悬伸过长。建议：换高精度 AA 级新夹头，夹持长度 ≥3 倍柄径，装后实测跳动 ≤0.02，必要时上液压刀柄（减振、跳动小）；同时核对切削参数与悬伸。"}, {"no": 7, "stem": "比较热缩刀柄与液压刀柄的差异与适用场景，并说明什么情况下你会向客户推荐热缩刀柄。", "options": [], "answer": [], "explain": "热缩：感应加热膨胀后冷却抱紧，跳动 ≤0.003、刚性最高、外形细不干涉，适合高速高精与深腔清角；需设备、换刀慢。液压：油腔膨胀包络，跳动小、减振好、换刀快，适合精加工与异形柄，价格高。推荐热缩的时机：客户做模具精加工/高速铣/深腔清角，对跳动与刚性敏感、且能接受一次性投入加热设备。"}, {"no": 8, "stem": "客户要在一批铝件上加工 M5、M6、M8 三种螺纹孔各 200 个（通孔）。请给出螺纹加工方案建议（螺纹铣与丝锥的选择）、理由与注意事项（底孔、切削液、防粘铝）。", "options": [], "answer": [], "explain": "三种规格共 600 孔、通孔：推荐螺纹铣刀一把覆盖 M5/M6/M8（孔径由插补半径控制），崩刃可补刀不报废整孔，铝件排屑好；若客户已有刚性攻丝基础且追求单孔效率，可配螺旋槽丝锥攻 M5/M6 小孔、螺纹铣做 M8。注意事项：底孔直径按螺纹铣工艺留足（牙型高成形靠插补）、用含润滑性的非含氯切削液防粘铝、圆弧切入切出、孔口倒角去毛刺。"}, {"no": 9, "stem": "客户问：\"D16 四刃刀铣 45 钢，转速和进给给多少？\"（按 vc≈150 m/min、fz≈0.08 mm/z，π 取 3.14）请算出 n 与 vf，并向客户说明这两个数应如何验证。", "options": [], "answer": [], "explain": "n = 1000×150/(3.14×16) ≈ 2986 r/min；vf = 0.08×4×2986 ≈ 956 mm/min。说明：这是典型工况的起点，上机先按 80% 进给/85% 转速试切，确认声音、切屑、表面、排屑、刀具状态五项正常后逐级 +10% 提升到该值；异常先回退排查再继续。"}, {"no": 10, "stem": "客户机床只有 6000 r/min，但工艺卡要求 8000 r/min。你如何向客户解释并提出建议？", "options": [], "answer": [], "explain": "解释：转速需求来自 vc 与直径，主轴到不了不能超速（动平衡与安全风险）。建议三条路：①按 6000 运行，实际 vc = π×D×6000/1000，核对是否仍在材料合理区间，可接受就用；②减小刀具直径降低 vc 需求；③核对材料组别看是否本就给了偏高起点。绝不能让客户超速。"}, {"no": 11, "stem": "客户抱怨\"按你们给的参数铣不动，机床闷车\"。请写出你的信息收集清单与调整建议方向。", "options": [], "answer": [], "explain": "收集：材料与硬度、刀具直径与刃数、当前 n/vf/ap/ae、机床功率与主轴状态、装夹与悬伸、排屑与冷却。调整方向：先校核功率（Pc 与额定 80% 红线对比），降 ap 或 ae 减负荷；查装夹松动、悬伸；查排屑堵塞；降低档位后按试切流程重新起步。"}, {"no": 12, "stem": "请用向客户讲解的口吻，说明\"参数表上的数字是起点不是定值\"以及试切验证流程（−20% 进给、−15% 转速 → 五看 → 逐级 +10%）。", "options": [], "answer": [], "explain": "讲解口径：参数表是\"典型机床、典型工况\"下的经验中值，你的机床刚性、装夹、材料批次都有差异；所以先降档试——进给打 8 折、转速打 8.5 折，看声音（无尖啸）、切屑（颜色形态正常）、表面（无振纹）、排屑（通畅）、刀具（无异常温升）五项；都正常做 2–3 件再每次加 10% 提到推荐值。这样几分钟的试切换来的是批量不出废品、刀具不崩。"}, {"no": 13, "stem": "客户发来零件：45 钢块 100×80×40，要铣 60×40、深 25 的型腔，底角 R3，侧壁 Ra1.6。请按工序给出刀具与方式推荐（开粗/清角/侧壁精铣/底面），并说明关键参数锚点。", "options": [], "answer": [], "explain": "开粗：D16/D12 圆鼻刀（R1.5），螺旋下刀 + 由内向外环切，分层 ap=3（≤0.25D）、步距 ≤0.5D、vc 110–130、留 0.3 余量；清角：R3 底角配 ≤R3 刀具清拐角，留均匀 0.15；侧壁精铣：D12 四刃顺铣 ae ≤0.1D 一刀走完（vc 140–160）；底面：圆鼻/平底小 ap 行切。锚点：分层 ≤0.25D、步距 ≤0.5D、ae ≤0.1D。"}, {"no": 14, "stem": "客户机床 11 kW、8000 r/min，要开钛合金深槽。请给出加工方式的选择逻辑（摆线与插铣怎么选）、参数锚点与冷却要求。", "options": [], "answer": [], "explain": "方式选择：机床功率尚可（11 kW）优先摆线铣开槽（大切深小切宽、接触弧短散热快）；若排屑极差或槽更深则插铣开粗后精修。锚点：TC4 vc≈50、ae ≤0.2D、摆线切宽 0.05–0.15D；冷却：高压内冷（4–8 MPa）必需，压力与指向要保证，不是多浇就行；屑防火。"}, {"no": 15, "stem": "客户问：\"为什么你们推荐插铣，同行推荐满槽？\"请从切削力方向、排屑、机床刚性、侧壁质量四方面比较两者，并给出选择建议。", "options": [], "answer": [], "explain": "比较插铣与满槽：切削力方向——插铣力沿主轴轴向（机床最刚性方向），满槽径向力大；排屑——插铣半封闭但可大流量内冷冲屑，满槽两侧切削容屑减半最易堵；机床刚性——插铣适合小机床与长悬伸，满槽要求好刚性；侧壁质量——插铣差需精铣，满槽侧壁由侧刃成形较好但易振纹。建议：深腔、排屑难、机床刚性一般选插铣（后配侧壁精修）；浅槽、机床好、追求效率可用满槽（降 50% 进给）。"}, {"no": 16, "stem": "客户要加工壁厚 2 mm 的薄壁铝框，担心变形。请从装夹、刀具、参数、走刀顺序四个方面给出一套建议。", "options": [], "answer": [], "explain": "装夹：真空吸盘或多点柔性支撑、压紧点正对支撑、精加工前松开重夹轻压；刀具：锋利大螺旋铝用刀；参数：高转速小 fz、小切宽层铣（ae 小）、ap 分层一致；顺序：粗精分开、对称去除、双面交替、粗后释放应力再精铣；全程充分冷却控温。"}, {"no": 17, "stem": "客户投诉：\"你们这刀不行，铣 304 全是毛刺还崩了两次。\"请写出你的处理步骤：收集哪些信息、如何初判、何时引入工艺支持、如何给出改善方案。", "options": [], "answer": [], "explain": "步骤：①先止损——请客户停机、隔离已加工可疑品、保留崩刃刀具与切屑（拍照）；②收集——材料牌号与批次硬度、机床与刀柄、悬伸、参数（n/vf/ap/ae）、崩口位置与形态（端刃外角=冲击，侧刃剥落=排屑/磨损）、切削液；③初判——按\"冲击/参数/装夹/排屑\"四源头对照，粘刀+毛刺指向积屑瘤（速度落在 10–50 区、刃口钝、润滑不足）；④引入工艺支持——把完整工况反馈给技术同事复核参数与刀具方案；⑤给方案——换锋利大后角含铝韧性涂层刀具、vc 提到 90–110 或配高压内冷、含硫极压液、切深跨硬化层进给不停顿，并要求按试切流程重新验证，不做无依据的赔偿承诺。"}, {"no": 18, "stem": "客户问：\"我们首件总是合格，批量做着做着就超差了。\"请列出至少五个可能原因与对应的排查动作。", "options": [], "answer": [], "explain": "可能原因与排查：①刀具渐进磨损——记录换刀间隔，VB 测量，按寿命强制换；②装夹位移/松动——检查压板扭矩与定位面；③积屑瘤时大时小——查速度区间与切削液浓度；④排屑渐堵、二次切削——清屑、查内冷过滤；⑤材料批次硬度漂移——抽测硬度、按修正降速；⑥参数漂移或程序被改——锁定参数与首件对比。"}, {"no": 19, "stem": "请用向新客户讲解的口吻，说明\"为什么必须试切，不能直接按推荐参数批量生产\"，并给出说辞与流程。", "options": [], "answer": [], "explain": "说辞：参数表是典型工况的中值，贵司机床刚性、装夹、材料批次与我们试验条件有差异；直接满参数等于把试错成本压到批量上。流程：首件进给 −20%、转速 −15% → 看声音、切屑、表面、排屑、刀具五项 → 正常做 2–3 件（VB<0.15）→ 每次加 10% 提到推荐值；任何一步异常先回退再排查。几分钟试切换批量稳定。"}, {"no": 20, "stem": "客户第一次采购，请你教他\"怎么验收刀具、怎么管理刀具寿命\"。请给出验收要点与寿命管理制度（VB、件数、声音三类判据 + 记录表要素）。", "options": [], "answer": [], "explain": "验收：核对型号规格与包装标识、测径向跳动 ≤0.02（精铣）、外观无磕碰、涂层完好、记录批次。寿命管理：①VB 判据——常规精铣 0.3 mm、一般精件 0.15、镜面 0.03，达阈值强制换；②件数/时长判据——按计划件数或机时到期换，不等崩；③声音判据——尖啸、闷响、功率突升立即停机检查。记录表要素：日期、机床、材料批次、刀具型号、参数、加工件数、VB 或失效模式、处理结果；每月汇总对比，作为选型与议价依据。"}]};
const TYPE_NAME = {single:"单项选择", multi:"多项选择", judge:"判断题", qa:"问答题"};
const EXAM_PLAN = {single:15, multi:20, judge:10, qa:4};
const SCORE = {single:2, multi:2, judge:1, qa:5};
const LS_WRONG="quiz_wrong_v1", LS_HIST="quiz_history_v1";

let state = {view:"practice"};

function loadLS(k, def){try{return JSON.parse(localStorage.getItem(k))||def;}catch(e){return def;}}
function saveLS(k,v){localStorage.setItem(k,JSON.stringify(v));}
function getWrong(){return loadLS(LS_WRONG,{single:[],multi:[],judge:[],qa:[]});}
function setWrong(w){saveLS(LS_WRONG,w);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function qkey(t,q){return t+"#"+q.no;}
function inWrong(t,q){const w=getWrong();return (w[t]||[]).includes(q.no);}
function toggleWrong(t,q,add){const w=getWrong();if(!w[t])w[t]=[];if(add){if(!w[t].includes(q.no))w[t].push(q.no);}else{w[t]=w[t].filter(n=>n!==q.no);}setWrong(w);}

const app=document.getElementById("app");
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  state.view=b.dataset.view; render();
});

function render(){
  if(state.view==="practice"){ state.practice?renderPracticeCard():renderPractice(); }
  else if(state.view==="review"){ state.review?renderReviewCard():renderReview(); }
  else if(state.view==="exam"){ (state.exam&&!state.exam.submitted)?renderExamCard():renderExamHome(); }
  else if(state.view==="wrong") renderWrong();
  else if(state.view==="stats") renderStats();
}

/* ---------- 刷题练习 ---------- */
function backToPracticeHome(){state.practice=null;renderPractice();}
function renderPractice(){
  const types=Object.keys(DATA);
  app.innerHTML=`
  <div class="card">
    <div class="muted">选择题型与顺序，逐题作答，即时显示对错与解析；答错自动加入错题本。</div>
    <div class="row">
      <label>题型：
        <select id="pType">
          <option value="all">全部</option>
          ${types.map(t=>`<option value="${t}">${TYPE_NAME[t]}（${DATA[t].length}）</option>`).join("")}
        </select>
      </label>
      <label>顺序：
        <select id="pOrder">
          <option value="seq">顺序</option>
          <option value="random">随机</option>
        </select>
      </label>
      <button class="btn btn-primary" id="pStart">开始练习</button>
    </div>
  </div>`;
  document.getElementById("pStart").onclick=()=>{
    const type=document.getElementById("pType").value;
    const order=document.getElementById("pOrder").value;
    let pool=[];
    (type==="all"?types:[type]).forEach(t=>{DATA[t].forEach(q=>pool.push({t,q}));});
    if(order==="random")pool=shuffle(pool);
    state.practice={pool,idx:0,answers:{},results:{}};
    renderPracticeCard();
  };
}

function renderPracticeCard(){
  const p=state.practice;
  if(!p||p.idx>=p.pool.length){
    app.innerHTML=`<div class="card"><h3>练习完成</h3><p class="muted">共 ${p?p.pool.length:0} 题。可在错题本回顾答错题目。</p>
      <div class="row"><button class="btn btn-ghost" onclick="backToPracticeHome()">返回练习</button></div></div>`;
    return;
  }
  const {t,q}=p.pool[p.idx];
  const key=qkey(t,q);
  const sel=(p.answers[key]||[]).slice();
  const done=!!p.results[key];
  const qaText=p.answers[key+"_text"]||"";
  app.innerHTML=`
  <div class="card">
    <div class="muted">第 ${p.idx+1} / ${p.pool.length} 题</div>
    <div class="progress"><i style="width:${(p.idx)/p.pool.length*100}%"></i></div>
    <div><span class="tag ${t}">${TYPE_NAME[t]}</span><span class="muted">题号 ${q.no}</span></div>
    <div class="stem">${escapeHtml(q.stem)}</div>
    <div class="opts" id="opts">${renderOptions(t,q,sel,done)}</div>
    ${t==="qa"?`<textarea class="qa-box" id="qaText" ${done?"disabled":""} placeholder="在此输入你的作答（可对照下方参考答案要点自评）">${escapeHtml(qaText)}</textarea>`:""}
    <div class="feedback" id="fb"></div>
    <div class="row">
      ${!done?`<button class="btn btn-primary" id="pCheck">提交答案</button>`:`<button class="btn btn-ghost" id="pPrev">上一题</button><button class="btn btn-primary" id="pNext">${p.idx===p.pool.length-1?"完成":"下一题"}</button>`}
      <button class="btn btn-ghost" id="pQuit">退出练习</button>
    </div>
    <div class="row">
      <label class="muted">跳到第 <input id="jumpNo" type="number" min="1" max="${p.pool.length}" value="${p.idx+1}" style="width:70px;padding:6px;border:1px solid var(--line);border-radius:8px"> 题</label>
      <button class="btn btn-ghost" id="jumpBtn">跳转</button>
    </div>
    <div class="qnav">${p.pool.map((x,i)=>{
      const k2=qkey(x.t,x.q);let c="";
      const r=p.results[k2];
      if(r)c=r.correct?"qnav-ok":"qnav-no";
      else if((p.answers[k2]||[]).length||(p.answers[k2+"_text"]||"").trim())c="qnav-done";
      return `<button class="qnav-btn ${c} ${i===p.idx?"qnav-cur":""}" data-i="${i}">${i+1}</button>`;
    }).join("")}</div>
  </div>`;

  bindOptions(t,q,sel,done);
  if(t==="qa"){document.getElementById("qaText").oninput=e=>{p.answers[key+"_text"]=e.target.value;};}
  document.getElementById("pQuit").onclick=()=>{state.practice=null;renderPractice();};

  if(done){
    const r=p.results[key];
    if(t==="qa")renderQaFeedback(t,q,key,r);
    else showChoiceFeedback(t,q,r.sel,r.correct);
  }

  const chk=document.getElementById("pCheck");
  if(chk)chk.onclick=()=>{
    if(t==="qa"){
      p.answers[key+"_text"]=document.getElementById("qaText").value;
      p.results[key]={self:undefined};
    }else{
      const curSel=(p.answers[key]||[]).slice();
      const correct=isCorrect(t,q,curSel);
      p.results[key]={correct,sel:curSel};
      if(correct)toggleWrong(t,q,false); else toggleWrong(t,q,true);
    }
    renderPracticeCard();
  };
  const prev=document.getElementById("pPrev"),next=document.getElementById("pNext");
  if(prev)prev.onclick=()=>{if(p.idx>0){p.idx--;renderPracticeCard();}};
  if(next)next.onclick=()=>{if(p.idx===p.pool.length-1){renderPracticeCard();}else{p.idx++;renderPracticeCard();}};
  document.getElementById("jumpBtn").onclick=()=>{
    const n=parseInt(document.getElementById("jumpNo").value);
    if(n>=1&&n<=p.pool.length){p.idx=n-1;renderPracticeCard();}
  };
  document.querySelectorAll(".qnav-btn").forEach(b=>b.onclick=()=>{p.idx=parseInt(b.dataset.i);renderPracticeCard();});
}

function renderOptions(t,q,sel,disabled){
  return q.options.map(o=>{
    const on=sel.includes(o.key);
    return `<div class="opt ${on?"sel":""} ${disabled?"disabled":""}" data-key="${o.key}">
      <span class="key">${o.key}.</span><span>${escapeHtml(o.text)}</span></div>`;
  }).join("");
}
function bindOptions(t,q,sel,disabled){
  document.querySelectorAll("#opts .opt").forEach(el=>{
    if(disabled){el.classList.add("disabled");return;}
    el.onclick=()=>{
      const k=el.dataset.key;
      let cur=state.practice.answers[qkey(t,q)]||[];
      if(t==="multi"){cur.includes(k)?cur.splice(cur.indexOf(k),1):cur.push(k);}
      else{cur=[k];}
      state.practice.answers[qkey(t,q)]=cur;
      document.querySelectorAll("#opts .opt").forEach(x=>x.classList.toggle("sel",cur.includes(x.dataset.key)));
    };
  });
}
function isCorrect(t,q,sel){
  const a=q.answer.slice().sort().join("");
  return sel.slice().sort().join("")===a;
}
function showChoiceFeedback(t,q,sel,correct){
  const fb=document.getElementById("fb");
  fb.style.display="block";
  fb.className="feedback "+(correct?"ok":"no");
  const right=q.answer.join("、");
  let html=`<div><b>${correct?"✓ 回答正确":"✗ 回答错误"}</b>　正确答案：${right}</div>`;
  if(q.explain)html+=`<div class="explain"><b>解析：</b>${escapeHtml(q.explain)}</div>`;
  fb.innerHTML=html;
  document.querySelectorAll("#opts .opt").forEach(el=>{
    const k=el.dataset.key;
    if(q.answer.includes(k))el.classList.add("correct");
    else if(sel.includes(k))el.classList.add("wrong");
  });
}
function renderQaFeedback(t,q,key,r){
  const fb=document.getElementById("fb");
  fb.style.display="block";
  fb.className="feedback ok";
  let selfHtml;
  if(r.self===undefined){
    selfHtml=`<div class="selfeval">
      <button class="btn btn-green" data-e="1">我答对了</button>
      <button class="btn btn-red" data-e="0">加入错题</button></div>`;
  }else{
    selfHtml=`<span class="chip">${r.self?"已计为答对":"已加入错题"}</span>`;
  }
  fb.innerHTML=`<div><b>参考答案要点：</b></div><div class="explain">${escapeHtml(q.explain||"（原表未提供要点）")}</div>${selfHtml}`;
  fb.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const ok=b.dataset.e==="1";
    state.practice.results[key].self=ok;
    toggleWrong(t,q,!ok);
    renderPracticeCard();
  });
}

/* ---------- 背题模式 ---------- */
function renderReview(){
  const types=Object.keys(DATA);
  app.innerHTML=`
  <div class="card">
    <div class="muted">背题模式：直接展示正确答案与解析，无需作答，可逐题浏览。</div>
    <div class="row">
      <label>题型：
        <select id="rType">
          <option value="all">全部</option>
          ${types.map(t=>`<option value="${t}">${TYPE_NAME[t]}（${DATA[t].length}）</option>`).join("")}
        </select>
      </label>
      <label>顺序：
        <select id="rOrder">
          <option value="seq">顺序</option>
          <option value="random">随机</option>
        </select>
      </label>
      <button class="btn btn-primary" id="rStart">开始背题</button>

  }

  const rightText=t==="judge"?(q.answer[0]==="T"?"√ 正确":"× 错误"):q.answer.join("、");
  let optsHtml="";
  if(q.options.length){
    optsHtml=`<div class="opts">${q.options.map(o=>{
      const ok=q.answer.includes(o.key);
      return `<div class="opt ${ok?"correct":""} disabled"><span class="key">${o.key}.</span><span>${escapeHtml(o.text)}</span></div>`;
    }).join("")}</div>`;
  }
  let fbHtml="";
  if(t==="qa"){
    fbHtml=`<div class="feedback ok" style="display:block"><div><b>参考答案要点：</b></div><div class="explain">${escapeHtml(q.explain||"（原表未提供要点）")}</div></div>`;
  }else{
    fbHtml=`<div class="feedback ok" style="display:block"><div><b>正确答案：${rightText}</b></div>
      ${q.explain?`<div class="explain"><b>解析：</b>${escapeHtml(q.explain)}</div>`:""}</div>`;
  }
  app.innerHTML=`
  <div class="card">
    <div class="muted">第 ${r.idx+1} / ${r.pool.length} 题</div>
    <div class="progress"><i style="width:${r.idx/r.pool.length*100}%"></i></div>
    <div><span class="tag ${t}">${TYPE_NAME[t]}</span><span class="muted">题号 ${q.no}</span></div>
    <div class="stem">${escapeHtml(q.stem)}</div>
    ${optsHtml}
    ${fbHtml}
    <div class="row">
      <button class="btn btn-ghost" id="rPrev">上一题</button>
      <button class="btn btn-primary" id="rNext">${r.idx===r.pool.length-1?"完成":"下一题"}</button>
      <button class="btn btn-ghost" id="rQuit">退出背题</button>
    </div>
    <div class="row">
      <label class="muted">跳到第 <input id="jumpNo" type="number" min="1" max="${r.pool.length}" value="${r.idx+1}" style="width:70px;padding:6px;border:1px solid var(--line);border-radius:8px"> 题</label>
      <button class="btn btn-ghost" id="jumpBtn">跳转</button>
    </div>
    <div class="qnav">${r.pool.map((x,i)=>`<button class="qnav-btn ${i===r.idx?"qnav-cur":""}" data-i="${i}">${i+1}</button>`).join("")}</div>
  </div>`;
  document.getElementById("rQuit").onclick=()=>{state.review=null;renderReview();};
  const prev=document.getElementById("rPrev"),next=document.getElementById("rNext");
  if(prev)prev.onclick=()=>{if(r.idx>0){r.idx--;renderReviewCard();}};
  if(next)next.onclick=()=>{if(r.idx===r.pool.length-1){renderReviewCard();}else{r.idx++;renderReviewCard();}};
  document.getElementById("jumpBtn").onclick=()=>{
    const n=parseInt(document.getElementById("jumpNo").value);
    if(n>=1&&n<=r.pool.length){r.idx=n-1;renderReviewCard();}
  };
  document.querySelectorAll(".qnav-btn").forEach(b=>b.onclick=()=>{r.idx=parseInt(b.dataset.i);renderReviewCard();});
}
function backToReviewHome(){state.review=null;renderReview();}

/* ---------- 模拟考试 ---------- */
function renderExamHome(){
  const total=Object.values(EXAM_PLAN).reduce((a,b)=>a+b,0);
  app.innerHTML=`
  <div class="card">
    <h3>模拟考试组卷规则</h3>
    <div class="row" style="margin-top:12px">
      ${Object.keys(EXAM_PLAN).map(t=>`<span class="chip">${TYPE_NAME[t]} ${EXAM_PLAN[t]} 题 · 每题 ${SCORE[t]} 分</span>`).join("")}
    </div>
    <p class="muted" style="margin-top:12px">共 ${total} 题，满分 100 分。多选需全部选对方可得分；简答提交后对照要点自评。题目每次随机抽取。</p>
    <div class="row"><button class="btn btn-primary" id="startExam">开始考试</button></div>
  </div>`;
  document.getElementById("startExam").onclick=()=>{
    const paper=[];
    Object.keys(EXAM_PLAN).forEach(t=>{
      shuffle(DATA[t]).slice(0,EXAM_PLAN[t]).forEach(q=>paper.push({t,q}));
    });

    renderExamCard();

}

function renderExamCard(){
  const e=state.exam;
  const {t,q}=e.paper[e.idx];
  const sel=e.answers[qkey(t,q)]||[];
  const answered=sel.length>0||(t==="qa"&&(e.answers[qkey(t,q)+"_text"]||"").trim());
  app.innerHTML=`
  <div class="card">
    <div class="muted">第 ${e.idx+1} / ${e.paper.length} 题</div>
    <div class="progress"><i style="width:${e.idx/e.paper.length*100}%"></i></div>
    <div><span class="tag ${t}">${TYPE_NAME[t]}</span><span class="muted">${SCORE[t]} 分</span></div>
    <div class="stem">${escapeHtml(q.stem)}</div>
    <div class="opts" id="opts">${renderOptions(t,q,sel,false)}</div>
    ${t==="qa"?`<textarea class="qa-box" id="qaText" placeholder="输入你的作答">${escapeHtml(e.answers[qkey(t,q)+"_text"]||"")}</textarea>`:""}
    <div class="row">
      <button class="btn btn-ghost" id="ePrev">上一题</button>
      <button class="btn btn-ghost" id="eNext">${e.idx===e.paper.length-1?"交卷":"下一题"}</button>
      <button class="btn btn-ghost" id="eQuit">退出考试</button>
    </div>
    <div class="qnav">${e.paper.map((x,i)=>{
      const k2=qkey(x.t,x.q);
      const ans=(e.answers[k2]||[]).length||(e.answers[k2+"_text"]||"").trim();
      return `<button class="qnav-btn ${ans?"qnav-done":""} ${i===e.idx?"qnav-cur":""}" data-i="${i}">${i+1}</button>`;
    }).join("")}</div>
  </div>`;
  bindOptionsExam(t,q,sel);
  document.querySelectorAll("#app .qnav-btn").forEach(b=>b.onclick=()=>{e.idx=parseInt(b.dataset.i);renderExamCard();});
  if(t==="qa")document.getElementById("qaText").oninput=ev=>{e.answers[qkey(t,q)+"_text"]=ev.target.value;};
  document.getElementById("ePrev").onclick=()=>{if(e.idx>0){e.idx--;renderExamCard();}};
  document.getElementById("eQuit").onclick=()=>{if(confirm("确定退出本次考试？作答不会保存。")){state.exam=null;renderExamHome();}};
  document.getElementById("eNext").onclick=()=>{
    if(t==="qa")e.answers[qkey(t,q)+"_text"]=document.getElementById("qaText").value;
    if(e.idx===e.paper.length-1){submitExam();}
    else{e.idx++;renderExamCard();}
  };
}
function bindOptionsExam(t,q,sel){
  document.querySelectorAll("#opts .opt").forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.key;
      let cur=state.exam.answers[qkey(t,q)]||[];
      if(t==="multi"){cur.includes(k)?cur.splice(cur.indexOf(k),1):cur.push(k);}else{cur=[k];}
      state.exam.answers[qkey(t,q)]=cur;
      document.querySelectorAll("#opts .opt").forEach(x=>x.classList.toggle("sel",cur.includes(x.dataset.key)));
    };
  });
}

function submitExam(){
  const e=state.exam;
  let score=0,detail={single:{r:0,a:0},multi:{r:0,a:0},judge:{r:0,a:0},qa:{r:0,a:0}};
  const wrongList=[];
  e.paper.forEach(({t,q})=>{
    detail[t].a++;
    if(t==="qa"){
      // 简答待自评，先不计入自动分；结果页处理
      return;
    }
    const sel=e.answers[qkey(t,q)]||[];
    if(isCorrect(t,q,sel)){score+=SCORE[t];detail[t].r++;}
    else{wrongList.push({t,q,sel});toggleWrong(t,q,true);}
  });
  state.exam.autoScore=score;
  state.exam.wrongList=wrongList;
  state.exam.detail=detail;
  state.exam.submitted=true;
  renderExamResult();
}

function renderExamResult(){
  const e=state.exam;
  // 简答自评区
  const qaList=e.paper.filter(x=>x.t==="qa");
  let qaScore=0;
  const qaHtml=qaList.map(({t,q},i)=>{
    const ev=e.qaEval[qkey(t,q)];
    const ans=e.answers[qkey(t,q)+"_text"]||"";
    return `<div class="card" style="margin-bottom:10px">
      <div><span class="tag qa">简答 ${SCORE[t]} 分</span><span class="muted">题号 ${q.no}</span></div>
      <div class="stem">${escapeHtml(q.stem)}</div>
      <div class="explain"><b>我的作答：</b>${escapeHtml(ans)||"（未作答）"}</div>
      <div class="explain"><b>参考答案要点：</b>${escapeHtml(q.explain||"（原表未提供）")}</div>
      <div class="selfeval" data-q="${qkey(t,q)}">
        ${ev===undefined?`<button class="btn btn-green" data-v="1">答对 +${SCORE[t]}分</button><button class="btn btn-red" data-v="0">答错</button>`
          :`<span class="chip">${ev?`已计 ${SCORE[t]} 分`:"未得分"}</span>`}
      </div></div>`;
  }).join("");

  const obj=Object.keys(e.detail).map(t=>`${TYPE_NAME[t]} ${e.detail[t].r}/${e.detail[t].a}`).join("　");
  app.innerHTML=`
  <div class="card">
    <h3>考试结果</h3>
    <div class="score-big" id="finalScore">${e.autoScore} 分（客观题）</div>
    <p class="muted" style="text-align:center">${obj}</p>
    <div class="row" style="justify-content:center">
      <button class="btn btn-ghost" id="saveHist">保存本次成绩</button>
      <button class="btn btn-ghost" onclick="state.exam=null;renderExamHome()">返回</button>
    </div>
  </div>
  <h3 style="margin:14px 0 8px">简答自评（${qaList.length} 题）</h3>
  ${qaHtml}
  <h3 style="margin:14px 0 8px">客观题答错清单</h3>
  <div id="wrongBox"></div>`;

  // 简答自评绑定
  document.querySelectorAll(".selfeval").forEach(box=>{
    const key=box.dataset.q;
    box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      e.qaEval[key]=b.dataset.v==="1";
      toggleWrongByKey(key,!e.qaEval[key]);
      renderExamResult();
    });
  });
  // 计算总分
  function refreshTotal(){
    let qa=0;Object.values(e.qaEval).forEach(v=>{if(v)qa+=SCORE.qa;});
    document.getElementById("finalScore").textContent=(e.autoScore+qa)+" 分";
  }
  refreshTotal();

  document.getElementById("saveHist").onclick=()=>{
    let qa=0;Object.values(e.qaEval).forEach(v=>{if(v)qa+=SCORE.qa;});
    const total=e.autoScore+qa;
    const hist=loadLS(LS_HIST,[]);
    hist.push({date:new Date().toLocaleString(),score:total,total:e.paper.length,obj:JSON.parse(JSON.stringify(e.detail))});
    saveLS(LS_HIST,hist);
    alert("成绩已保存，可在成绩统计查看。");
    state.exam=null;renderStats();
  };
  // 错题清单
  const wb=document.getElementById("wrongBox");
  wb.innerHTML=e.wrongList.length?e.wrongList.map(({t,q,sel})=>`
    <div class="card" style="margin-bottom:10px">
      <div><span class="tag ${t}">${TYPE_NAME[t]}</span><span class="muted">题号 ${q.no}</span></div>
      <div class="stem">${escapeHtml(q.stem)}</div>
      <div class="explain"><b>你的选择：</b>${sel.join("、")||"未作答"}　<b>正确答案：</b>${q.answer.join("、")}</div>
      ${q.explain?`<div class="explain"><b>解析：</b>${escapeHtml(q.explain)}</div>`:""}
    </div>`).join(""):`<div class="card muted">客观题全部答对，很棒！</div>`;
}
function toggleWrongByKey(key,add){
  const [t,no]=key.split("#");toggleWrong(t,{no:parseInt(no)},add);
}

/* ---------- 错题本 ---------- */
function renderWrong(){
  const w=getWrong();
  let pool=[];
  Object.keys(w).forEach(t=>{w[t].forEach(no=>{const q=DATA[t].find(x=>x.no===no);if(q)pool.push({t,q});});});
  if(!pool.length){app.innerHTML=`<div class="card muted">暂无错题，继续保持！</div>`;return;}
  app.innerHTML=`
  <div class="card">
    <div class="muted">共 ${pool.length} 道错题，可逐题重练；答对后自动移出错题本。</div>
    <div class="row"><button class="btn btn-primary" id="wStart">开始重练</button>
    <button class="btn btn-ghost" id="wClear">清空错题本</button></div>
  </div>`;
  document.getElementById("wStart").onclick=()=>{
    state.practice={pool:shuffle(pool),idx:0,answers:{},results:{},fromWrong:true};
    renderPracticeCard();
  };
  document.getElementById("wClear").onclick=()=>{if(confirm("确定清空全部错题？")){setWrong({single:[],multi:[],judge:[],qa:[]});renderWrong();}};
}

/* ---------- 成绩统计 ---------- */
function renderStats(){
  const hist=loadLS(LS_HIST,[]);
  const w=getWrong();
  const wCount=Object.values(w).reduce((a,b)=>a+b.length,0);
  const avg=hist.length?(hist.reduce((a,h)=>a+h.score,0)/hist.length).toFixed(1):"—";
  app.innerHTML=`
  <div class="stat-grid">
    <div class="stat"><div class="num">${hist.length}</div><div class="muted">考试次数</div></div>
    <div class="stat"><div class="num">${avg}</div><div class="muted">平均分</div></div>
    <div class="stat"><div class="num">${hist.length?Math.max(...hist.map(h=>h.score)):"—"}</div><div class="muted">最高分</div></div>
    <div class="stat"><div class="num">${wCount}</div><div class="muted">当前错题</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    ${hist.length?`<table><thead><tr><th>时间</th><th>得分</th><th>题数</th><th>题型答对情况</th></tr></thead><tbody>
      ${hist.slice().reverse().map(h=>`<tr><td>${h.date}</td><td><b>${h.score}</b></td><td>${h.total}</td><td class="muted">${Object.keys(h.obj).map(t=>`${TYPE_NAME[t]} ${h.obj[t].r}/${h.obj[t].a}`).join("，")}</td></tr>`).join("")}
    </tbody></table>`:`<div class="muted">暂无考试记录，先去完成一次模拟考试吧。</div>`}
  </div>`;
}

function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

render();
</script>
</body>
</html>
